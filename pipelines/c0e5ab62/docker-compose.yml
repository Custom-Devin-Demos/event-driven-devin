# Billing migration rehearsal: the data-centre source and the cloud target.
# Start with `npm run c0e5ab62:up`; both databases are disposable.
services:
  source:
    image: postgres:15
    environment:
      POSTGRES_DB: billing
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: billing
    ports:
      - "55432:5432"
    volumes:
      - ./sql/source-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/source-seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing -d billing"]
      interval: 2s
      timeout: 3s
      retries: 30
  target:
    image: postgres:15
    environment:
      POSTGRES_DB: billing
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: billing
    ports:
      - "55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing -d billing"]
      interval: 2s
      timeout: 3s
      retries: 30
