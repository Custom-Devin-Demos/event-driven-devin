version: '3.8'

services:
  # ─── Acme Commerce API ───────────────────────────────
  checkout-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # Persist webinar signup capture across rebuilds/redeploys
      - ./data:/app/data
    environment:
      - PORT=3000
      - NODE_ENV=production
      - APP_VERSION=${APP_VERSION:-1.0.0}
      - APP_SCENARIO=${APP_SCENARIO:-healthy}
      # Sentry
      - SENTRY_DSN=${SENTRY_DSN}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-prod}
      - SENTRY_RELEASE=${SENTRY_RELEASE:-acme-checkout@1.0.0}
      - SENTRY_TRACES_SAMPLE_RATE=${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      - SENTRY_PROFILES_SAMPLE_RATE=${SENTRY_PROFILES_SAMPLE_RATE:-0.1}
      - SENTRY_DROPPED_SPAN_OPS=${SENTRY_DROPPED_SPAN_OPS:-router.express,middleware.express}
      - SENTRY_ORG_SLUG=${SENTRY_ORG_SLUG:-}
      - SENTRY_PROJECT_ID=${SENTRY_PROJECT_ID:-}
      - SENTRY_CLIENT_SECRET=${SENTRY_CLIENT_SECRET:-}
      # Datadog
      - DD_ENV=${DD_ENV:-prod}
      - DD_SERVICE=${DD_SERVICE:-checkout-api}
      - DD_VERSION=${DD_VERSION:-1.0.0}
      - DD_AGENT_HOST=datadog-agent
      - DD_TRACE_AGENT_PORT=8126
      - DD_DOGSTATSD_PORT=8125
      - DD_DASHBOARD_URL=${DD_DASHBOARD_URL:-}
      # Datadog Incident Management (SEV-1 declare/resolve from /oncall)
      - DD_API_KEY=${DD_API_KEY:-}
      - DD_SITE=${DD_SITE:-us5.datadoghq.com}
      - DD_APPLICATION_KEY=${DD_APPLICATION_KEY:-}
      - DD_INCIDENT_APP_KEY=${DD_INCIDENT_APP_KEY:-}
      - DEVIN_SLACK_MEMBER_ID=${DEVIN_SLACK_MEMBER_ID:-}
      # GitHub
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-}
      - GITHUB_PAT=${GITHUB_PAT:-}
      # Devin API (for auto-investigation via Sentry webhooks)
      - DEVIN_SERVICE_KEY=${DEVIN_SERVICE_KEY:-}
      - DEVIN_API_KEY=${DEVIN_API_KEY:-}
      - DEVIN_ORG_ID=${DEVIN_ORG_ID:-}
      - DEVIN_ORG_NAME=${DEVIN_ORG_NAME:-}
      # Slack (alert notifications)
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN:-}
      - SLACK_CHANNEL_ID=${SLACK_CHANNEL_ID:-}
      - SLACK_USER_TOKEN=${SLACK_USER_TOKEN:-}
      # Devin On-Call demo channels
      - SLACK_ONCALL_ALERTS_CHANNEL_ID=${SLACK_ONCALL_ALERTS_CHANNEL_ID:-}
      - SLACK_ONCALL_BUGS_CHANNEL_ID=${SLACK_ONCALL_BUGS_CHANNEL_ID:-}
      - SLACK_ONCALL_BOT_TOKEN=${SLACK_ONCALL_BOT_TOKEN:-}
      # Devin trigger mode: "slack" (default, via @mention) or "api" (direct API)
      - DEVIN_TRIGGER_MODE=${DEVIN_TRIGGER_MODE:-slack}
      - DEVIN_SLACK_USER_ID=${DEVIN_SLACK_USER_ID:-}
      - DEVIN_PLAYBOOK_ID=${DEVIN_PLAYBOOK_ID:-}
      # Session creation verification
      - SESSION_SECRET=${SESSION_SECRET:-}
      # SonarCloud remediation target
      - SONAR_TARGET_REPO=${SONAR_TARGET_REPO:-}
      # Webinar signup alert emails (AWS SES)
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_SES_REGION=${AWS_SES_REGION:-us-east-1}
      - WEBINAR_FROM_EMAIL=${WEBINAR_FROM_EMAIL:-quinn.hilgartner@cognition.ai}
      - WEBINAR_ALERT_RECIPIENTS=${WEBINAR_ALERT_RECIPIENTS:-quinn.hilgartner@cognition.ai,bain.schroeder@cognition.ai}
      # Webinar signup -> Google Sheet (Apps Script Web App webhook)
      - WEBINAR_SHEET_WEBHOOK_URL=${WEBINAR_SHEET_WEBHOOK_URL:-}
      - WEBINAR_SHEET_WEBHOOK_TOKEN=${WEBINAR_SHEET_WEBHOOK_TOKEN:-}
      # Deployment configuration
      - GITHUB_ORG=${GITHUB_ORG:-}
      - APP_TITLE=${APP_TITLE:-}
      - LOCK_ORG=${LOCK_ORG:-}
      - DEVIN_USER_ID=${DEVIN_USER_ID:-}
