      - ONPREM_BASE_URL=${ONPREM_BASE_URL:-http://onprem-legacy:4001}
    depends_on:
      - datadog-agent
    restart: unless-stopped
    # Allow in-flight requests to drain before the container is killed
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─── Nginx Reverse Proxy (SSL termination) ────────────
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:-localhost}
      # Only substitute DOMAIN_NAME — leave nginx variables ($host, $scheme, etc.) untouched
      - NGINX_ENVSUBST_FILTER=DOMAIN_NAME
    depends_on:
      checkout-api:
        condition: service_healthy
    restart: unless-stopped

  # ─── Certbot (Let's Encrypt certificate renewal) ──────
  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    # Check for renewal every 12 hours; reload nginx after each attempt
    entrypoint: >-
      /bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; wget -qO- http://nginx:80/ > /dev/null 2>&1; sleep 12h & wait $${!}; done'
    depends_on:
      - nginx
    restart: unless-stopped

  # ─── Traffic Generator ───────────────────────────────
  loadgen:
    build:
      context: .
      dockerfile: Dockerfile.loadgen
    environment:
      - LOADGEN_TARGET_URL=http://checkout-api:3000
      - LOADGEN_INTERVAL_MS=${LOADGEN_INTERVAL_MS:-300000}
    depends_on:
      checkout-api:
        condition: service_healthy
    restart: unless-stopped

  # ─── Legacy On-Prem Inventory System (Eli Lilly demo) ───
  # Simulates an on-prem mainframe/ERP inventory service targeted for cloud migration.
  onprem-legacy:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "onprem/legacy-inventory-server.js"]
    environment:
      - ONPREM_PORT=4001
    restart: unless-stopped
    expose:
      - "4001"

  # ─── Datadog Agent ──────────────────────────────────
  datadog-agent:
    image: gcr.io/datadoghq/agent:7
    environment:
      - DD_API_KEY=${DD_API_KEY}
      - DD_SITE=${DD_SITE:-datadoghq.com}
      - DD_APM_ENABLED=true
      - DD_APM_NON_LOCAL_TRAFFIC=true
      - DD_DOGSTATSD_NON_LOCAL_TRAFFIC=true
      - DD_LOGS_ENABLED=true
      - DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL=true
      - DD_CONTAINER_EXCLUDE="name:datadog-agent"
      - DD_PROCESS_AGENT_ENABLED=true
    ports:
      - "8126:8126"   # APM traces
      - "8125:8125/udp" # DogStatsD
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
    restart: unless-stopped
