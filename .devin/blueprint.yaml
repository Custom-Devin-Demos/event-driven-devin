# https://docs.devin.ai/onboard-devin/environment-yaml
maintenance: |
  npm install
  (cd standing-service/template && npm install)
knowledge:
  - name: lint
    contents: |
      npm run lint
  - name: test
    contents: |
      npm test  # tests/automations-demo.test.js has 1 pre-existing failure on main
  - name: start
    contents: |
      cp -n .env.example .env && npm start  # Express app on port 3000; curl localhost:3000/health
