# Azure DevOps pipeline (mirrors Chipotle's CI/CD backbone).
# Enforces the same 90% coverage gate as the GitHub Actions workflow.
trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '20.x'
    displayName: Install Node.js

  - script: npm ci
    displayName: Install dependencies

  - script: npm run test:coverage
    displayName: Unit tests + 90% coverage gate

  - task: PublishCodeCoverageResults@2
    condition: succeededOrFailed()
    inputs:
      summaryFileLocation: '$(System.DefaultWorkingDirectory)/coverage/lcov.info'
    displayName: Publish coverage
