name: Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

# One deploy at a time from this repo; the host-side flock in
# scripts/deploy-ec2.sh additionally serializes deploys across both source
# repos and the manual playbook.
concurrency:
  group: deploy-ec2
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          if [ -z "$EC2_SSH_KEY" ] || [ -z "$EC2_HOST" ]; then
            echo "::error::EC2_SSH_KEY and EC2_HOST must both be set in this repo's Actions secrets"; exit 1
          fi
          mkdir -p ~/.ssh
          umask 077
          # Accept the PEM as pasted with real newlines, with literal "\n", or flattened onto
          # one line (newlines turned into spaces) and rewrite it in canonical form.
          KEY=$(printf '%s' "$EC2_SSH_KEY" | sed 's/\\n/\n/g' | tr -d '\r')
          if [ "$(printf '%s\n' "$KEY" | wc -l)" -gt 2 ]; then
            printf '%s\n' "$KEY" > ~/.ssh/ec2_key
          else
            HEAD=$(printf '%s' "$KEY" | grep -oE -- '-----BEGIN [A-Z ]+-----' | head -1)
            TAIL=$(printf '%s' "$KEY" | grep -oE -- '-----END [A-Z ]+-----' | head -1)
            {
              printf '%s\n' "$HEAD"
              printf '%s' "$KEY" | sed -e "s/$HEAD//" -e "s/$TAIL//" | tr -d ' \n' | fold -w 64
              printf '\n%s\n' "$TAIL"
            } > ~/.ssh/ec2_key
          fi
          chmod 600 ~/.ssh/ec2_key
          if ! ssh-keygen -y -f ~/.ssh/ec2_key > /dev/null 2>&1; then
            echo "::error::EC2_SSH_KEY is not a parseable private key (check it was pasted completely)"; exit 1
          fi
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Create release tarball
        run: |
          tar czf /tmp/release.tar.gz \
            --exclude=node_modules \
            --exclude=.git \
            --exclude=.env \
            --exclude=certbot \
            --exclude=avature-src \
            --exclude=f2ec3d90-src \
            -C . .

      # Everything this workflow writes on the host goes under /var/tmp, outside
      # /home/ubuntu: that directory is the Docker build context of the deploy
      # running there, and files appearing/vanishing in it mid-build (another
      # repo's release upload + extract) produced images missing src/ and vendor/.
      # /var/tmp is shared, so the directory is created mode 700 and must be
      # owned by the deploy user before anything (incl. env-sync secrets) lands in it.
      - name: Upload release to EC2
        run: |
          ssh -i ~/.ssh/ec2_key ubuntu@${{ secrets.EC2_HOST }} 'install -d -m 700 /var/tmp/devindemos-deploy && [ -O /var/tmp/devindemos-deploy ]'
          scp -i ~/.ssh/ec2_key \
            /tmp/release.tar.gz \
            ubuntu@${{ secrets.EC2_HOST }}:/var/tmp/devindemos-deploy/release-${{ github.sha }}.tar.gz

      # Optional: stage the Teams Workflow webhooks into the host .env from
      # Actions secrets, so they can be set without SSH access:
      #   MAIN_ONCALL_TEAMS_WEBHOOK_URL      -> ONCALL_TEAMS_WEBHOOK_URL (On-Call alerts)
      #   MAIN_AUTOMATIONS_TEAMS_WEBHOOK_URL -> AUTOMATIONS_TEAMS_WEBHOOK_URL (hub demo alerts)
      #   LOWES_TEAMS_WEBHOOK_URL -> LOWES_TEAMS_WEBHOOK_URL (Lowe’s only, eashan-demo)
      #   MAIN_ONCALL_TEAMS_WEBHOOK_URL_COGNITION_AI -> ONCALL_TEAMS_WEBHOOK_URL_COGNITION_AI
      #     (On-Call skins with teamsWebhookEnv: 'ONCALL_TEAMS_WEBHOOK_URL_COGNITION_AI')
      #   MAIN_ONCALL_TEAMS_WEBHOOK_URL_HEALTHCARE -> ONCALL_TEAMS_WEBHOOK_URL_HEALTHCARE
      #     (PBM, payer, and life-sciences On-Call scenario alerts)
      #   MAIN_BNY_IOS_BOT_WEBHOOK_SECRET -> BNY_IOS_BOT_WEBHOOK_SECRET (BNY iOS Engineer Bot webhook)
      # deploy-ec2.sh applies them under the deploy lock, after its .env backup.
      # Skipped when neither secret is set.
      - name: Stage Teams webhooks for host .env
        env:
          ONCALL_TEAMS_WEBHOOK_URL: ${{ secrets.MAIN_ONCALL_TEAMS_WEBHOOK_URL }}
          AUTOMATIONS_TEAMS_WEBHOOK_URL: ${{ secrets.MAIN_AUTOMATIONS_TEAMS_WEBHOOK_URL }}
          LOWES_TEAMS_WEBHOOK_URL: ${{ secrets.LOWES_TEAMS_WEBHOOK_URL }}
          ONCALL_TEAMS_WEBHOOK_URL_COGNITION_AI: ${{ secrets.MAIN_ONCALL_TEAMS_WEBHOOK_URL_COGNITION_AI }}
          ONCALL_TEAMS_WEBHOOK_URL_HEALTHCARE: ${{ secrets.MAIN_ONCALL_TEAMS_WEBHOOK_URL_HEALTHCARE }}
          BNY_IOS_BOT_WEBHOOK_SECRET: ${{ secrets.MAIN_BNY_IOS_BOT_WEBHOOK_SECRET }}
        run: |
          sync=""
          if [ -n "$ONCALL_TEAMS_WEBHOOK_URL" ]; then
            sync+="ONCALL_TEAMS_WEBHOOK_URL=$ONCALL_TEAMS_WEBHOOK_URL"$'\n'
          fi
          if [ -n "$AUTOMATIONS_TEAMS_WEBHOOK_URL" ]; then
            sync+="AUTOMATIONS_TEAMS_WEBHOOK_URL=$AUTOMATIONS_TEAMS_WEBHOOK_URL"$'\n'
          fi
          if [ -n "$LOWES_TEAMS_WEBHOOK_URL" ]; then
            sync+="LOWES_TEAMS_WEBHOOK_URL=$LOWES_TEAMS_WEBHOOK_URL"$'\n'
          fi
          if [ -n "$ONCALL_TEAMS_WEBHOOK_URL_COGNITION_AI" ]; then
            sync+="ONCALL_TEAMS_WEBHOOK_URL_COGNITION_AI=$ONCALL_TEAMS_WEBHOOK_URL_COGNITION_AI"$'\n'
          fi
          if [ -n "$ONCALL_TEAMS_WEBHOOK_URL_HEALTHCARE" ]; then
            sync+="ONCALL_TEAMS_WEBHOOK_URL_HEALTHCARE=$ONCALL_TEAMS_WEBHOOK_URL_HEALTHCARE"$'\n'
          fi
          if [ -n "$BNY_IOS_BOT_WEBHOOK_SECRET" ]; then
            sync+="BNY_IOS_BOT_WEBHOOK_SECRET=$BNY_IOS_BOT_WEBHOOK_SECRET"$'\n'
          fi
          if [ -z "$sync" ]; then
            echo "No Teams webhook secrets set; host .env left unchanged"; exit 0
          fi
          printf '%s' "$sync" | \
            ssh -i ~/.ssh/ec2_key ubuntu@${{ secrets.EC2_HOST }} \
            'install -d -m 700 /var/tmp/devindemos-deploy && [ -O /var/tmp/devindemos-deploy ] && umask 077 && cat > /var/tmp/devindemos-deploy/env-sync-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}'

      # Optional Regions Batch credentials; unset secrets leave host values intact.
      - name: Stage Regions Batch PagerDuty secrets for host .env
        env:
          BATCH_PD_ROUTING_KEY_MFT: ${{ secrets.BATCH_PD_ROUTING_KEY_MFT }}
          BATCH_PD_ROUTING_KEY_SQL: ${{ secrets.BATCH_PD_ROUTING_KEY_SQL }}
          BATCH_PD_ROUTING_KEY_MF: ${{ secrets.BATCH_PD_ROUTING_KEY_MF }}
          BATCH_PD_API_TOKEN: ${{ secrets.BATCH_PD_API_TOKEN }}
          BATCH_PD_WEBHOOK_SECRET: ${{ secrets.BATCH_PD_WEBHOOK_SECRET }}
        run: |
          sync=""
          for key in BATCH_PD_ROUTING_KEY_MFT BATCH_PD_ROUTING_KEY_SQL BATCH_PD_ROUTING_KEY_MF BATCH_PD_API_TOKEN BATCH_PD_WEBHOOK_SECRET; do
            if [ -n "${!key}" ]; then sync+="$key=${!key}"$'\n'; fi
          done
          if [ -z "$sync" ]; then
            echo "No Regions Batch secrets set; host .env left unchanged"; exit 0
          fi
          printf '%s' "$sync" | \
            ssh -i ~/.ssh/ec2_key ubuntu@${{ secrets.EC2_HOST }} \
            'install -d -m 700 /var/tmp/devindemos-deploy && [ -O /var/tmp/devindemos-deploy ] && umask 077 && cat >> /var/tmp/devindemos-deploy/env-sync-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}'

      # Optional: Field CTO reservations Slack app (/fcto) credentials, staged the
      # same way. Actions secrets FCTO_SLACK_SIGNING_SECRET / FCTO_SLACK_BOT_TOKEN
      # map to the same .env keys; FCTO_CHANNEL_ID is the #exec-field-requests ID
      # (override with the FCTO_CHANNEL_ID Actions variable). Appends to the file
      # staged above. Skipped unless both secrets are set.
      - name: Stage FCTO Slack app config for host .env
        env:
          FCTO_SLACK_SIGNING_SECRET: ${{ secrets.FCTO_SLACK_SIGNING_SECRET }}
          FCTO_SLACK_BOT_TOKEN: ${{ secrets.FCTO_SLACK_BOT_TOKEN }}
          FCTO_CHANNEL_ID: ${{ vars.FCTO_CHANNEL_ID || 'C0C96AUKY7R' }}
        run: |
          if [ -z "$FCTO_SLACK_SIGNING_SECRET" ] || [ -z "$FCTO_SLACK_BOT_TOKEN" ]; then
            echo "FCTO_SLACK_SIGNING_SECRET and FCTO_SLACK_BOT_TOKEN not both set; FCTO .env keys left unchanged"; exit 0
          fi
          printf 'FCTO_SLACK_SIGNING_SECRET=%s\nFCTO_SLACK_BOT_TOKEN=%s\nFCTO_CHANNEL_ID=%s\n' \
            "$FCTO_SLACK_SIGNING_SECRET" "$FCTO_SLACK_BOT_TOKEN" "$FCTO_CHANNEL_ID" | \
            ssh -i ~/.ssh/ec2_key ubuntu@${{ secrets.EC2_HOST }} \
            'install -d -m 700 /var/tmp/devindemos-deploy && [ -O /var/tmp/devindemos-deploy ] && umask 077 && cat >> /var/tmp/devindemos-deploy/env-sync-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}'

      # Optional NEXEN SRE Bot automation webhook secret; unset leaves the host
      # .env value unchanged.
      - name: Stage NEXEN SRE Bot webhook secret for host .env
        env:
          NEXEN_SRE_BOT_WEBHOOK_SECRET: ${{ secrets.MAIN_NEXEN_SRE_BOT_WEBHOOK_SECRET }}
        run: |
          if [ -z "$NEXEN_SRE_BOT_WEBHOOK_SECRET" ]; then
            echo "MAIN_NEXEN_SRE_BOT_WEBHOOK_SECRET not set; host .env key left unchanged"; exit 0
          fi
          if [[ ! "$NEXEN_SRE_BOT_WEBHOOK_SECRET" =~ ^[^[:space:]]{1,256}$ ]]; then
            echo "MAIN_NEXEN_SRE_BOT_WEBHOOK_SECRET has an unexpected format; host .env key left unchanged"; exit 0
          fi
          printf 'NEXEN_SRE_BOT_WEBHOOK_SECRET=%s\n' "$NEXEN_SRE_BOT_WEBHOOK_SECRET" | \
            ssh -i ~/.ssh/ec2_key ubuntu@${{ secrets.EC2_HOST }} \
            'install -d -m 700 /var/tmp/devindemos-deploy && [ -O /var/tmp/devindemos-deploy ] && umask 077 && cat >> /var/tmp/devindemos-deploy/env-sync-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}'

      # Optional: PIF Ecosystem Outlook PoC (/pif). Actions secrets with the same
      # names map to the host .env: PIF_ACCESS_CODE (the gate stays locked
      # without it) and PIF_OPENAI_API_KEY / PIF_FIREWORKS_API_KEY (live AI
      # answers). Appends to the file staged above; unset secrets are skipped.
      - name: Stage PIF PoC config for host .env
        env:
          PIF_ACCESS_CODE: ${{ secrets.PIF_ACCESS_CODE }}
          PIF_OPENAI_API_KEY: ${{ secrets.PIF_OPENAI_API_KEY }}
          PIF_FIREWORKS_API_KEY: ${{ secrets.PIF_FIREWORKS_API_KEY }}
        run: |
          sync=""
          for key in PIF_ACCESS_CODE PIF_OPENAI_API_KEY PIF_FIREWORKS_API_KEY; do
            if [ -n "${!key}" ]; then sync+="$key=${!key}"$'\n'; fi
          done
          if [ -z "$sync" ]; then
            echo "No PIF secrets set; PIF .env keys left unchanged"; exit 0
          fi
          printf '%s' "$sync" | \
            ssh -i ~/.ssh/ec2_key ubuntu@${{ secrets.EC2_HOST }} \
            'install -d -m 700 /var/tmp/devindemos-deploy && [ -O /var/tmp/devindemos-deploy ] && umask 077 && cat >> /var/tmp/devindemos-deploy/env-sync-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}'

      # Everything below happens on the host through scripts/deploy-ec2.sh
      # (taken from the release being deployed): lock, backup, mirror the tree
      # while preserving verticals + host-only files, build, health, smoke every
      # vertical URL, automatic rollback on failure.
      - name: Deploy on EC2
        run: |
          ssh -i ~/.ssh/ec2_key ubuntu@${{ secrets.EC2_HOST }} bash -s <<'EOF'
          set -euo pipefail
          SHA="${{ github.sha }}"
          INCOMING=/var/tmp/devindemos-deploy
          [ -O "$INCOMING" ] || { echo "::error::$INCOMING is not owned by $(id -un)"; exit 1; }
          STAGING="$INCOMING/$SHA"
          rm -rf "$STAGING" && mkdir -p "$STAGING"
          tar xzf "$INCOMING/release-$SHA.tar.gz" -C "$STAGING"
          rm -f "$INCOMING/release-$SHA.tar.gz"
          ENV_SYNC="$INCOMING/env-sync-$SHA-${{ github.run_id }}-${{ github.run_attempt }}"
          trap 'rm -rf "$STAGING" "$ENV_SYNC"' EXIT
          RELEASE_VERSION="${SHA:0:7}" ENV_SYNC_FILE="$ENV_SYNC" bash "$STAGING/scripts/deploy-ec2.sh" "$STAGING" "${{ github.repository }}@${SHA:0:7}"
          EOF

      # Release signal for the product loop's release monitor (a Devin
      # automation with a webhook trigger). Sends the deployed version, the
      # previously deployed SHA and the PRs merged in between. Skipped when
      # RELEASE_MONITOR_WEBHOOK_URL is not set; never fails the deploy.
      - name: Notify release monitor
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          WEBHOOK_URL: ${{ secrets.RELEASE_MONITOR_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.RELEASE_MONITOR_WEBHOOK_SECRET }}
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_SITE: ${{ vars.DD_SITE || 'us5.datadoghq.com' }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          VERSION=${SHA:0:7}
          PREV=$(gh api "repos/$REPO/actions/workflows/deploy.yml/runs?branch=main&status=success&per_page=10" \
            --jq "[.workflow_runs[] | select(.id != $RUN_ID) | .head_sha][0] // empty" || true)
          PRS='[]'
          if [ -n "$PREV" ] && [ "$PREV" != "$SHA" ]; then
            # Merge commits ("Merge pull request #N ...") and squash merges ("Title (#N)").
            PRS=$(gh api "repos/$REPO/compare/$PREV...$SHA" --jq '[.commits[].commit.message | split("\n")[0]
              | scan("^Merge pull request #([0-9]+)|\\(#([0-9]+)\\)$") | map(select(. != null))[0] | tonumber] | unique' || echo '[]')
          fi
          BODY=$(jq -n --arg repo "$REPO" --arg sha "$SHA" --arg version "$VERSION" --arg prev "$PREV" \
            --argjson prs "$PRS" --arg run "https://github.com/$REPO/actions/runs/$RUN_ID" '{
              event: "release", service: "checkout-api", env: "prod", repository: $repo,
              sha: $sha, version: $version, dd_version_tag: ("version:" + $version),
              sentry_release: ("acme-checkout@" + $version), previous_sha: $prev,
              compare_url: (if $prev == "" then null else "https://github.com/\($repo)/compare/\($prev)...\($sha)" end),
              merged_prs: $prs, deploy_run_url: $run, deployed_at: (now | todate) }')
          echo "$BODY"
          if [ -n "$DD_API_KEY" ]; then
            jq -n --argjson b "$BODY" '{title: "Deployed checkout-api \($b.version)", text: ($b | tostring),
              tags: ["service:checkout-api", "env:prod", "version:\($b.version)", "event:release"],
              source_type_name: "github", alert_type: "info"}' |
              curl -sS -o /dev/null -w 'datadog event: %{http_code}\n' -X POST "https://api.$DD_SITE/api/v1/events" \
                -H "DD-API-KEY: $DD_API_KEY" -H 'Content-Type: application/json' -d @- || true
          fi
          if [ -z "$WEBHOOK_URL" ]; then
            echo "RELEASE_MONITOR_WEBHOOK_URL not set; release monitor not notified"; exit 0
          fi
          curl -sS --fail-with-body -X POST "$WEBHOOK_URL" -H 'Content-Type: application/json' \
            ${WEBHOOK_SECRET:+-H "X-Webhook-Secret: $WEBHOOK_SECRET"} -d "$BODY"

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/ec2_key
