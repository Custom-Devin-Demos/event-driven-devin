name: Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

# One deploy at a time from this repo; the host-side flock in
# scripts/deploy-ec2.sh additionally serializes deploys across both source
# repos and the manual playbook.
concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Create release tarball
        run: |
          tar czf /tmp/release.tar.gz \
            --exclude=node_modules \
            --exclude=.git \
            --exclude=.env \
            --exclude=certbot \
            -C . .

      - name: Upload release to EC2
        run: |
          scp -i ~/.ssh/ec2_key \
            /tmp/release.tar.gz \
            ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/release-${{ github.sha }}.tar.gz

      # Everything below happens on the host through scripts/deploy-ec2.sh
      # (taken from the release being deployed): lock, backup, mirror the tree
      # while preserving verticals + host-only files, build, health, smoke every
      # vertical URL, automatic rollback on failure.
      - name: Deploy on EC2
        run: |
          ssh -i ~/.ssh/ec2_key ubuntu@${{ secrets.EC2_HOST }} bash -s <<'EOF'
          set -euo pipefail
          SHA="${{ github.sha }}"
          STAGING="/home/ubuntu/incoming/$SHA"
          rm -rf "$STAGING" && mkdir -p "$STAGING"
          tar xzf "/home/ubuntu/release-$SHA.tar.gz" -C "$STAGING"
          rm -f "/home/ubuntu/release-$SHA.tar.gz"
          trap 'rm -rf "$STAGING"' EXIT
          bash "$STAGING/scripts/deploy-ec2.sh" "$STAGING" "${{ github.repository }}@${SHA:0:7}"
          EOF

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/ec2_key
