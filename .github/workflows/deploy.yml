name: Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

# One deploy at a time from this repo; the host-side flock in
# scripts/deploy-ec2.sh additionally serializes deploys across both source
# repos and the manual playbook.
concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          if [ -z "$EC2_SSH_KEY" ] || [ -z "$EC2_HOST" ]; then
            echo "::error::EC2_SSH_KEY and EC2_HOST must both be set in this repo's Actions secrets"; exit 1
          fi
          mkdir -p ~/.ssh
          umask 077
          # Accept the PEM as pasted with real newlines, with literal "\n", or flattened onto
          # one line (newlines turned into spaces) and rewrite it in canonical form.
          KEY=$(printf '%s' "$EC2_SSH_KEY" | sed 's/\\n/\n/g' | tr -d '\r')
          if [ "$(printf '%s\n' "$KEY" | wc -l)" -gt 2 ]; then
            printf '%s\n' "$KEY" > ~/.ssh/ec2_key
          else
            HEAD=$(printf '%s' "$KEY" | grep -oE -- '-----BEGIN [A-Z ]+-----' | head -1)
            TAIL=$(printf '%s' "$KEY" | grep -oE -- '-----END [A-Z ]+-----' | head -1)
            {
              printf '%s\n' "$HEAD"
              printf '%s' "$KEY" | sed -e "s/$HEAD//" -e "s/$TAIL//" | tr -d ' \n' | fold -w 64
              printf '\n%s\n' "$TAIL"
            } > ~/.ssh/ec2_key
          fi
          chmod 600 ~/.ssh/ec2_key
          if ! ssh-keygen -y -f ~/.ssh/ec2_key > /dev/null 2>&1; then
            echo "::error::EC2_SSH_KEY is not a parseable private key (check it was pasted completely)"; exit 1
          fi
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Create release tarball
        run: |
          tar czf /tmp/release.tar.gz \
            --exclude=node_modules \
            --exclude=.git \
            --exclude=.env \
            --exclude=certbot \
            -C . .

      # Everything this workflow writes on the host goes under /var/tmp, outside
      # /home/ubuntu: that directory is the Docker build context of the deploy
      # running there, and files appearing/vanishing in it mid-build (another
      # repo's release upload + extract) produced images missing src/ and vendor/.
      - name: Upload release to EC2
        run: |
          ssh -i ~/.ssh/ec2_key ubuntu@${{ secrets.EC2_HOST }} 'mkdir -p /var/tmp/devindemos-deploy'
          scp -i ~/.ssh/ec2_key \
            /tmp/release.tar.gz \
            ubuntu@${{ secrets.EC2_HOST }}:/var/tmp/devindemos-deploy/release-${{ github.sha }}.tar.gz

      # Optional: stage the Teams Workflow webhooks into the host .env from
      # Actions secrets, so they can be set without SSH access:
      #   MAIN_ONCALL_TEAMS_WEBHOOK_URL      -> ONCALL_TEAMS_WEBHOOK_URL (On-Call alerts)
      #   MAIN_AUTOMATIONS_TEAMS_WEBHOOK_URL -> AUTOMATIONS_TEAMS_WEBHOOK_URL (hub demo alerts)
      # deploy-ec2.sh applies them under the deploy lock, after its .env backup.
      # Skipped when neither secret is set.
      - name: Stage Teams webhooks for host .env
        env:
          ONCALL_TEAMS_WEBHOOK_URL: ${{ secrets.MAIN_ONCALL_TEAMS_WEBHOOK_URL }}
          AUTOMATIONS_TEAMS_WEBHOOK_URL: ${{ secrets.MAIN_AUTOMATIONS_TEAMS_WEBHOOK_URL }}
        run: |
          sync=""
          if [ -n "$ONCALL_TEAMS_WEBHOOK_URL" ]; then
            sync+="ONCALL_TEAMS_WEBHOOK_URL=$ONCALL_TEAMS_WEBHOOK_URL"$'\n'
          fi
          if [ -n "$AUTOMATIONS_TEAMS_WEBHOOK_URL" ]; then
            sync+="AUTOMATIONS_TEAMS_WEBHOOK_URL=$AUTOMATIONS_TEAMS_WEBHOOK_URL"$'\n'
          fi
          if [ -z "$sync" ]; then
            echo "No Teams webhook secrets set; host .env left unchanged"; exit 0
          fi
          printf '%s' "$sync" | \
            ssh -i ~/.ssh/ec2_key ubuntu@${{ secrets.EC2_HOST }} \
            'umask 077 && mkdir -p /var/tmp/devindemos-deploy && cat > /var/tmp/devindemos-deploy/env-sync-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}'

      # Everything below happens on the host through scripts/deploy-ec2.sh
      # (taken from the release being deployed): lock, backup, mirror the tree
      # while preserving verticals + host-only files, build, health, smoke every
      # vertical URL, automatic rollback on failure.
      - name: Deploy on EC2
        run: |
          ssh -i ~/.ssh/ec2_key ubuntu@${{ secrets.EC2_HOST }} bash -s <<'EOF'
          set -euo pipefail
          SHA="${{ github.sha }}"
          INCOMING=/var/tmp/devindemos-deploy
          STAGING="$INCOMING/$SHA"
          rm -rf "$STAGING" && mkdir -p "$STAGING"
          tar xzf "$INCOMING/release-$SHA.tar.gz" -C "$STAGING"
          rm -f "$INCOMING/release-$SHA.tar.gz"
          ENV_SYNC="$INCOMING/env-sync-$SHA-${{ github.run_id }}-${{ github.run_attempt }}"
          trap 'rm -rf "$STAGING" "$ENV_SYNC"' EXIT
          ENV_SYNC_FILE="$ENV_SYNC" bash "$STAGING/scripts/deploy-ec2.sh" "$STAGING" "${{ github.repository }}@${SHA:0:7}"
          EOF

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/ec2_key
