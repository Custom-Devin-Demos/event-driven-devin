server:
  port: ${PORT:8080}

spring:
  application:
    name: resort-inventory

inventory:
  holds:
    # Hold time-to-live in seconds (INV-2291: all inventory timers are configured
    # in seconds, matching the booking engine's hold API). A guest's cart keeps
    # the inventory for this long; HoldReleaseJob returns unconverted holds to
    # the pool afterwards.
    ttl: 900
    release-interval-ms: 30000
  demo:
    # Simulated abandoned carts on peak dates (see AbandonedCartSimulator).
    abandoned-carts: ${INVENTORY_DEMO_ABANDONED_CARTS:true}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} service=resort-inventory - %msg%n"
