# Nginx bootstrap config — HTTP only (no SSL)
# Used during initial certificate provisioning before certs exist.
# After certbot obtains certs, switch to the full nginx.conf.

server {
    listen 80;
    server_name ${DOMAIN_NAME};

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # f2ec3d90 demo: resolve the optional container lazily and preserve its base path.
    # Internal-only: the f2ec3d90 container calls checkout-api directly on the compose network.
    location = /api/f2ec3d90/incident {
        return 404;
    }

    location = /f2ec3d90 {
        return 301 /f2ec3d90/$is_args$args;
    }

    location /f2ec3d90/ {
        resolver 127.0.0.11 valid=10s;
        set $f2ec3d90_upstream http://f2ec3d90:3000;
        proxy_pass $f2ec3d90_upstream;
        client_max_body_size 12m;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /f2ec3d90;
        proxy_set_header X-Request-ID $request_id;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Proxy everything else to checkout-api (HTTP only, until certs are ready)
    location / {
        proxy_pass http://checkout-api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
