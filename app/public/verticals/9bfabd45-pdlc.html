<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pershing Access · Product discussion trigger</title>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: #0b1f33; color: #e8eef5; display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; }
  main { background: #12304d; padding: 32px 36px; border-radius: 12px; max-width: 520px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,.3); }
  h1 { font-size: 20px; margin: 0 0 6px; }
  p { color: #b7c6d6; font-size: 14px; line-height: 1.5; }
  button { background: #2f7de1; color: #fff; border: 0; padding: 10px 18px; border-radius: 6px; font-size: 15px; cursor: pointer; margin-right: 8px; }
  button.secondary { background: transparent; border: 1px solid #5d7a96; }
  button:disabled { opacity: .5; cursor: default; }
  input { background: #0b1f33; color: #e8eef5; border: 1px solid #5d7a96; border-radius: 6px; padding: 8px; width: 100%; box-sizing: border-box; margin: 8px 0 16px; }
  pre { background: #0b1f33; padding: 12px; border-radius: 6px; font-size: 12px; white-space: pre-wrap; }
  a { color: #8cc2ff; }
</style>
</head>
<body>
<main>
  <h1>Pershing Access · price alerts on Holdings</h1>
  <p>Starts the product discussion in <b>#bny-pershing-access-android-app</b>. The PM, designer and Android lead talk through the idea; the iOS Engineer Bot joins on its own with wireframes, takes a change request and builds it.</p>
  <label>Demo key (if configured)<input id="key" type="password" autocomplete="off"></label>
  <button id="run">Start discussion</button>
  <button id="stop" class="secondary">Stop</button>
  <pre id="state">loading…</pre>
</main>
<script>
  const stateEl = document.getElementById('state');
  const keyEl = document.getElementById('key');
  keyEl.value = localStorage.getItem('bnyPdlcKey') || '';
  let lastRejection = null;
  function render(s) {
    stateEl.textContent = (lastRejection ? `Not started: ${lastRejection}\n\n` : '') + JSON.stringify(s, null, 2);
    if (s.threadUrl) stateEl.innerHTML += `\n\n<a href="${s.threadUrl}" target="_blank" rel="noopener">Open Slack thread</a>`;
    document.getElementById('run').disabled = s.status === 'running';
  }
  async function refresh() { render(await (await fetch('/api/9bfabd45/pdlc/state')).json()); }
  async function post(path) {
    localStorage.setItem('bnyPdlcKey', keyEl.value);
    const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-demo-key': keyEl.value } });
    const body = await r.json();
    lastRejection = body.reason || null;
    render(body.state || body);
  }
  document.getElementById('run').onclick = () => post('/api/9bfabd45/pdlc/run');
  document.getElementById('stop').onclick = () => post('/api/9bfabd45/pdlc/stop');
  refresh(); setInterval(refresh, 5000);
</script>
</body>
</html>
