<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b2a6b">
<title>cytric — Travel &amp; Expense</title>
<link rel="icon" href="/favicon.png">
<style>
:root{--brand:#0b2a6b;--brand-deep:#061a45;--brand-light:#123a8e;--brand-soft:#e8eefb;--accent:#2f7df6;--ink:#0f172a;--soft:#5b6478;--line:#e4e8f0;--page:#f4f6fa;--white:#fff;--success:#138a5e;--success-soft:#e3f5ec;--warn:#b7791f;--warn-soft:#fff4dd;--red:#c62828;--red-soft:#fdecec;--sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--radius:14px;--shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px rgba(15,23,42,.06)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}[hidden]{display:none!important}
html{background:radial-gradient(1200px 600px at 50% -10%,#17408f 0%,#0a1f4e 45%,#060f28 100%) #060f28 no-repeat;min-height:100%}
body{font-family:var(--sans);color:var(--ink);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}input{font:inherit}
.muted{color:var(--soft);font-size:13px}.mono{font-family:var(--mono)}
.app{max-width:430px;min-height:100vh;margin:0 auto;background:var(--page);position:relative;box-shadow:0 0 60px rgba(0,0,0,.45)}
.screen{min-height:100vh}.screen.with-tabs{padding-bottom:92px}.section{padding:16px}
.wordmark{display:inline-flex;align-items:baseline;gap:8px;color:var(--white)}.wordmark b{font-size:24px;font-weight:800;letter-spacing:-.03em}.wordmark span{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;opacity:.72}.wordmark.big b{font-size:40px}.wordmark.big span{font-size:12px}
.nav{background:var(--brand);color:var(--white);display:flex;align-items:center;gap:10px;padding:14px 16px;position:sticky;top:0;z-index:5;min-height:56px}.nav h1{font-size:17px;font-weight:600;flex:1;text-align:center}
.nav__back{color:var(--white);width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;font-size:22px;line-height:1}.nav__back:hover{background:rgba(255,255,255,.12)}.nav__spacer{width:32px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--white);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none}
.hero{background:linear-gradient(160deg,var(--brand) 0%,#123a8e 100%);color:var(--white);padding:6px 16px 24px}.hero__row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hero h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:14px}.hero p{color:rgba(255,255,255,.78);font-size:14px;margin-top:4px}
.hero__stats{display:flex;gap:10px;margin-top:16px}.hero__stat{flex:1;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:10px 12px}.hero__stat b{display:block;font-size:20px}.hero__stat span{font-size:12px;opacity:.78}
.section-title{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);margin:18px 0 10px}
.card{background:var(--white);padding:16px;margin-bottom:12px;border-radius:var(--radius);box-shadow:var(--shadow)}.card.clickable{width:100%;display:block;transition:transform .12s,box-shadow .12s}.card.clickable:hover{transform:translateY(-1px);box-shadow:0 2px 4px rgba(15,23,42,.08),0 14px 30px rgba(15,23,42,.1)}
.trip__head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.trip__route{font-size:22px;font-weight:800;letter-spacing:-.02em}.trip__route small{font-size:14px;font-weight:600;color:var(--soft);margin:0 6px}.trip__title{font-weight:600;margin-top:2px}
.trip__meta{display:flex;gap:14px;margin-top:10px;color:var(--soft);font-size:13px;flex-wrap:wrap}.trip__meta b{color:var(--ink);font-weight:600}.trip__cta{margin-top:12px;display:flex;align-items:center;justify-content:space-between;color:var(--accent);font-weight:600;font-size:14px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}.pill::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.pill--ok{background:var(--success-soft);color:var(--success)}.pill--warn{background:var(--warn-soft);color:var(--warn)}.pill--neutral{background:var(--brand-soft);color:var(--brand)}.pill--danger{background:var(--red-soft);color:var(--red)}
.detail-hero{background:linear-gradient(160deg,var(--brand) 0%,#123a8e 100%);color:var(--white);padding:8px 16px 22px}.detail-hero .trip__route{font-size:30px}.detail-hero .trip__route small{color:rgba(255,255,255,.7)}.detail-hero p{color:rgba(255,255,255,.8);margin-top:4px}.detail-hero .pill{margin-top:12px;background:rgba(255,255,255,.14);color:var(--white)}
.actions{display:flex;gap:10px;margin:-22px 16px 0;position:relative;z-index:1}
.btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 16px;border-radius:12px;font-weight:700;font-size:15px;text-align:center}.btn:active{transform:translateY(1px)}
.btn--primary{background:var(--accent);color:var(--white);box-shadow:0 8px 20px rgba(47,125,246,.35)}.btn--primary:disabled{opacity:.6;cursor:progress}.btn--secondary{background:var(--white);color:var(--brand);box-shadow:var(--shadow)}.btn--ghost{background:transparent;color:var(--soft);box-shadow:none}.btn--block{width:100%}
.segment{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}.segment:first-child{border-top:0;padding-top:0}.segment:last-child{padding-bottom:0}
.segment__icon{width:44px;height:44px;border-radius:12px;background:var(--brand-soft);color:var(--brand);display:inline-flex;align-items:center;justify-content:center;font-size:20px}.segment__title{font-weight:600}.segment__sub{color:var(--soft);font-size:13px;margin-top:2px}.segment__amount{font-weight:700;white-space:nowrap}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}.kv:first-child{border-top:0;padding-top:0}.kv span{color:var(--soft)}.kv b{font-weight:600;text-align:right}
.error-card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);border-left:4px solid var(--red);padding:16px;margin:16px}.error-card__head{display:flex;gap:12px;align-items:flex-start}
.error-card__icon{width:36px;height:36px;border-radius:50%;background:var(--red-soft);color:var(--red);display:inline-flex;align-items:center;justify-content:center;font-weight:800;flex:none}.error-card h3{font-size:16px}.error-card p{color:var(--soft);font-size:14px;margin-top:4px}
.error-card__code{margin-top:12px;padding:8px 10px;background:var(--page);border-radius:8px;font-family:var(--mono);font-size:12px;color:var(--soft);word-break:break-all}.error-card__actions{display:flex;gap:10px;margin-top:12px}.error-card__actions .btn{padding:10px 14px;font-size:14px}
.list-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.list-row:first-child{border-top:0;padding-top:0}.list-row:last-child{padding-bottom:0}
.list-row__icon{width:40px;height:40px;border-radius:12px;background:var(--brand-soft);color:var(--brand);display:inline-flex;align-items:center;justify-content:center;font-size:18px;flex:none}.list-row__body{flex:1;min-width:0}.list-row__title{font-weight:600}.list-row__sub{color:var(--soft);font-size:13px}.list-row__right{text-align:right;font-weight:700}
.row-actions{display:flex;gap:8px;margin-top:10px}.row-actions .btn{padding:9px 12px;font-size:13px;border-radius:10px}
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--white);border-top:1px solid var(--line);display:flex;padding:8px 4px 10px;z-index:6}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--soft);padding:4px 0}.tabbar button[aria-current=page]{color:var(--brand)}.tabbar svg{width:24px;height:24px}
.signin{min-height:100vh;display:flex;flex-direction:column;background:linear-gradient(170deg,var(--brand) 0%,#0c2d73 55%,#123a8e 100%);color:var(--white);padding:56px 24px 32px}.signin__brand{flex:1}
.signin__brand h2{font-size:28px;font-weight:800;letter-spacing:-.02em;margin-top:28px;line-height:1.2}.signin__brand p{color:rgba(255,255,255,.78);margin-top:8px}
.signin__card{background:var(--white);color:var(--ink);border-radius:18px;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.3)}.signin__card h3{font-size:16px}.signin__card .btn{margin-top:14px}
.signin__sso{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;margin-top:12px}.signin__sso b{font-size:14px}.signin__sso span{font-size:12px;color:var(--soft)}.signin__foot{text-align:center;color:rgba(255,255,255,.6);font-size:12px;margin-top:20px}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--white);padding:10px 16px;border-radius:999px;font-size:13px;z-index:30;box-shadow:var(--shadow)}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0}.switch{width:44px;height:26px;border-radius:13px;background:#cbd2df;position:relative;transition:background .15s;flex:none}.switch::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--white);transition:left .15s}.switch[aria-checked=true]{background:var(--success)}.switch[aria-checked=true]::after{left:21px}
</style>
</head>
<body>
<div class="app" id="phone"><main id="screen" class="screen"></main><nav id="tabbar" class="tabbar" hidden aria-label="Main"></nav></div>
<div id="toast" class="toast" hidden role="status"></div>
<script>
/* cytric web replica for the Amadeus booking-retrieval demo. Synthetic data only. */
var APP_NAME = 'cytric';
var APP_VERSION = '26.11.2';
var REPORT_PATH = '/api/amadeus/cytric/error';
var CLIENT_ERROR_CODE = 'CYT-TRP-4031';
var REPORTS_ON = new URLSearchParams(location.search).get('reports') !== 'off';

var TRAVELER = { firstName: 'Claire', lastName: 'Martin', email: 'claire.martin@novatech-group.example', company: 'NovaTech Group', costCenter: 'CC-4410 · Product Engineering', approver: 'Thomas Keller' };

var TRIPS = [
  { id: 'TR-48213', title: 'Customer workshop · Nice', purpose: 'Q4 roadmap workshop with Sophia Antipolis engineering', status: 'Approved', policy: 'EU-SHORT-HAUL', recordLocator: '6KQ2RT', airline: 'British Airways', dates: '17–19 Nov 2026', route: 'LHR → NCE', totalEur: 1184.4, upcoming: true, daysAway: 13,
    items: [{ type: 'flight', label: 'BA 348 · LHR 07:35 → NCE 10:40 · Premium Economy', amountEur: 412.2 }, { type: 'hotel', label: 'Hôtel Aston La Scala · 2 nights', amountEur: 358.0 }, { type: 'flight', label: 'BA 349 · NCE 18:20 → LHR 19:30 · Premium Economy', amountEur: 414.2 }] },
  { id: 'TR-48377', title: 'Partner review · Madrid', purpose: 'Quarterly review with Iberia distribution partner', status: 'Pending approval', policy: 'EU-SHORT-HAUL', recordLocator: 'K3M7PV', airline: 'Air France', dates: '2–3 Dec 2026', route: 'CDG → MAD', totalEur: 526.9, upcoming: true, daysAway: 28,
    items: [{ type: 'flight', label: 'AF 1300 · CDG 09:10 → MAD 11:15 · Economy', amountEur: 168.5 }, { type: 'hotel', label: 'NH Collection Colón · 1 night', amountEur: 189.9 }, { type: 'flight', label: 'AF 1401 · MAD 19:45 → CDG 21:50 · Economy', amountEur: 168.5 }] },
  { id: 'TR-48102', title: 'Team offsite · Munich', purpose: 'Engineering leadership offsite', status: 'Completed', policy: 'EU-SHORT-HAUL', recordLocator: 'P8WD2L', airline: 'Lufthansa', dates: '21–22 Oct 2026', route: 'MUC → LHR', totalEur: 389.0, upcoming: false,
    items: [{ type: 'flight', label: 'LH 2231 · MUC 17:05 → LHR 18:00 · Economy', amountEur: 142.0 }, { type: 'hotel', label: 'Motel One Munich-City · 1 night', amountEur: 247.0 }] }
];

var APPROVALS = [
  { id: 'TR-48390', traveler: 'Jonas Weber', route: 'FRA → LIS', dates: '24–26 Nov', purpose: 'Customer onboarding · Lisbon', amountEur: 742.3, policy: 'In policy' },
  { id: 'TR-48402', traveler: 'Priya Natarajan', route: 'LHR → BOS', dates: '1–5 Dec', purpose: 'Boston engineering summit', amountEur: 2318.0, policy: 'Justification attached' }
];
var EXPENSES = [
  { id: 'EXP-2211', title: 'Team offsite · Munich', status: 'Reimbursed', amountEur: 389.0, items: 4, icon: '✓' },
  { id: 'EXP-2238', title: 'Client dinner · London', status: 'Submitted', amountEur: 148.6, items: 1, icon: '🍽' },
  { id: 'EXP-2240', title: 'Customer workshop · Nice', status: 'Draft', amountEur: 0, items: 0, icon: '✈' }
];

/* Airline booking retrieval API (hosted replica of POST /api/amadeus/bookings/retrieve).
   Since the booking retrieval hardening release (security control SEC-2041) a record locator
   alone no longer retrieves a PNR: the API answers 403 TRAVELER_VERIFICATION_REQUIRED with a
   single-use verification token until the identical request carries travelerLastName +
   verificationToken. This client still sends the locator alone and treats the answer as a failure. */
var AIRLINE_API = {
  release: '26.11', control: 'SEC-2041 booking retrieval hardening',
  retrieve: function (request) {
    var requestId = uuid();
    if (!/^[A-Z0-9]{6}$/.test(request.recordLocator || '')) {
      return { status: 400, body: { success: false, code: 'INVALID_RETRIEVAL_REQUEST', error: 'A record locator is six letters or digits.', requestId: requestId } };
    }
    if (request.travelerLastName === undefined && request.verificationToken === undefined) {
      return { status: 403, body: { success: false, code: 'TRAVELER_VERIFICATION_REQUIRED', errorClass: 'TravelerVerificationRequired', requestId: requestId,
        error: 'Verify the traveler before retrieving booking ' + request.recordLocator + ': provide the surname on the ticket with the verification token.',
        verification: { recordLocator: request.recordLocator, requiredField: 'travelerLastName', prompt: 'Enter the surname exactly as it appears on the ticket', token: uuid().replace(/-/g, '').slice(0, 12) + '.' + uuid().replace(/-/g, ''), expiresInSeconds: 600, control: AIRLINE_API.control } } };
    }
    return { status: 403, body: { success: false, code: 'TRAVELER_VERIFICATION_REQUIRED', errorClass: 'TravelerVerificationRequired', requestId: requestId, error: 'The verification token is missing, expired or already used.' } };
  }
};
/* end airline retrieval api */

function retrieveBooking(trip) {
  var response = AIRLINE_API.retrieve({ recordLocator: trip.recordLocator, channel: 'cytric-web' });
  if (response.status === 200 && response.body.success) return response.body.booking;
  throw new BookingFailure(response.body);
}

function BookingFailure(body) {
  this.backendCode = body.code || 'BOOKING_RETRIEVAL_FAILED';
  this.backendRequestId = body.requestId || '';
  this.message = body.error || 'The booking service is unavailable.';
  this.errorType = 'BookingRetrievalRejected';
}
BookingFailure.prototype.reference = function () { return this.backendRequestId ? CLIENT_ERROR_CODE + ' · Ref: ' + this.backendRequestId : CLIENT_ERROR_CODE; };

var state = { tab: 'trips', trip: null, failure: null, loading: false, decisions: {}, reported: {} };
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function eur(v) { return '€' + Number(v).toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function uuid() { return (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) { var r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); })); }
function toast(text) { var t = $('toast'); t.textContent = text; t.hidden = false; clearTimeout(toast.timer); toast.timer = setTimeout(function () { t.hidden = true; }, 1800); }
function pill(status) { var tone = status === 'Approved' ? 'ok' : status === 'Pending approval' ? 'warn' : status === 'Rejected' ? 'danger' : 'neutral'; return '<span class="pill pill--' + tone + '">' + esc(status) + '</span>'; }
function route(trip, big) { var p = trip.route.split(' → '); return '<div class="trip__route">' + esc(p[0]) + '<small>→</small>' + esc(p[1]) + '</div>'; }
function initials() { return TRAVELER.firstName[0] + TRAVELER.lastName[0]; }

var ICONS = {
  trips: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 10h18M5 10V7a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v3M4 10v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M9 15h6"/></svg>',
  tasks: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 11l2 2 4-4"/><rect x="4" y="4" width="16" height="16" rx="3"/></svg>',
  expenses: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M7 12h.01M17 12h.01"/></svg>',
  profile: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 20a8 8 0 0 1 16 0"/></svg>'
};
var TABS = [['trips', 'My trips'], ['tasks', 'Approvals'], ['expenses', 'Expenses'], ['profile', 'Profile']];

function renderSignIn() {
  return '<div class="signin"><div class="signin__brand"><div class="wordmark big"><b>cytric</b><span>by Amadeus</span></div><h2>Business travel,<br>end to end.</h2><p>Trips, approvals, expenses and boarding passes in one place.</p></div>' +
    '<form class="signin__card" id="signin-form"><h3>Sign in to your company account</h3><div class="signin__sso"><span class="avatar">NT</span><div><b>' + esc(TRAVELER.company) + '</b><br><span>' + esc(TRAVELER.email) + ' · SSO</span></div></div>' +
    '<button type="submit" class="btn btn--primary btn--block" data-testid="signin">Sign in</button><p class="muted" style="margin-top:12px;text-align:center;font-size:12px">Single sign-on is managed by your company.</p></form>' +
    '<p class="signin__foot">cytric Travel &amp; Expense · ' + APP_VERSION + '</p></div>';
}

function tripCard(trip) {
  return '<button type="button" class="card clickable" data-open="' + trip.id + '" data-testid="trip-' + trip.id + '"><div class="trip__head"><div>' + route(trip) + '<div class="trip__title">' + esc(trip.title) + '</div></div>' + pill(trip.status) + '</div>' +
    '<div class="trip__meta"><span><b>' + esc(trip.dates) + '</b></span><span>' + esc(trip.airline) + '</span><span>' + eur(trip.totalEur) + '</span></div>' +
    (trip.upcoming && trip.status === 'Approved' ? '<div class="trip__cta"><span>In ' + trip.daysAway + ' days · Boarding pass available</span><span>›</span></div>' : '') + '</button>';
}

function renderTrips() {
  var upcoming = TRIPS.filter(function (t) { return t.upcoming; }), past = TRIPS.filter(function (t) { return !t.upcoming; });
  var planned = upcoming.reduce(function (s, t) { return s + t.totalEur; }, 0);
  return '<div class="hero"><div class="hero__row"><div class="wordmark"><b>cytric</b><span>by Amadeus</span></div><button type="button" class="avatar" data-tab="profile" aria-label="Profile">' + initials() + '</button></div>' +
    '<h1>Good morning, ' + esc(TRAVELER.firstName) + '</h1><p>' + esc(TRAVELER.company) + ' · ' + esc(TRAVELER.costCenter) + '</p>' +
    '<div class="hero__stats"><div class="hero__stat"><b>' + upcoming.length + '</b><span>Upcoming trips</span></div><div class="hero__stat"><b>' + TRIPS.filter(function (t) { return t.status === 'Pending approval'; }).length + '</b><span>Awaiting approval</span></div><div class="hero__stat"><b>' + eur(planned) + '</b><span>Planned spend</span></div></div></div>' +
    '<div class="section"><h2 class="section-title">Upcoming</h2>' + upcoming.map(tripCard).join('') + '<h2 class="section-title">Past</h2>' + past.map(tripCard).join('') + '</div>';
}

function renderDetail(trip) {
  var p = trip.route.split(' → ');
  var error = state.failure ? '<section class="error-card" id="booking-error" data-testid="booking-error" role="alert"><div class="error-card__head"><span class="error-card__icon">!</span><div><h3>We couldn\'t open your booking</h3><p>Please try again later or contact your travel manager.</p></div></div>' +
    '<div class="error-card__code" id="booking-error-code">' + esc(state.failure.reference()) + '</div><div id="booking-error-ref" class="muted" style="margin-top:6px;font-size:12px">' + (state.reported[state.failure.backendRequestId] && state.reported[state.failure.backendRequestId].reference ? 'Incident ref ' + esc(state.reported[state.failure.backendRequestId].reference) : '') + '</div>' +
    '<div class="error-card__actions"><button type="button" class="btn btn--primary" data-boarding="' + trip.id + '">Retry</button><button type="button" class="btn btn--ghost" data-dismiss="1">Dismiss</button></div></section>' : '';
  return '<header class="nav"><button type="button" class="nav__back" data-back="1" aria-label="Back">‹</button><h1>' + esc(trip.id) + '</h1><span class="nav__spacer"></span></header>' +
    '<div class="detail-hero">' + route(trip) + '<p>' + esc(trip.title) + ' · ' + esc(trip.dates) + '</p>' + pill(trip.status) + '</div>' +
    '<div class="actions"><button type="button" class="btn btn--primary" id="trip-boarding-pass" data-boarding="' + trip.id + '"' + (state.loading || !trip.upcoming ? ' disabled' : '') + '>' + (state.loading ? 'Opening booking…' : 'Boarding pass') + '</button><button type="button" class="btn btn--secondary" data-boarding="' + trip.id + '"' + (state.loading || !trip.upcoming ? ' disabled' : '') + '>Manage flight</button></div>' + error +
    '<div class="section"><h2 class="section-title">Itinerary</h2><div class="card">' + trip.items.map(function (i) { var parts = i.label.split(' · '); return '<div class="segment"><span class="segment__icon">' + (i.type === 'hotel' ? '🏨' : '✈') + '</span><div><div class="segment__title">' + esc(parts[0]) + '</div><div class="segment__sub">' + esc(parts.slice(1).join(' · ')) + '</div></div><span class="segment__amount">' + eur(i.amountEur) + '</span></div>'; }).join('') + '</div>' +
    '<h2 class="section-title">Booking</h2><div class="card"><div class="kv"><span>Airline</span><b>' + esc(trip.airline) + '</b></div><div class="kv"><span>Record locator</span><b class="mono">' + esc(trip.recordLocator) + '</b></div><div class="kv"><span>Travel policy</span><b>' + esc(trip.policy) + '</b></div><div class="kv"><span>Purpose</span><b>' + esc(trip.purpose) + '</b></div><div class="kv"><span>Total</span><b>' + eur(trip.totalEur) + '</b></div></div></div>';
}

function renderApprovals() {
  var pending = APPROVALS.filter(function (a) { return !state.decisions[a.id]; }), decided = APPROVALS.filter(function (a) { return state.decisions[a.id]; });
  return '<header class="nav"><span class="nav__spacer"></span><h1>Approvals</h1><span class="nav__spacer"></span></header><div class="section"><h2 class="section-title">Waiting for you (' + pending.length + ')</h2>' +
    (pending.length ? '' : '<div class="card muted">All caught up. Nothing waiting for your approval.</div>') +
    pending.map(function (a) { return '<div class="card" data-testid="approval-' + a.id + '"><div class="trip__head"><div><div class="trip__title">' + esc(a.traveler) + ' · ' + esc(a.route) + '</div><div class="muted">' + esc(a.purpose) + ' · ' + esc(a.dates) + '</div></div><b>' + eur(a.amountEur) + '</b></div><div class="trip__meta">' + pill(a.policy === 'In policy' ? 'Approved' : 'Pending approval').replace(/>[^<]+</, '>' + esc(a.policy) + '<') + '</div><div class="row-actions"><button type="button" class="btn btn--primary" data-approve="' + a.id + '">Approve</button><button type="button" class="btn btn--secondary" data-reject="' + a.id + '">Reject</button></div></div>'; }).join('') +
    (decided.length ? '<h2 class="section-title">Decided today</h2>' + decided.map(function (a) { return '<div class="card"><div class="trip__head"><div class="trip__title">' + esc(a.traveler) + ' · ' + esc(a.route) + '</div>' + pill(state.decisions[a.id]) + '</div></div>'; }).join('') : '') + '</div>';
}

function renderExpenses() {
  return '<header class="nav"><span class="nav__spacer"></span><h1>Expenses</h1><span class="nav__spacer"></span></header><div class="section"><div class="card" style="background:linear-gradient(160deg,#0b2a6b,#123a8e);color:#fff"><div class="muted" style="color:rgba(255,255,255,.75)">Awaiting reimbursement</div><div style="font-size:30px;font-weight:800;letter-spacing:-.02em">' + eur(148.6) + '</div><div style="font-size:12px;color:rgba(255,255,255,.75)">Next payroll run · 28 Nov</div></div>' +
    '<h2 class="section-title">Expense reports</h2><div class="card">' + EXPENSES.map(function (e) { return '<div class="list-row"><span class="list-row__icon">' + e.icon + '</span><div class="list-row__body"><div class="list-row__title">' + esc(e.title) + '</div><div class="list-row__sub">' + e.id + ' · ' + e.items + ' item' + (e.items === 1 ? '' : 's') + ' · ' + e.status + '</div></div><div class="list-row__right">' + (e.amountEur ? eur(e.amountEur) : '—') + '</div></div>'; }).join('') + '</div><button type="button" class="btn btn--secondary btn--block" data-toast="Add expense: receipt capture is not part of this demo">Add expense</button></div>';
}

function renderProfile() {
  return '<header class="nav"><span class="nav__spacer"></span><h1>Profile</h1><span class="nav__spacer"></span></header><div class="section"><div class="card" style="display:flex;gap:14px;align-items:center"><span class="avatar" style="width:52px;height:52px;font-size:18px">' + initials() + '</span><div><div style="font-weight:700;font-size:17px">' + esc(TRAVELER.firstName + ' ' + TRAVELER.lastName) + '</div><div class="muted">' + esc(TRAVELER.email) + '</div></div></div>' +
    '<h2 class="section-title">Travel profile</h2><div class="card"><div class="kv"><span>Company</span><b>' + esc(TRAVELER.company) + '</b></div><div class="kv"><span>Cost centre</span><b>' + esc(TRAVELER.costCenter) + '</b></div><div class="kv"><span>Approver</span><b>' + esc(TRAVELER.approver) + '</b></div><div class="kv"><span>Travel policy</span><b>EU-SHORT-HAUL</b></div></div>' +
    '<h2 class="section-title">Diagnostics</h2><div class="card"><div class="toggle"><div><div class="list-row__title">Send failure reports</div><div class="muted">Platform failures are reported to the operations bridge. Off with <span class="mono">?reports=off</span>.</div></div><button type="button" role="switch" aria-checked="' + REPORTS_ON + '" class="switch" data-reports="1" aria-label="Send failure reports"></button></div><div class="kv"><span>Version</span><b>cytric web ' + APP_VERSION + '</b></div><div class="kv"><span>Airline API</span><b>release ' + AIRLINE_API.release + '</b></div></div>' +
    '<button type="button" class="btn btn--secondary btn--block" data-signout="1">Sign out</button></div>';
}

function render() {
  var screen = $('screen'), tabbar = $('tabbar');
  if (!state.signedIn) { screen.className = 'screen'; screen.innerHTML = renderSignIn(); tabbar.hidden = true; return; }
  if (state.trip) { screen.className = 'screen'; screen.innerHTML = renderDetail(state.trip); tabbar.hidden = true; return; }
  screen.className = 'screen with-tabs';
  screen.innerHTML = state.tab === 'tasks' ? renderApprovals() : state.tab === 'expenses' ? renderExpenses() : state.tab === 'profile' ? renderProfile() : renderTrips();
  tabbar.hidden = false;
  var pending = APPROVALS.filter(function (a) { return !state.decisions[a.id]; }).length;
  tabbar.innerHTML = TABS.map(function (t) { return '<button type="button" data-tab="' + t[0] + '"' + (state.tab === t[0] ? ' aria-current="page"' : '') + '>' + ICONS[t[0]] + t[1] + (t[0] === 'tasks' && pending ? ' (' + pending + ')' : '') + '</button>'; }).join('');
  window.scrollTo(0, 0);
}

function openBoardingPass(trip) {
  state.loading = true; state.failure = null; render();
  setTimeout(function () {
    state.loading = false;
    try {
      retrieveBooking(trip);
      toast('Boarding pass ready');
    } catch (error) {
      if (!(error instanceof BookingFailure)) throw error;
      state.failure = error;
      reportFailure(error, trip);
    }
    render();
    var card = $('booking-error'); if (card) card.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }, 450);
}

function reportFailure(failure, trip) {
  if (!REPORTS_ON || failure.backendCode !== 'TRAVELER_VERIFICATION_REQUIRED' || !failure.backendRequestId) return;
  if (state.reported[failure.backendRequestId]) return;
  state.reported[failure.backendRequestId] = { reference: null };
  fetch(REPORT_PATH, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      source: 'amadeus-cytric/web',
      service: 'customer-amadeus-cytric',
      platform: 'web',
      appName: APP_NAME,
      screen: 'trip',
      action: 'open_boarding_pass',
      reference: uuid(),
      backendCode: failure.backendCode,
      backendRequestId: failure.backendRequestId,
      recordLocator: trip.recordLocator,
      tripId: trip.id,
      airline: trip.airline,
      errorType: failure.errorType,
      errorMessage: CLIENT_ERROR_CODE + ': airline booking retrieval rejected (' + failure.backendCode + ')',
      errorCode: CLIENT_ERROR_CODE,
      stackTrace: (new Error(failure.message)).stack || '',
      device: 'web',
      osVersion: navigator.userAgent.slice(0, 64),
      appVersion: APP_VERSION,
      release: 'amadeus-cytric-web@' + APP_VERSION,
      devinUserId: localStorage.getItem('devinUserId') || '',
      devinOrgId: localStorage.getItem('devinOrgId') || '',
      devinEmail: localStorage.getItem('devinEmail') || ''
    })
  }).then(function (response) {
    if (response.status !== 202) throw new Error('report rejected');
    return response.json();
  }).then(function (ack) {
    state.reported[failure.backendRequestId].reference = ack.reference;
    var ref = $('booking-error-ref'); if (ref && ack.reference) ref.textContent = 'Incident ref ' + ack.reference;
  }).catch(function () {
    delete state.reported[failure.backendRequestId];
  });
}

document.addEventListener('submit', function (event) { if (event.target.id === 'signin-form') { event.preventDefault(); state.signedIn = true; state.tab = 'trips'; render(); } });
document.addEventListener('click', function (event) {
  var b = event.target.closest('button'); if (!b) return;
  var d = b.dataset;
  if (d.tab) { state.tab = d.tab; state.trip = null; state.failure = null; render(); }
  else if (d.open) { state.trip = TRIPS.filter(function (t) { return t.id === d.open; })[0]; state.failure = null; render(); }
  else if (d.back) { state.trip = null; state.failure = null; render(); }
  else if (d.boarding) { openBoardingPass(TRIPS.filter(function (t) { return t.id === d.boarding; })[0]); }
  else if (d.dismiss) { state.failure = null; render(); }
  else if (d.approve || d.reject) { var id = d.approve || d.reject; state.decisions[id] = d.approve ? 'Approved' : 'Rejected'; toast(id + ' ' + state.decisions[id].toLowerCase()); render(); }
  else if (d.reports) { REPORTS_ON = !REPORTS_ON; render(); }
  else if (d.signout) { state.signedIn = false; state.trip = null; state.failure = null; render(); }
  else if (d.toast) { toast(d.toast); }
});
render();
</script>
</body>
</html>
