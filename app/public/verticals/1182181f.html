<style>

  .tl .rib { position: relative; height: 18px; background: #f1f2f5; }
  .tl .rib i { position: absolute; top: 0; bottom: 0; }

  .tl .rib i.dt { background: var(--dt); }
  .tl .rib i.dt span { position: absolute; left: 4px; top: 0; line-height: 18px; color: #fff; font-size: 10px; white-space: nowrap; overflow: hidden; max-width: calc(100% - 6px); text-overflow: ellipsis; }
  .tl .rib i.alm { background: var(--red); width: 2px; }
  .tl .rib i.op { background: #a9bff2; }
  .tl .rib i.op span { position: absolute; left: 4px; top: 0; line-height: 18px; color: #1f2f5c; font-size: 10px; }
  .tl .rib .now { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--indigo); }
  .tl .rib .now:after { content: ""; position: absolute; top: -3px; left: -3px; width: 7px; height: 7px; border-radius: 50%; background: var(--indigo); }
  .tl .sect { display: grid; grid-template-columns: 150px 1fr; font-size: 11.5px; padding: 8px 0 6px; margin-top: 6px; border-top: 1px solid #eceef1; }
  .tl .sect .lbl { font-weight: 600; }
  .tl .sect .meta { color: var(--muted); }

  .legend { display: flex; gap: 14px; font-size: 11px; color: var(--muted); padding: 6px 14px 10px; }
  .legend i { display: inline-block; width: 10px; height: 10px; vertical-align: -1px; margin-right: 4px; }

  .dl { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; }

  .dl div:nth-child(4n) { border-right: 0; }
  .dl .lbl { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .dl .v { margin-top: 2px; font-size: 12.5px; }
  .btn { border: 1px solid var(--panel-border); background: #fff; border-radius: 3px; padding: 5px 10px; font-size: 12px; }
  .btn.pri { background: var(--indigo); border-color: var(--indigo); color: #fff; font-weight: 600; }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn.sm { padding: 2px 8px; font-size: 11px; }
  .toast { position: fixed; right: 18px; bottom: 18px; background: #2b2f36; color: #fff; padding: 9px 14px; border-radius: 3px; font-size: 12px; max-width: 460px; box-shadow: 0 4px 14px rgba(0,0,0,.2); display: none; }
  .toast.fail { background: #7a2e29; }
  .q { font-weight: 600; font-size: 11px; }
  .q.GOOD { color: var(--green); } .q.BAD, .q.STALE { color: var(--red); } .q.UNCERTAIN { color: var(--amber); }
  .empty { padding: 18px 14px; color: var(--muted); font-size: 12px; }
</style>

<script>
(function () {
  var API = '/api/1182181f';
  var TZ = 'America/New_York';
  var SHIFT_MIN = 480;
  var state = { plant: null, sel: null, tab: 'overview', q: '', metric: 'utilization', runs: {} };

  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function pct(v, d) { return v == null ? '–' : (v * 100).toFixed(d == null ? 1 : d) + '%'; }
  function pp(v, base) { if (v == null || base == null) return ''; var d = (v - base) * 100; var cls = d >= 0 ? 'up' : 'dn'; return '<span class="' + cls + '">' + (d >= 0 ? '↑ ' : '↓ ') + Math.abs(d).toFixed(1) + 'pp ' + (d >= 0 ? 'up' : 'down') + '</span>'; }
  function fmtDur(ms) {
    if (ms == null || isNaN(ms)) return '–';
    var s = Math.max(0, Math.floor(ms / 1000));
    if (s < 60) return s + 's';
    var m = Math.floor(s / 60);
    if (m < 60) return m + 'm ' + (s % 60) + 's';
    var h = Math.floor(m / 60);
    if (h < 48) return h + 'h ' + (m % 60) + 'm';
    return Math.floor(h / 24) + 'd ' + (h % 24) + 'h';
  }
  function fmtMin(min) { if (min == null) return '–'; var h = Math.floor(min / 60); var m = Math.round(min % 60); return h ? h + 'h ' + m + 'm' : m + 'm'; }
  function fmtTime(iso) { return iso ? new Intl.DateTimeFormat('en-US', { hour: 'numeric', minute: '2-digit', timeZone: TZ }).format(new Date(iso)) : '–'; }
  function fmtTimeS(iso) { return iso ? new Intl.DateTimeFormat('en-US', { hour: 'numeric', minute: '2-digit', second: '2-digit', timeZone: TZ }).format(new Date(iso)) : '–'; }
  function fmtDate(iso) { return new Intl.DateTimeFormat('en-US', { month: 'short', day: 'numeric', year: 'numeric', timeZone: TZ }).format(new Date(iso)); }
  function ago(iso) { return iso ? fmtDur(Date.now() - new Date(iso).getTime()) : '–'; }
  function statusWord(c) { return { running: 'Active', idle: 'Idle', down: 'Fault', setup: 'Setup', unknown: 'Not Reporting' }[c] || c; }

  function currentUser() {
    var email = localStorage.getItem('devinEmail') || '';
    var handle = email.split('@')[0] || 'operator';
    return { handle: handle, email: email };
  }
  function identity() {
    return {
      devinUserId: localStorage.getItem('devinUserId') || '',
      devinOrgId: localStorage.getItem('devinOrgId') || '',
      devinEmail: localStorage.getItem('devinEmail') || ''
    };
  }
  function postHeaders() {
    var h = { 'Content-Type': 'application/json' };
    var secret = localStorage.getItem('sessionSecret');
    if (secret) h['x-session-secret'] = secret;
    return h;
  }

  function lineOf(code) { return state.plant.lines.filter(function (l) { return l.code === code; })[0]; }
  function cellsOf(code) { return state.plant.cells.filter(function (c) { return c.lineCode === code; }); }
  function cellById(id) { return state.plant.cells.filter(function (c) { return c.cellId === id; })[0]; }
  function lineCategory(line) {
    if (line.stale) return 'unknown';
    if (line.status === 'RUNNING') return 'running';
    if (line.status === 'DOWN') return 'down';
    return 'idle';
  }
  function lineUtil(code) { var cs = cellsOf(code); return cs.reduce(function (s, c) { return s + c.utilization; }, 0) / cs.length; }
  function lineBase(code) { var cs = cellsOf(code); return cs.reduce(function (s, c) { return s + c.utilizationBaseline; }, 0) / cs.length; }

  // Flattened navigation order: line header, then its cells.
  function navItems() {
    var items = [];
    state.plant.lines.forEach(function (l) {
      items.push({ type: 'line', id: l.code });
      cellsOf(l.code).forEach(function (c) { items.push({ type: 'cell', id: c.cellId }); });
    });
    return items;
  }
  function selIndex() { var items = navItems(); for (var i = 0; i < items.length; i++) if (items[i].type === state.sel.type && items[i].id === state.sel.id) return i; return -1; }

  // ---- Machine list ----
  function renderList() {
    var q = state.q.toLowerCase();
    var html = '';
    var total = 0;
    state.plant.lines.forEach(function (line) {
      var cells = cellsOf(line.code).filter(function (c) {
        return !q || c.cellId.toLowerCase().indexOf(q) >= 0 || c.operator.toLowerCase().indexOf(q) >= 0 || c.workOrder.indexOf(q) >= 0 || line.name.toLowerCase().indexOf(q) >= 0;
      });
      total += cellsOf(line.code).length;
      if (!cells.length) return;
      var on = state.sel.type === 'line' && state.sel.id === line.code;
      html += '<div class="grp' + (on ? ' on' : '') + '" data-line="' + line.code + '"><span class="nm">' + esc(line.name.replace(' — ', ' · ')) + '</span>' +
        '<span class="st"><span class="dot ' + lineCategory(line) + '"></span>' + (line.stale ? 'Not Reporting' : line.runningCells + '/' + line.cellCount + ' active') + '</span></div>';
      cells.forEach(function (c) {
        var onC = state.sel.type === 'cell' && state.sel.id === c.cellId;
        var big, delta;
        if (state.metric === 'parts') {
          big = c.partsGood == null ? '–' : c.partsGood + ' <span class="muted" style="font-size:12px">/ ' + c.partsGoal + '</span>';
          delta = c.partsGood == null ? '' : '<span class="muted">' + Math.round(c.partsGood / c.partsGoal * 100) + '% of goal</span>';
        } else if (state.metric === 'oee') {
          var oee = c.category === 'unknown' ? null : c.utilization * Math.min(1, (c.ratePerHr || 0) / (lineOf(c.lineCode).targetRatePerHr)) * (c.partsGood ? c.partsGood / (c.partsGood + c.partsReject) : 1);
          big = pct(oee); delta = pp(oee, c.utilizationBaseline * 0.9);
        } else {
          big = pct(c.utilization); delta = pp(c.utilization, c.utilizationBaseline);
        }
        var stateTxt = c.category === 'unknown'
          ? 'Not Reporting: ' + ago(c.lastSampleAt)
          : statusWord(c.category) + ': ' + ago(c.stateSince);
        html += '<div class="m' + (onC ? ' on' : '') + '" data-cell="' + c.cellId + '">' +
          '<div class="r1"><span class="name">' + esc(c.cellId) + '</span><span class="job">' + esc(c.workOrder) + ' | ' + esc(c.operation) + '</span></div>' +
          '<div class="r2"><span><span class="dot ' + c.category + '"></span>' + esc(stateTxt) + '</span>' +
          (c.firstActiveAt ? '<span>⚑ First Active: ' + fmtTime(c.firstActiveAt) + '</span>' : '<span>⚑ Not Active Today</span>') + '</div>' +
          '<div class="r3"><span class="big">' + big + '</span><span class="delta">' + delta + '</span></div>' +
          '</div>';
      });
    });
    $('list').innerHTML = html;
    $('mCount').textContent = total;
  }

  // ---- Header + notice ----
  function renderNotice() {
    var stale = state.plant.lines.filter(function (l) { return l.stale; });
    if (!stale.length) { $('notice').innerHTML = ''; return; }
    var l = stale[0];
    var failed = state.plant.summary.failedRunsLast24h;
    $('notice').innerHTML = '<div class="notice"><b>' + esc(l.name) + '</b>' +
      '<span>' + l.cellCount + ' machines Not Reporting for ' + ago(l.lastPublishedAt) + ' · historian → MES interval publish failing at <span class="mono">decode</span> (' + l.consecutiveFailures + ' consecutive, ' + failed + ' in 24h)</span>' +
      '<a href="#" data-diag="' + l.code + '">View diagnostics ›</a></div>';
  }

  function renderHeader() {
    var items = navItems();
    var idx = selIndex();
    $('pgText').textContent = (idx + 1) + ' of ' + items.length;
    if (state.sel.type === 'cell') {
      var c = cellById(state.sel.id);
      $('hdName').textContent = c.cellId;
      $('hdStatus').innerHTML = '<span class="dot ' + c.category + '"></span>' + (c.category === 'unknown'
        ? 'Not Reporting: ' + ago(c.lastSampleAt)
        : statusWord(c.category) + ': ' + ago(c.stateSince)) +
        ' <span class="faint">·</span> ' + esc(c.partNumber) + ' ' + esc(c.partName) + ' <span class="faint">·</span> ' + esc(c.operator);
    } else {
      var l = lineOf(state.sel.id);
      $('hdName').textContent = l.name;
      $('hdStatus').innerHTML = '<span class="dot ' + lineCategory(l) + '"></span>' + (l.stale ? 'Not Reporting: ' + ago(l.lastPublishedAt) : l.runningCells + ' of ' + l.cellCount + ' active') +
        ' <span class="faint">·</span> ' + esc(l.controller) + ' <span class="faint">·</span> ' + esc(l.area);
    }
    Array.prototype.forEach.call(document.querySelectorAll('.tabs button'), function (b) { b.classList.toggle('on', b.getAttribute('data-tab') === state.tab); });
  }

  // ---- Downtime aggregation from timelines ----
  function downtimeBreakdown(cells) {
    var map = {};
    var totalMin = 0, events = 0;
    cells.forEach(function (c) {
      c.timeline.forEach(function (s) {
        if (s.category === 'running') return;
        var min = s.end - s.start;
        var key = s.category === 'unknown' ? 'Not Reporting' : (s.reason || 'Uncategorized');
        map[key] = (map[key] || 0) + min;
        totalMin += min; events += 1;
      });
    });
    var rows = Object.keys(map).map(function (k) { return { reason: k, min: map[k] }; }).sort(function (a, b) { return b.min - a.min; });
    return { rows: rows, totalMin: totalMin, events: events };
  }

  // ---- Overview ----
  function filters() {
    var sh = state.plant.shift;
    return '<div class="filters">' +
      '<span class="chip">📅 Today: ' + fmtDate(state.plant.generatedAt) + '</span>' +
      '<span class="chip">' + esc(sh.label) + ' (' + esc(sh.window) + ')<span class="chev">▾</span></span>' +
      '<span class="chip dis">All Operations</span></div>';
  }
  function barsPanel(cells) {
    var dt = downtimeBreakdown(cells);
    var top = dt.rows.slice(0, 5);
    var max = top.length ? top[0].min : 1;
    var html = '<div class="panel"><div class="ph">Top 5 Downtimes by duration<span class="sub">' + fmtMin(dt.totalMin) + ' total · ' + dt.events + ' events</span></div><div class="bars">';
    if (!top.length) html += '<div class="empty">No downtime this shift.</div>';
    top.forEach(function (r) {
      html += '<div class="bar"><span class="lbl" title="' + esc(r.reason) + '">' + esc(r.reason) + '</span><span class="trk"><i style="width:' + (r.min / max * 100) + '%"></i></span><span class="val">' + fmtMin(r.min) + '</span></div>';
    });
    if (top.length) {
      var ticks = [0, 0.25, 0.5, 0.75, 1].map(function (f) { return '<span>' + fmtMin(Math.round(max * f)) + '</span>'; }).join('');
      html += '<div class="axis"><span></span><span class="tk">' + ticks + '</span><span></span></div>';
    }
    return html + '</div></div>';
  }
  function runsTable(cells) {
    var html = '<div class="panel"><div class="ph">Production Runs <span class="pill gray">' + cells.length + '</span><span class="faint">|</span><span class="muted" style="font-weight:400">Operators <span class="pill gray">' + uniq(cells.map(function (c) { return c.operator; })).length + '</span></span></div>' +
      '<table><thead><tr><th>Machine</th><th>Operation</th><th>Part</th><th class="num">Good / Rej</th><th class="num">Parts Goal</th><th class="num">Cycle vs Expected</th><th class="num">Utilization</th><th>Operator</th><th>First Active</th></tr></thead><tbody>';
    cells.forEach(function (c) {
      var cyc = c.actualCycleSec == null ? '–' : c.actualCycleSec + 's <span class="muted">/ ' + c.expectedCycleSec + 's</span>';
      var cycD = c.actualCycleSec == null ? '' : (c.actualCycleSec <= c.expectedCycleSec ? ' <span class="up">✓</span>' : ' <span class="dn">+' + (c.actualCycleSec - c.expectedCycleSec).toFixed(1) + 's</span>');
      html += '<tr><td><b>' + esc(c.cellId) + '</b></td><td>' + esc(c.workOrder) + ' <span class="muted">' + esc(c.operation) + '</span></td><td>' + esc(c.partNumber) + ' <span class="muted">' + esc(c.partName) + '</span></td>' +
        '<td class="num">' + (c.partsGood == null ? '–' : c.partsGood + ' <span class="muted">/ ' + c.partsReject + '</span>') + '</td>' +
        '<td class="num">' + (c.partsGood == null ? '–' : c.partsGood + ' <span class="muted">/ ' + c.partsGoal + '</span>') + '</td>' +
        '<td class="num">' + cyc + cycD + '</td><td class="num">' + pct(c.utilization) + '</td><td>' + esc(c.operator) + '</td><td>' + (c.firstActiveAt ? fmtTime(c.firstActiveAt) : '<span class="muted">Not Active Today</span>') + '</td></tr>';
    });
    return html + '</tbody></table></div>';
  }
  function uniq(a) { return a.filter(function (v, i) { return a.indexOf(v) === i; }); }

  function renderOverview() {
    var cells, util, base, good, rej, goal, oee, oeeLbl, extra;
    var dt;
    if (state.sel.type === 'cell') {
      var c = cellById(state.sel.id);
      cells = [c]; util = c.category === 'unknown' ? null : c.utilization; base = c.utilizationBaseline;
      good = c.partsGood; rej = c.partsReject; goal = c.partsGoal;
      oeeLbl = 'Cycle Time'; oee = null;
      extra = c.actualCycleSec == null ? '<div class="v">–</div><div class="d muted">no cycles this shift</div>'
        : '<div class="v">' + c.actualCycleSec + 's<small>/ ' + c.expectedCycleSec + 's expected</small></div><div class="d">' + (c.actualCycleSec <= c.expectedCycleSec ? '<span class="up">↓ ' + (c.expectedCycleSec - c.actualCycleSec).toFixed(1) + 's faster</span>' : '<span class="dn">↑ ' + (c.actualCycleSec - c.expectedCycleSec).toFixed(1) + 's slower</span>') + '</div>';
    } else {
      var l = lineOf(state.sel.id);
      cells = cellsOf(l.code); util = l.stale ? null : lineUtil(l.code); base = lineBase(l.code);
      good = l.stale ? null : l.shiftGoodCount; rej = l.shiftRejectCount; goal = l.targetRatePerHr * 8;
      oeeLbl = 'OEE'; oee = l.stale ? null : l.oee;
      extra = '<div class="v">' + pct(oee) + '</div><div class="d muted">' + (l.stale ? 'excluded from plant rollup' : 'A ' + pct(l.availability, 0) + ' · P ' + pct(l.performance, 0) + ' · Q ' + pct(l.quality, 1)) + '</div>';
    }
    dt = downtimeBreakdown(cells);
    var html = filters() +
      '<div class="panel"><div class="strip">' +
      '<div class="k"><div class="lbl">Utilization</div><div class="v">' + pct(util) + '</div><div class="d">' + (util == null ? '<span class="muted">Not Reporting</span>' : pp(util, base)) + '</div></div>' +
      '<div class="k"><div class="lbl">Parts</div><div class="v">' + (good == null ? '–' : good + '<small>/ ' + goal + ' goal</small>') + '</div><div class="d">' + (good == null ? '<span class="muted">no count published</span>' : '<span class="' + (rej / Math.max(good, 1) > 0.03 ? 'dn' : 'muted') + '">' + rej + ' rejected · ' + (rej / Math.max(good + rej, 1) * 100).toFixed(1) + '%</span>') + '</div></div>' +
      '<div class="k"><div class="lbl">Downtime</div><div class="v">' + fmtMin(dt.totalMin / cells.length) + '</div><div class="d muted">' + dt.events + ' events' + (cells.length > 1 ? ' · avg per machine' : '') + '</div></div>' +
      '<div class="k"><div class="lbl">' + oeeLbl + '</div>' + extra + '</div>' +
      '</div></div>' +
      barsPanel(cells) + runsTable(cells);
    $('ct').innerHTML = html;
  }

  // ---- Timeline ----
  function ribbon(segs, cls, withLabel) {
    var html = '';
    segs.forEach(function (s) {
      var left = s.start / SHIFT_MIN * 100, w = (s.end - s.start) / SHIFT_MIN * 100;
      var title = (s.state || '') + (s.reason ? ' — ' + s.reason : '') + ' · ' + fmtMin(s.end - s.start);
      html += '<i class="' + (cls || s.category) + '" style="left:' + left + '%;width:' + w + '%" title="' + esc(title) + '">' + (withLabel && w > 4 ? '<span>' + esc(s.reason || s.state) + '</span>' : '') + '</i>';
    });
    return html;
  }
  function nowMarker() { var e = Math.min(state.plant.shift.elapsedMin, SHIFT_MIN); return '<span class="now" style="left:' + (e / SHIFT_MIN * 100) + '%"></span>'; }
  function axisRow() {
    var start = new Date(state.plant.shift.startsAt).getTime();
    var html = '<div class="tax"><span></span><div class="tk">';
    for (var m = 0; m <= SHIFT_MIN; m += 60) html += '<span style="left:' + (m / SHIFT_MIN * 100) + '%">' + fmtTime(new Date(start + m * 60000).toISOString()) + '</span>';
    return html + '</div></div>';
  }
  function renderTimeline() {
    var sh = state.plant.shift;
    var html = '<div class="filters"><span class="chip">‹</span><span class="chip">›</span><span class="chip">📅 ' + esc(sh.label) + ': ' + fmtTime(sh.startsAt) + ' – ' + fmtTime(sh.endsAt) + ', ' + fmtDate(sh.startsAt) + '</span></div>';
    if (state.sel.type === 'cell') {
      var c = cellById(state.sel.id);
      var run = c.timeline.filter(function (s) { return s.category === 'running'; }).reduce(function (a, s) { return a + s.end - s.start; }, 0);
      var dtSegs = c.timeline.filter(function (s) { return s.category !== 'running' && s.category !== 'unknown'; });
      var dt = downtimeBreakdown([c]);
      html += '<div class="panel"><div class="tl">' + axisRow() +
        '<div class="sect"><span class="lbl">Execution</span><span class="meta">Active Duration: <b>' + fmtMin(run) + '</b> &nbsp;|&nbsp; Utilization: <b>' + pct(c.utilization, 2) + '</b></span></div>' +
        '<div class="row"><span class="lbl">' + esc(c.cellId) + '<small>' + esc(c.workOrder) + ' | ' + esc(c.operation) + '</small></span><div class="rib">' + ribbon(c.timeline) + nowMarker() + '</div></div>' +
        '<div class="sect"><span class="lbl">Parts</span><span class="meta">Total Parts: <b>' + (c.partsGood == null ? '–' : c.partsGood + c.partsReject) + '</b> &nbsp;|&nbsp; Good Parts: <b>' + (c.partsGood == null ? '–' : c.partsGood) + '</b> &nbsp;|&nbsp; Rejected: <b>' + (c.partsReject == null ? '–' : c.partsReject) + '</b> &nbsp;|&nbsp; Expected cycle: <b>' + c.expectedCycleSec + 's</b></span></div>' +
        '<div class="row"><span class="lbl"></span><div class="rib" style="background:transparent">' + partDots(c) + nowMarker() + '</div></div>' +
        '<div class="sect"><span class="lbl">Downtime</span><span class="meta">Total Downtime: <b>' + fmtMin(dt.totalMin) + '</b> &nbsp;|&nbsp; Categorized: <b>' + fmtMin(dt.rows.filter(function (r) { return r.reason !== 'Uncategorized'; }).reduce(function (a, r) { return a + r.min; }, 0)) + '</b> &nbsp;|&nbsp; Events: <b>' + dt.events + '</b></span></div>' +
        '<div class="row"><span class="lbl"></span><div class="rib">' + ribbon(dtSegs.map(function (s) { return { start: s.start, end: s.end, state: s.state, reason: s.reason || 'Uncategorized', category: 'dt' }; }), 'dt', true) + (c.category === 'unknown' ? ribbon(c.timeline, 'unknown', true) : '') + nowMarker() + '</div></div>' +
        '<div class="sect"><span class="lbl">Alarms</span><span class="meta">' + (c.controlAlarm ? 'Active: <b>' + esc(c.controlAlarm) + '</b> since ' + fmtTime(c.stateSince) : 'No control alarms this shift') + '</span></div>' +
        '<div class="row"><span class="lbl"></span><div class="rib">' + (c.controlAlarm ? '<i class="alm" style="left:' + (Math.max(0, sh.elapsedMin - (Date.now() - new Date(c.stateSince).getTime()) / 60000) / SHIFT_MIN * 100) + '%" title="' + esc(c.controlAlarm) + '"></i>' : '') + nowMarker() + '</div></div>' +
        '<div class="sect"><span class="lbl">Operators</span><span class="meta">Total Operator Runs: <b>1</b> &nbsp;|&nbsp; Duration: <b>' + fmtMin(sh.elapsedMin) + '</b></span></div>' +
        '<div class="row"><span class="lbl"></span><div class="rib">' + ribbon([{ start: 0, end: sh.elapsedMin, state: c.operator, category: 'op' }], 'op', true) + nowMarker() + '</div></div>' +
        '</div>' + legend() + '</div>';
    } else {
      var l = lineOf(state.sel.id);
      var cells = cellsOf(l.code);
      var tot = 0;
      cells.forEach(function (c) { c.timeline.forEach(function (s) { if (s.category === 'running') tot += s.end - s.start; }); });
      html += '<div class="panel"><div class="tl">' + axisRow() +
        '<div class="sect"><span class="lbl">Execution</span><span class="meta">Active Duration: <b>' + fmtMin(tot / cells.length) + '</b> avg &nbsp;|&nbsp; Utilization: <b>' + (l.stale ? '–' : pct(lineUtil(l.code), 2)) + '</b> &nbsp;|&nbsp; ' + cells.length + ' machines</span></div>';
      cells.forEach(function (c) {
        html += '<div class="row"><span class="lbl">' + esc(c.cellId) + '<small>' + esc(c.workOrder) + ' | ' + esc(c.operation) + ' · ' + esc(c.operator) + '</small></span><div class="rib">' + ribbon(c.timeline) + nowMarker() + '</div></div>';
      });
      html += '</div>' + legend() + '</div>';
    }
    $('ct').innerHTML = html;
  }
  function partDots(c) {
    if (c.partsGood == null) return '';
    var html = '';
    var every = Math.max(1, Math.round(c.expectedCycleSec / 60 * 3)); // one dot per ~3 cycles
    c.timeline.filter(function (s) { return s.category === 'running'; }).forEach(function (s) {
      for (var m = s.start; m < s.end; m += every) html += '<i style="left:' + (m / SHIFT_MIN * 100) + '%;width:3px;top:7px;height:4px;border-radius:2px;background:#8f93a8"></i>';
    });
    return html;
  }
  function legend() {
    return '<div class="legend"><span><i style="background:var(--run)"></i>Active</span><span><i style="background:var(--idle)"></i>Idle</span><span><i style="background:var(--setup)"></i>Setup</span><span><i style="background:var(--down)"></i>Fault</span><span><i style="background:var(--unknown)"></i>Not Reporting</span><span><i style="background:var(--dt)"></i>Downtime (categorized)</span></div>';
  }

  // ---- Diagnostics ----
  function renderDiagnostics() {
    var code = state.sel.type === 'cell' ? cellById(state.sel.id).lineCode : state.sel.id;
    var cell = state.sel.type === 'cell' ? cellById(state.sel.id) : null;
    var l = lineOf(code);
    var tags = state.plant.tags.filter(function (t) { return t.lineCode === code && (!cell || !t.cellId || t.cellId === cell.cellId); });
    var alarms = state.plant.alarms.filter(function (a) { return a.lineCode === code && (!cell || !a.cellId || a.cellId === cell.cellId); });
    var runs = state.runs[code];
    var html = '';
    if (l.stale) {
      html += '<div class="panel" style="border-color:#f0c4bf;background:#fdf3f2"><div class="ph" style="border:0;color:#7a2e29">Not Reporting since ' + fmtTimeS(l.lastPublishedAt) + ' (' + fmtDate(l.lastPublishedAt) + ')<span class="sub" style="color:#7a2e29">' + l.consecutiveFailures + ' consecutive interval publishes failed at <span class="mono">decode</span> since the ' + esc(l.adapter) + '. Live samples are landing in the historian; nothing reaches MES.</span></div></div>';
    }
    html += '<div class="panel"><div class="ph">Data Source<span class="sub">' + esc(l.name) + '</span></div><div class="dl">' +
      dl('Adapter', l.adapter) + dl('Protocol', { mtconnect: 'MTConnect', opcda: 'OPC DA', opcua: 'OPC UA' }[l.protocol] || l.protocol) + dl('Controller', l.controller) + dl('Scan class', l.scanClass) +
      dl('State model', l.stateModel === 'packml' ? 'PackML StateCurrent (ISA-TR88)' : 'MTConnect Execution') + dl('Quality encoding', '<span class="mono">' + esc(l.qualityEncoding) + '</span>') + dl('Manifest', 'v' + l.manifestVersion) +
      dl('Last MES publish', l.stale ? '<span class="dn">' + ago(l.lastPublishedAt) + ' ago</span>' : fmtTimeS(l.lastPublishedAt)) +
      '</div></div>';

    html += '<div class="panel"><div class="ph">MES Interval Publish<span class="sub">every ' + state.plant.intervalMinutes + ' min · job <span class="mono">mes-ingest</span> · gateway P07-EDGE-02</span>' +
      '<div class="right"><button class="btn pri" id="runNow" data-line="' + code + '">Run interval now</button></div></div>';
    if (!runs) { html += '<div class="empty">Loading jobs…</div>'; }
    else if (!runs.length) { html += '<div class="empty">No jobs recorded.</div>'; }
    else {
      html += '<table><thead><tr><th>Job</th><th>Started</th><th>Trigger</th><th>Stage reached</th><th class="num">Rows in → out</th><th class="num">Duration</th><th>Status</th></tr></thead><tbody>';
      runs.slice(0, 12).forEach(function (r) {
        html += '<tr><td class="mono">' + esc(r.runId) + '</td><td>' + fmtTimeS(r.startedAt) + ' <span class="muted">' + fmtDate(r.startedAt) + '</span></td><td>' + esc(r.trigger) + '</td><td class="mono">' + esc(r.stageReached) + '</td><td class="num">' + r.rowsIn + ' → ' + r.rowsOut + '</td><td class="num">' + (r.durationMs == null ? '–' : r.durationMs + ' ms') + '</td>' +
          '<td><span class="pill ' + (r.status === 'succeeded' ? 'ok' : 'fail') + '">' + esc(r.status) + '</span>' + (r.error ? '<div class="errline mono">' + esc(r.error.name) + ': ' + esc(r.error.message) + '</div>' : '') + '</td></tr>';
      });
      html += '</tbody></table>';
    }
    html += '</div>';

    html += '<div class="panel"><div class="ph">Data Items<span class="sub">' + tags.length + ' tags · historian path · last value</span></div><table><thead><tr><th>Path</th><th>Type</th><th class="num">Value</th><th>EU</th><th>Quality</th><th>Timestamp</th></tr></thead><tbody>';
    tags.forEach(function (t) {
      html += '<tr><td class="mono">' + esc(t.path) + '</td><td class="mono muted">' + esc(t.dataType) + '</td><td class="num">' + (t.value == null ? '<span class="muted">—</span>' : esc(t.value) + (t.display && String(t.display) !== String(t.value) ? ' <span class="muted">(' + esc(t.display) + ')</span>' : '')) + '</td><td class="muted">' + esc(t.eu) + '</td><td><span class="q ' + esc(t.quality) + '">' + esc(t.quality) + '</span></td><td>' + fmtTimeS(t.timestamp) + ' <span class="muted">' + fmtDate(t.timestamp) + '</span></td></tr>';
    });
    html += '</tbody></table></div>';

    html += '<div class="panel"><div class="ph">Alarms<span class="sub">' + alarms.filter(function (a) { return a.state.indexOf('ACTIVE') === 0; }).length + ' active · ' + alarms.filter(function (a) { return /_UNACK$/.test(a.state); }).length + ' unacknowledged</span></div>';
    if (!alarms.length) html += '<div class="empty">No alarms for this selection.</div>';
    else {
      html += '<table><thead><tr><th>Tag</th><th>Description</th><th>Priority</th><th>State</th><th class="num">Value / Limit</th><th>Active</th><th>Ack</th><th></th></tr></thead><tbody>';
      alarms.forEach(function (a) {
        var pr = a.priority === 'CRITICAL' || a.priority === 'HIGH' ? 'fail' : a.priority === 'MEDIUM' ? 'warn' : 'gray';
        html += '<tr><td class="mono">' + esc(a.tag) + '</td><td style="white-space:normal">' + esc(a.description) + '</td><td><span class="pill ' + pr + '">' + esc(a.priority) + '</span></td><td class="mono">' + esc(a.state) + '</td><td class="num">' + esc(a.value) + ' <span class="muted">/ ' + esc(a.limit) + ' ' + esc(a.eu) + '</span></td><td>' + fmtTime(a.activeAt) + ' <span class="muted">' + ago(a.activeAt) + ' ago</span></td><td>' + (a.ackBy ? esc(a.ackBy) + ' <span class="muted">' + fmtTime(a.ackAt) + '</span>' : '<span class="muted">—</span>') + '</td>' +
          '<td>' + (/_UNACK$/.test(a.state) ? '<button class="btn sm" data-ack="' + esc(a.id) + '">Ack</button>' : '') + '</td></tr>';
      });
      html += '</tbody></table>';
    }
    html += '</div>';
    $('ct').innerHTML = html;
    if (!runs) loadRuns(code);
  }
  function dl(k, v) { return '<div><div class="lbl">' + k + '</div><div class="v">' + v + '</div></div>'; }

  // ---- Data ----
  function load() {
    return fetch(API + '/plant').then(function (r) { return r.json(); }).then(function (p) {
      state.plant = p;
      if (!state.sel) state.sel = { type: 'cell', id: p.cells[0].cellId };
      render();
    });
  }
  function loadRuns(code) {
    return fetch(API + '/runs?line=' + encodeURIComponent(code) + '&limit=20').then(function (r) { return r.json(); }).then(function (d) {
      state.runs[code] = d.runs;
      if (state.tab === 'diagnostics') renderDiagnostics();
    });
  }
  function runNow(code, btn) {
    btn.disabled = true; btn.textContent = 'Running…';
    var body = identity(); body.lineCode = code;
    fetch(API + '/runs', { method: 'POST', headers: postHeaders(), body: JSON.stringify(body) })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var run = d.runs && d.runs[0];
        if (run && run.status === 'succeeded') toast('Job ' + run.runId + ' published ' + run.rowsOut + ' rows to MES in ' + run.durationMs + ' ms.');
        else if (run) toast('Job ' + run.runId + ' failed at ' + run.stageReached + ' — ' + (run.error ? run.error.message : 'unknown error'), true);
        else toast(d.error || 'Request failed', true);
        delete state.runs[code];
        return load();
      })
      .catch(function (e) { toast(e.message, true); btn.disabled = false; btn.textContent = 'Run interval now'; });
  }
  function ack(id) {
    fetch(API + '/alarms/' + encodeURIComponent(id) + '/ack', { method: 'POST', headers: postHeaders(), body: JSON.stringify({ user: currentUser().handle }) })
      .then(function () { return load(); });
  }
  var toastTimer;
  function toast(msg, fail) {
    var t = $('toast'); t.textContent = msg; t.className = 'toast' + (fail ? ' fail' : ''); t.style.display = 'block';
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.style.display = 'none'; }, 6000);
  }

  function render() {
    renderList(); renderNotice(); renderHeader();
    if (state.tab === 'overview') renderOverview();
    else if (state.tab === 'timeline') renderTimeline();
    else renderDiagnostics();
  }

  // ---- Events ----
  $('list').addEventListener('click', function (e) {
    var m = e.target.closest('.m'), g = e.target.closest('.grp');
    if (m) state.sel = { type: 'cell', id: m.getAttribute('data-cell') };
    else if (g) state.sel = { type: 'line', id: g.getAttribute('data-line') };
    else return;
    render();
  });
  $('q').addEventListener('input', function (e) { state.q = e.target.value; renderList(); });
  $('metricSel').addEventListener('change', function (e) { state.metric = e.target.value; renderList(); });
  document.querySelector('.tabs').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    state.tab = b.getAttribute('data-tab'); render();
  });
  $('pgPrev').addEventListener('click', function () { var items = navItems(); var i = selIndex(); state.sel = items[(i - 1 + items.length) % items.length]; render(); });
  $('pgNext').addEventListener('click', function () { var items = navItems(); var i = selIndex(); state.sel = items[(i + 1) % items.length]; render(); });
  $('notice').addEventListener('click', function (e) {
    var a = e.target.closest('a[data-diag]'); if (!a) return;
    e.preventDefault(); state.sel = { type: 'line', id: a.getAttribute('data-diag') }; state.tab = 'diagnostics'; render();
  });
  $('ct').addEventListener('click', function (e) {
    var run = e.target.closest('#runNow'); if (run) return runNow(run.getAttribute('data-line'), run);
    var a = e.target.closest('[data-ack]'); if (a) return ack(a.getAttribute('data-ack'));
  });

  $('sbUserName').textContent = currentUser().handle;

  // Same fallback the hub applies: a locked server-side org/user seeds the hub identity.
  if (!(localStorage.getItem('devinOrgId') && localStorage.getItem('devinUserId'))) {
    fetch('/api/config').then(function (r) { return r.json(); }).then(function (cfg) {
      if (cfg.lockOrg && cfg.defaultOrgId) localStorage.setItem('devinOrgId', cfg.defaultOrgId);
      if (cfg.lockUser && cfg.defaultUserId) localStorage.setItem('devinUserId', cfg.defaultUserId);
      if (cfg.defaultEmail && !localStorage.getItem('devinEmail')) localStorage.setItem('devinEmail', cfg.defaultEmail);
      $('sbUserName').textContent = currentUser().handle;
    }).catch(function () {});
  }

  load();
  setInterval(function () { if (state.plant) { renderList(); renderHeader(); } }, 15000);
})();
</script>
</body>
</html>
