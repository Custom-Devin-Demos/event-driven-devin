  @font-face { font-family: "Items Pomelo"; src: url(/verticals/b4fb2968/ItemsPomelo-Bold.woff2) format("woff2"); font-weight: 700; font-display: swap; }
  :root {
    --ink: #393939; --ink-2: #5E5E5E; --black: #1B1B1B; --paper: #FCFCFA; --line: #675D6C;
    --glass: rgba(252, 252, 250, 0.6);
    --glass-shadow: rgba(255, 255, 255, 0.35) -1px -1px 1px 0px inset, rgba(255, 255, 255, 0.75) 1px 1px 1px 0px inset, rgba(0, 0, 0, 0.1) 0px 2px 8px -2px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: Senes, sans-serif; font-size: 16px; line-height: 24px; color: #000;
    background: #D0E2ED linear-gradient(#F5FFCF, #FAE6E3, #F1ECF3, #E8DDEE, #D0E2ED) fixed;

  button { font: inherit; color: inherit; }
  a { color: inherit; }
  .page { min-height: 100vh; display: flex; flex-direction: column; padding: 0 20px; }
  .page.full { padding: 0; }

  /* header */
  .hdr { display: flex; align-items: center; justify-content: space-between; height: 80px; padding: 16px 8px; margin: 8px 0 16px; }
  .hdr-l { display: flex; align-items: center; gap: 20px; }
  .logo { color: var(--ink); font-family: "Items Pomelo", serif; font-size: 34px; font-weight: 700; line-height: 100%; transform: translateY(-2px); text-decoration: none; }
  .back {
    width: 34px; height: 34px; border: 0; border-radius: 50%; padding: 0; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; color: #50453C;
    background: rgba(252, 252, 250, 0.4);
    box-shadow: rgba(255, 255, 255, 0.35) -1px -1px 1px 0px inset, rgba(255, 255, 255, 0.75) 1px 1px 1px 0px inset, rgba(0, 0, 0, 0.15) 0px 0px 26px 0px;
  }
  .back svg { width: 16px; height: 16px; }
  .lang { height: 48px; width: 64px; border: 0; border-radius: 12px; background: transparent; cursor: pointer; display: inline-flex; align-items: center; justify-content: flex-end; gap: 4px; color: var(--ink); font-size: 14px; line-height: 20px; padding: 0; }
  .lang svg { width: 14px; height: 14px; }
  .hdr.mid { position: relative; height: 96px; margin: 0 -20px 32px; padding: 16px 20px; justify-content: center; }
  .hdr.mid .back { position: absolute; left: 20px; top: 27px; }
  .hdr.mid .lang { position: absolute; right: 20px; top: 20px; }
  .hdr.mid .logo { margin-top: -12px; }
  .progress { position: absolute; left: 20px; right: 20px; top: 76px; height: 4px; border-radius: 8px; background: var(--paper); overflow: hidden; }
  .progress > div { height: 100%; border-radius: 8px; background: var(--black); transition: width .4s ease; }

  /* content */
  main { flex: 1; width: 100%; }
  .hdr:not(.mid) + main { padding-top: 19px; }
  .col { width: 500px; max-width: 100%; margin: 0 auto; text-align: center; }
  h1 { font-family: Items, serif; font-weight: 500; font-size: 48px; line-height: 48px; letter-spacing: -0.48px; color: var(--ink); margin: 0 0 16px; }
  h1.solo { margin-bottom: 32px; }
  .sub { color: var(--ink-2); letter-spacing: -0.16px; margin: 0 0 32px; }
  .sub.ink { color: var(--ink); }
  .opts { display: flex; flex-direction: column; gap: 16px; text-align: left; }
  .opt {
    display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 19px 15px; cursor: pointer; user-select: none;
    background: var(--glass); border: 1px solid rgba(173, 173, 172, 0); border-radius: 20px; box-shadow: var(--glass-shadow);
    transition: border-color .15s, background-color .15s;
  }
  .opt:hover { background: rgba(252, 252, 250, 0.8); }
  .opt.on { border-color: var(--line); background: rgba(252, 252, 250, 0.85); }
  .opt input { position: absolute; opacity: 0; pointer-events: none; }
  .cbx { flex: 0 0 24px; width: 24px; height: 24px; border-radius: 8px; border: .5px solid var(--line); background: rgba(252, 252, 250, 0.4); display: inline-flex; align-items: center; justify-content: center; }
  .opt.on .cbx { background: #B2D1E4; }
  .cbx svg { width: 14px; height: 14px; opacity: 0; color: var(--black); }
  .opt.on .cbx svg { opacity: 1; }
  .err { color: #B42318; font-size: 14px; line-height: 20px; margin: -16px 0 16px; text-align: left; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 60px; padding: 20px; border: 0; border-radius: 12px; cursor: pointer;
    background: var(--black); color: var(--paper); font-size: 16px; line-height: 20px; box-shadow: var(--line) 0px 0px 0px 1px inset;
  }
  .btn:hover { background: #333; }
  .btn[disabled] { cursor: default; }
  .btn.outline { background: transparent; color: var(--ink); height: 44px; padding: 10px 20px; box-shadow: var(--line) 0px 0px 0px 1px inset; }
  .btn.outline:hover { background: rgba(252, 252, 250, 0.4); }
  .spin { width: 20px; height: 20px; border-radius: 50%; border: 2px solid rgba(252, 252, 250, .35); border-top-color: var(--paper); animation: spin .8s linear infinite; }

  .mt32 { margin-top: 32px; } .mt24 { margin-top: 24px; } .mt16 { margin-top: 16px; }
  .fine { color: var(--ink-2); font-size: 12px; line-height: 18px; }
  .note { color: var(--ink); font-size: 14px; line-height: 20px; }

  /* fields */
  .field { text-align: left; margin-bottom: 24px; }

    width: 100%; height: 56px; padding: 16.5px 14px; border-radius: 12px; border: 1px solid #8E8A90; background: var(--glass);
    font: inherit; font-size: 16px; line-height: 20px; letter-spacing: -0.16px; color: var(--ink); outline: none;
  }
  .inp:hover { border-color: var(--ink); }
  .inp:focus { border-color: var(--black); box-shadow: 0 0 0 1px var(--black); }
  .sel { position: relative; }
  .sel .inp { text-align: left; cursor: pointer; display: flex; align-items: center; justify-content: space-between; }
  .sel .caret { width: 24px; height: 24px; color: #5E5E5E; margin-right: -4px; }
  .menu {
    position: absolute; left: 0; right: 0; top: 60px; z-index: 30; max-height: 320px; overflow: auto; list-style: none; margin: 0; padding: 8px 0;
    background: #FCFCFA; border-radius: 12px; box-shadow: rgba(0, 0, 0, 0.2) 0px 5px 5px -3px, rgba(0, 0, 0, 0.14) 0px 8px 10px 1px, rgba(0, 0, 0, 0.12) 0px 3px 14px 2px;

  .menu li { padding: 6px 16px; min-height: 36px; display: flex; align-items: center; cursor: pointer; color: var(--black); font-size: 16px; line-height: 24px; }

  .menu li.sel-on { background: rgba(27, 27, 27, 0.08); }
  .alert { display: flex; gap: 12px; align-items: flex-start; text-align: left; margin: -8px 0 24px; padding: 12px 16px; border-radius: 12px; background: rgba(253, 236, 234, .85); color: #5F2120; font-size: 14px; line-height: 20px; }
  .alert svg { flex: 0 0 20px; width: 20px; height: 20px; color: #D32F2F; margin-top: 0; }
  .alert b { display: block; font-weight: 600; margin-bottom: 2px; }
  .chk { display: flex; gap: 12px; align-items: flex-start; text-align: left; cursor: pointer; margin-bottom: 16px; color: var(--ink); }
  .chk input { position: absolute; opacity: 0; }
  .chk .box { flex: 0 0 20px; width: 20px; height: 20px; margin-top: 2px; border-radius: 6px; border: .5px solid var(--line); background: rgba(252, 252, 250, 0.4); display: inline-flex; align-items: center; justify-content: center; }
  .chk.on .box { background: #B2D1E4; }
  .chk .box svg { width: 12px; height: 12px; opacity: 0; }
  .chk.on .box svg { opacity: 1; }
  .chk a { font-weight: 600; text-underline-offset: 2px; }
  .sponsor { margin: 0 0 32px; padding: 14px 16px; border-radius: 12px; background: #F2FCCB; color: var(--ink); text-align: center; line-height: 24px; }
  .sponsor a, a.u { font-weight: 600; text-underline-offset: 3px; }

  /* footer */
  .ftr { display: flex; justify-content: center; gap: 48px; padding: 32px 0 48px; margin-top: 64px; flex-wrap: wrap; }
  .ftr p { margin: 0; max-width: 500px; color: var(--ink-2); font-size: 12px; line-height: 18px; }

  .h2 { font-family: Items, serif; font-weight: 500; font-size: 36px; line-height: 40px; letter-spacing: -0.36px; color: var(--ink); text-align: center; margin: 56px 0 32px; }

  .card3 { min-height: 240px; padding: 32px; text-align: left; border-radius: 40px; background: var(--glass); box-shadow: var(--glass-shadow); border: 1px solid rgba(255, 255, 255, .6); }

  .qr { display: inline-block; padding: 16px; border-radius: 16px; background: rgba(252, 252, 250, .6); box-shadow: var(--glass-shadow); }

  ul.bul { text-align: left; color: var(--ink); padding-left: 22px; margin: 8px 0 0; }

  .cookie button { height: 46px; border-radius: 10px; cursor: pointer; font-size: 14px; }
  .cookie .k1 { background: #1B1B1B; color: #fff; border: 1px solid #1B1B1B; }
  .cookie .k2 { background: transparent; color: #2b2b2b; border: 1px solid #675D6C; }

  @media (max-width: 700px) {

    .logo { font-size: 28px; }
    .hdr { margin: 0 0 8px; padding: 16px 0; }

    .quotes { padding: 16px 20px 0; }
    .hero { height: 480px; }
    .hero h1 { font-size: 40px; line-height: 44px; }
    .ftr { gap: 24px; }
    .cookie { flex-direction: column; align-items: stretch; }
    .cookie .bb { width: auto; }
  }
</style>

        '<label class="chk' + (state.consent ? ' on' : '') + '" data-k="consent"><input type="checkbox" name="consent"' + (state.consent ? ' checked' : '') + '><span class="box">' + ICON.check + '</span><span>I agree to Pomelo Care\'s <a href="https://www.pomelocare.com/terms-of-service" target="_blank" rel="noopener">Terms of Service</a>, <a href="https://www.pomelocare.com/privacy-policy" target="_blank" rel="noopener">Privacy Policy</a>, and <a href="https://www.pomelocare.com/notice-of-privacy-practices" target="_blank" rel="noopener">Notice of Privacy Practices</a>.</span></label>' +
        '<label class="chk' + (state.loop ? ' on' : '') + '" data-k="loop"><input type="checkbox" name="consentedToAdPlatformEmailSharing"' + (state.loop ? ' checked' : '') + '><span class="box">' + ICON.check + '</span><span>Yes, keep me in the loop**</span></label><div id="e"></div>' +
        '<div class="mt32">' + btn('Next') + '</div><p class="fine mt24" style="text-align:left">** By checking this box, I allow Pomelo to email me about products, services, and health topics, and to share my email address with the ad and social media platforms it uses so I can be presented with content that\'s relevant to me, and for advertising and marketing purposes.</p></form></main>',
        bind: function () {
          app.querySelectorAll('.chk').forEach(function (el) {
            el.addEventListener('click', function (e) { if (e.target.closest('a')) return; e.preventDefault(); var k = el.getAttribute('data-k'); state[k] = !state[k]; save(); el.classList.toggle('on', state[k]); });
          });
          app.querySelector('#f').addEventListener('submit', function (e) {
            e.preventDefault();
            var email = app.querySelector('#email').value.trim();
            var msg = !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email) ? 'Please enter a valid email address.' : !state.consent ? 'Please agree to the Terms of Service, Privacy Policy, and Notice of Privacy Practices.' : '';
            app.querySelector('#e').innerHTML = msg ? '<div class="err" style="margin:0 0 8px">' + msg + '</div>' : '';
            if (msg) return;
            state.email = email; save(); go('/signup/perimenopause/create-account');
          });
        } };
    },
    'perimenopause/check-coverage-state': function () {
      return { html: hdrLeft(false) + '<main><form class="col" id="f" style="padding-top:12px"><h1>Let\u2019s check if you\u2019re covered</h1><p class="sub">Pomelo is in-network with many major insurers. Start by telling us where you live.</p>' + selectField('state', 'State', STATES, state.state) + '<div id="e"></div>' +
        '<div class="sponsor">Is your employer paying for Pomelo Care?<br><a href="https://app.pomelocare.com/sponsored" target="_blank" rel="noopener">Activate a sponsored membership</a></div>' + btn('Next') + '</form></main>',
        bind: function () {
          bindSelect('state', function (v) { state.state = v; state.insurer = null; save(); render(); });
          app.querySelector('#f').addEventListener('submit', function (e) {
            e.preventDefault();
            if (!state.state) { app.querySelector('#e').innerHTML = '<div class="err" style="margin:-16px 0 16px">Please select your state.</div>'; return; }
            go('/signup/perimenopause/check-coverage-insurance');
          });
        } };
    },
    'perimenopause/check-coverage-insurance': function () {
      if (!state.state) { go('/signup/perimenopause/check-coverage-state'); return null; }
      var list = state.state === 'TX' ? TX_INSURERS : NATIONAL_INSURERS;
      return { html: hdrLeft(true) + '<main><form class="col" id="f"><h1>Who\u2019s your insurance provider?</h1><p class="sub">We\'ll check if Pomelo is in-network with your plan.</p>' + selectField('insurer', 'Insurance provider', list, state.insurer) + '<div id="e"></div><div class="mt32" style="margin-top:8px">' + btn('Next') + '</div></form></main>',
        bind: function () {
          bindSelect('insurer', function (v) { state.insurer = v; save(); render(); });
          var form = app.querySelector('#f');
          form.addEventListener('submit', async function (e) {
            e.preventDefault();
            var box = app.querySelector('#e');
            if (!state.insurer) { box.innerHTML = '<div class="err" style="margin:-16px 0 16px">Please select your insurance provider.</div>'; return; }
            var picked = list.filter(function (o) { return o[0] === state.insurer; })[0];
            if (state.insurer === 'other') { state.coverage = { covered: false, insurer: { name: 'your insurance provider' } }; save(); go('/signup/perimenopause/check-coverage-not-covered'); return; }
            var b = app.querySelector('#next'); b.disabled = true; b.innerHTML = '<span class="spin" role="progressbar" aria-label="Checking coverage"></span>';
            box.innerHTML = '';
            try {
              var res = await fetch('/api/b4fb2968/coverage', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(Object.assign({ state: state.state, insurer: state.insurer, reason: 'perimenopause' }, devinIdentity())),
              });
              var data = await res.json().catch(function () { return {}; });
              if (!res.ok || data.success === false) throw new Error(data.error || 'Coverage check failed');
              state.coverage = { covered: !!data.covered, insurer: { name: (data.insurer && data.insurer.name) || picked[1] }, estimatedCostCents: data.estimatedCostCents };
              save();
              go(data.covered ? '/signup/perimenopause/check-coverage-covered' : '/signup/perimenopause/check-coverage-not-covered');
            } catch (err) {
              box.innerHTML = '<div class="alert" role="alert">' + ICON.warn + '<div><b>Something went wrong</b>We weren\u2019t able to check your coverage. Please try again.</div></div>';
              b.disabled = false; b.textContent = 'Next';
            }
          });
        } };
    },
    'perimenopause/check-coverage-covered': function () {
      var c = state.coverage || { insurer: { name: 'Aetna' }, estimatedCostCents: 2500 };
      var amt = '$' + Math.round((c.estimatedCostCents || 2500) / 100);
      return { html: hdrLeft(false) + '<main><div class="col"><img src="' + ASSET + 'covered.png" alt="" width="200" height="190" style="display:block;margin:24px auto 32px;object-fit:contain"><h1 style="margin-bottom:24px">Good news!</h1><p class="sub ink" style="font-size:17px;line-height:30px">Pomelo visits are in-network with ' + esc(c.insurer.name) + '. If you\u2019re on an HMO plan, we\u2019ll handle the referral process for you.</p>' +
        '<div class="cost"><div><b>Your cost*</b><small>Most ' + esc(c.insurer.name) + ' patients pay this for a standard visit</small></div><div class="amt">' + amt + '</div></div>' + btn('Next') +
        '<p class="fine mt32">*The cost provided is an estimate. You can confirm your final cost prior to your visit</p><p class="note">Is your employer paying for Pomelo Care? <a class="u" href="https://app.pomelocare.com/sponsored" target="_blank" rel="noopener">Activate a sponsored membership</a></p></div></main>',
        bind: function () { app.querySelector('#next').addEventListener('click', function () { go('/signup/perimenopause/coverage-verified'); }); } };
    },
    'perimenopause/check-coverage-not-covered': function () {
      var c = state.coverage || { insurer: { name: 'your insurance provider' } };
      return { html: hdrLeft(true) + '<main><div class="col"><img src="' + ASSET + 'exploring.png" alt="" width="160" height="155" style="display:block;margin:16px auto 24px"><h1>We\u2019re not in-network with ' + esc(c.insurer.name) + ' yet</h1><p class="sub">Join the waitlist and we\u2019ll let you know as soon as Pomelo is covered by your plan.</p>' + btn('Join the waitlist') +
        '<p class="note mt24">Is your employer paying for Pomelo Care? <a class="u" href="https://app.pomelocare.com/sponsored" target="_blank" rel="noopener">Activate a sponsored membership</a></p></div></main>',
        bind: function () { app.querySelector('#next').addEventListener('click', function () { go('/signup/perimenopause/waitlist-confirmation'); }); } };
    },
    'perimenopause/waitlist-confirmation': function () {
      return { html: hdrLeft(false) + '<main><div class="col"><img src="' + ASSET + 'covered.png" alt="" width="200" height="190" style="display:block;margin:24px auto 32px;object-fit:contain"><h1>You\u2019re on the list!</h1><p class="sub">We\u2019ll email ' + esc(state.email || 'you') + ' as soon as Pomelo is in-network with your plan.</p></div></main>' };
    },
    'perimenopause/create-account': function () {
      var d = state.details || {};
      var F = [['firstName', 'First name', 'given-name', 'text'], ['lastName', 'Last name', 'family-name', 'text'], ['dob', 'Date of birth (mm/dd/yyyy)', 'bday', 'text', 'mm/dd/yyyy', 'Date of birth'], ['zip', 'Zip code', 'postal-code', 'text', '', 'Zip code'], ['phone', 'Phone number', 'tel', 'tel']];
      return { html: hdrMid(MIDLIFE_PROGRESS['create-account']) + '<main><form class="col" id="f" novalidate><h1 style="margin-bottom:8px">A few more details</h1><p class="sub">This helps us personalize your experience.</p>' +
        F.map(function (f) { return '<div class="field" data-f="' + f[0] + '"><label for="' + f[0] + '">' + f[1] + '</label><input class="inp" id="' + f[0] + '" type="' + f[3] + '" autocomplete="' + f[2] + '"' + (f[0] === 'dob' || f[0] === 'zip' || f[0] === 'phone' ? ' inputmode="numeric"' : '') + ' value="' + esc(d[f[0]] || '') + '">' + (f[4] ? '<p class="help">' + f[4] + '</p>' : '') + '</div>'; }).join('') +
        '<label class="chk' + (state.sms ? ' on' : '') + '" data-k="sms"><input type="checkbox" name="sms"' + (state.sms ? ' checked' : '') + '><span class="box">' + ICON.check + '</span><span>I agree to also receive marketing text messages from Pomelo Care at the number provided.*</span></label>' +
        '<div class="mt32">' + btn('Next') + '</div><p class="fine mt24" style="text-align:left;font-size:14px;line-height:17px">* Message frequency varies. Standard message &amp; data rates may apply. Consent is not required to receive healthcare services. I can reply STOP to opt out or HELP for assistance at any time.</p></form></main>',
        bind: function () {
          var chk = app.querySelector('.chk');
          chk.addEventListener('click', function (e) { e.preventDefault(); state.sms = !state.sms; save(); chk.classList.toggle('on', state.sms); });
          app.querySelector('#f').addEventListener('submit', function (e) {
            e.preventDefault();
            var ok = true; var vals = {};
            F.forEach(function (f) {
              var box = app.querySelector('[data-f="' + f[0] + '"]'); var v = box.querySelector('input').value.trim(); vals[f[0]] = v;
              var old = box.querySelector('.help.bad'); if (old) old.remove();
              var bad = !v;
              box.classList.toggle('bad', bad);
              if (bad) { ok = false; box.insertAdjacentHTML('beforeend', '<p class="help bad">' + (f[5] || f[1]) + ' is required</p>'); }
            });
            if (!ok) return;
            state.details = vals; save(); go('/signup/perimenopause/check-coverage-state');
          });
        } };
    },
    'perimenopause/coverage-verified': function () {
      return { html: hdrLeft(false) + '<main><div class="col"><img src="' + ASSET + 'covered.png" alt="" width="200" height="190" style="display:block;margin:24px auto 32px;object-fit:contain"><h1>You\u2019re all set!</h1><p class="sub">Welcome to Pomelo. Your care team will reach out shortly to schedule your first visit.</p></div></main>' };
    },
  };

  function bindMulti(key, items, onNext) {
    state[key] = state[key] || [];
    app.querySelectorAll('.opt').forEach(function (el) {
      el.addEventListener('click', function (e) {
        e.preventDefault();
        var label = items[+el.getAttribute('data-i')];
        var i = state[key].indexOf(label);
        if (i === -1) state[key].push(label); else state[key].splice(i, 1);
        state[key] = items.filter(function (it) { return state[key].indexOf(it) !== -1; });
        save(); el.classList.toggle('on', i === -1);
        if (state[key].length) app.querySelector('#e').innerHTML = '';
      });
    });
    app.querySelector('#f').addEventListener('submit', function (e) {
      e.preventDefault();
      if (!state[key].length) { app.querySelector('#e').innerHTML = '<div class="err" style="margin:-16px 0 16px">Please select at least one option.</div>'; return; }
      onNext();
    });
  }

  function render() {
    var path = (location.hash || '').replace(/^#\/?/, '').replace(/^signup\/?/, '') || 'reason-for-care';
    var view = VIEWS[path];
    if (!view) { go('/signup/reason-for-care'); return; }
    var v = view();
    if (!v) return;
    if (path !== 'reason-for-care') document.title = 'Pomelo Care | Virtual Care for Women and Children';
    app.innerHTML = '<div class="page' + (v.full ? ' full' : '') + '">' + v.html + '</div>';
    app.querySelectorAll('[data-back]').forEach(function (b) { b.addEventListener('click', back); });
    if (v.bind) v.bind();
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', render);
  if (!location.hash) history.replaceState(null, '', '#/signup/reason-for-care');
  render();

  if (!localStorage.getItem('pomeloDemoCookies')) {
    var ck = document.createElement('div');
    ck.className = 'cookie'; ck.setAttribute('role', 'dialog'); ck.setAttribute('aria-label', 'Cookie Consent Banner');
    ck.innerHTML = '<p>We use cookies and similar technologies for analytics and advertising. Third-party data sharing excludes health information. By using our site, you agree to our <a href="https://www.pomelocare.com/privacy-policy" target="_blank" rel="noopener">Privacy Policy</a></p><div class="bb"><button class="k1" type="button">I Understand</button><button class="k2" type="button">Manage Preferences</button></div>';
    document.body.appendChild(ck);
    ck.querySelectorAll('button').forEach(function (b) { b.addEventListener('click', function () { localStorage.setItem('pomeloDemoCookies', '1'); ck.remove(); }); });
  }
})();
</script>
<script src="/session-cap-banner.js"></script>
</body>
</html>
