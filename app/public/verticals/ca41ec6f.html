<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Doctolib — Dermatologue à Paris (démo)</title>
<style>
:root { --blue:#107aca; --navy:#0b2c56; --ink:#16263c; --muted:#5d6b82; --line:#dfe5ee; --bg:#f4f6f9; --green:#0f8a5f; --amber:#e7a10f; --red:#d33d3d; }
* { box-sizing:border-box; }
body { margin:0; font:15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color:var(--ink); background:var(--bg); }
button { font:inherit; cursor:pointer; }
.mock { background:#fff6d8; color:#6b5200; font-size:12px; text-align:center; padding:4px; }
header.dl { background:var(--blue); color:#fff; }
.dl-top { max-width:1080px; margin:0 auto; display:flex; align-items:center; gap:24px; padding:14px 20px; }
.logo { font-weight:800; font-size:24px; letter-spacing:-.5px; }
.dl-top nav { margin-left:auto; display:flex; gap:18px; font-size:14px; }
.dl-top nav a { color:#fff; text-decoration:none; opacity:.9; }
.search { max-width:1080px; margin:0 auto; padding:0 20px 18px; display:flex; gap:8px; }
.search .field { flex:1; background:#fff; color:var(--ink); border-radius:6px; padding:10px 14px; display:flex; flex-direction:column; }
.search .field small { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.4px; }
.search button { background:var(--navy); color:#fff; border:0; border-radius:6px; padding:0 22px; font-weight:600; }
main { max-width:1080px; margin:0 auto; padding:18px 20px 80px; }
h1 { font-size:20px; margin:4px 0 2px; }
.sub { color:var(--muted); margin:0 0 14px; font-size:14px; }
.card { background:#fff; border:1px solid var(--line); border-radius:8px; padding:16px; margin-bottom:12px; display:grid; grid-template-columns:64px 1fr 360px; gap:16px; }
.avatar { width:64px; height:64px; border-radius:50%; background:#d9e8f6; color:var(--blue); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:20px; }
.card h2 { font-size:16px; margin:0; color:var(--blue); }
.meta { color:var(--muted); font-size:13px; }
.badge { display:inline-block; font-size:11px; background:#e8f4ec; color:var(--green); border-radius:4px; padding:1px 6px; margin-top:6px; }
.slots small { display:block; color:var(--muted); font-size:12px; margin-bottom:6px; }
.slot { border:0; background:#d9edfb; color:var(--navy); font-weight:600; border-radius:4px; padding:6px 10px; margin:0 6px 6px 0; }
.slot:hover { background:var(--blue); color:#fff; }
.skeleton { height:30px; border-radius:4px; background:linear-gradient(90deg,#eef2f7,#f8fafc,#eef2f7); background-size:200% 100%; animation:sh 1.1s infinite; }
@keyframes sh { to { background-position:-200% 0; } }
.none { color:var(--muted); font-size:13px; }
.perf { position:fixed; bottom:0; left:0; right:0; background:var(--navy); color:#fff; font-size:13px; padding:8px 20px; display:flex; gap:20px; align-items:center; }
.perf b { color:#ffd76a; }
.perf a { color:#cfe4ff; margin-left:auto; }
.modal { position:fixed; inset:0; background:rgba(11,44,86,.45); display:flex; align-items:center; justify-content:center; }
.modal > div { background:#fff; border-radius:10px; padding:22px; width:380px; }
.modal h3 { margin:0 0 8px; }
.primary { background:var(--blue); color:#fff; border:0; border-radius:6px; padding:10px 16px; font-weight:600; }
.ghost { background:none; border:1px solid var(--line); border-radius:6px; padding:10px 16px; }
.ref { font-family:ui-monospace, Menlo, monospace; font-size:18px; color:var(--green); }
/* Presenter control (?ops=1 or Alt+.): starts the load replay; the monitor itself is not shown */
.ops { display:none; position:fixed; right:16px; bottom:52px; width:380px; background:#0d1117; color:#c9d1d9; font:12px/1.5 ui-monospace, Menlo, monospace; border-radius:8px; padding:12px 14px; box-shadow:0 10px 30px rgba(0,0,0,.35); z-index:50; }
.ops-on .ops { display:block; }
.ops button { font:inherit; background:#238636; color:#fff; border:0; border-radius:6px; padding:6px 12px; margin:8px 0; }
.ops button[disabled] { opacity:.5; cursor:default; }
.ops .warn { color:#e3b341; font-weight:700; }
.ops ul { list-style:none; margin:6px 0 0; padding:0; max-height:160px; overflow:auto; color:#8b949e; }
@media (max-width:820px) { .card { grid-template-columns:48px 1fr; } .card .slots { grid-column:1 / -1; } }
/* /doctolib-ios: the Doctolib iOS app inside an iPhone frame; reports as source doctolib/ios */
body.ios { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:28px; background:radial-gradient(circle at 50% 30%, #1d3a63, #0b1626 70%); }
.device { width:390px; height:844px; max-height:calc(100vh - 56px); background:#0a0a0c; border-radius:54px; padding:12px; box-shadow:0 0 0 2px #2a2f3a, 0 40px 80px rgba(0,0,0,.6); flex:none; }
.app { position:relative; height:100%; border-radius:42px; overflow:hidden; background:var(--bg); display:flex; flex-direction:column; transform:translateZ(0); }
.statusbar { flex:none; height:50px; padding:16px 30px 0; display:flex; justify-content:space-between; font-weight:600; font-size:15px; background:var(--blue); color:#fff; }
.island { position:absolute; top:11px; left:50%; width:120px; height:34px; margin-left:-60px; border-radius:20px; background:#000; z-index:5; }
.screen { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; }
.homebar { position:absolute; bottom:8px; left:50%; width:134px; height:5px; margin-left:-67px; border-radius:3px; background:#16263c; opacity:.8; z-index:5; }
.ios .mock { font-size:10px; }
.ios .dl-top { padding:8px 16px; }
.ios .dl-top nav { display:none; }
.ios .search { padding:0 16px 14px; flex-direction:column; }
.ios .search button { padding:10px; }
.ios main { padding:14px 12px 96px; }
.ios .card { grid-template-columns:48px 1fr; gap:10px; padding:12px; }
.ios .avatar { width:48px; height:48px; font-size:16px; }
.ios .card .slots { grid-column:1 / -1; }
.ios .perf { flex-wrap:wrap; gap:4px 12px; padding:8px 16px 22px; font-size:12px; }
.ios .modal > div { width:320px; }
@media (max-width:430px), (max-height:760px) { body.ios { padding:0; } .device { width:100%; height:100vh; max-height:none; border-radius:0; padding:0; box-shadow:none; } .app { border-radius:0; } .island, .homebar { display:none; } }
</style>
</head>
<body>
<div class="dl-view">
  <div class="mock">Démo synthétique — ce n'est pas Doctolib, aucune donnée patient réelle.</div>
  <header class="dl">
    <div class="dl-top"><span class="logo">Doctolib</span><nav><a href="#">Vous êtes soignant ?</a><a href="#">Centre d'aide</a></nav></div>
    <form class="search" id="search-form">
      <label class="field"><small>Spécialité</small><span>Dermatologue</span></label>
      <label class="field"><small>Où ?</small><span>Paris</span></label>
      <button type="submit">Rechercher</button>
    </form>
  </header>
  <main>
    <h1>Dermatologue à Paris</h1>
    <p class="sub" id="count">Recherche en cours…</p>
    <div id="results"></div>
  </main>
  <div class="perf"><span id="perf-calls">— appels API</span><span>Disponibilités affichées en <b id="perf-ms">—</b></span><span id="perf-load">Trafic normal</span></div>
</div>

<div class="ops" id="ops">
  <div>presenter · alt+. to hide · <span id="rep-mode"></span></div>
  <button type="button" id="rush">Replay Monday 08:00 rush</button>
  <div>availability p95 <b id="t-p95">—</b> · warn 800 ms · timeout 3000 ms · <span id="mon-status">OK</span></div>
  <ul id="events"></ul>
</div>

<script>
(function () {
  'use strict';
  var params = new URLSearchParams(location.search);
  var IOS = /^\/doctolib-ios\/?$/.test(location.pathname) || params.get('device') === 'ios';
  var REPORT_PATH = IOS ? '/api/doctolib/ios/latency' : '/api/ca41ec6f/monitor/alert';
  var REPORTS_ON = params.get('reports') !== 'off';
  var IOS_APP = { appVersion: '26.11.0', device: 'iPhone 16 Pro', osVersion: 'iOS 26.1' };
  var WARN_MS = 800, WINDOW = 200, RUSH_SECONDS = 40, TICK_MS = 500;
  var NAMES = ['Claire Dubois','Hugo Moreau','Camille Laurent','Thomas Bernard','Léa Petit','Antoine Robert','Manon Richard','Julien Durand','Sarah Lefèvre','Nicolas Simon','Inès Michel','Maxime Garcia','Chloé David','Lucas Bertrand','Emma Roux','Paul Vincent','Juliette Fournier','Louis Girard','Alice Bonnet','Victor Lambert'];
  var STREETS = ['rue de Rivoli','boulevard Haussmann','rue du Faubourg Saint-Antoine','avenue de la République','rue de Vaugirard','rue Oberkampf','boulevard Saint-Germain','rue de la Convention','avenue des Ternes','rue Lafayette'];
  var practitioners = NAMES.map(function (n, i) {
    return { id: i + 1, name: 'Dr ' + n, address: (12 + i * 7) + ' ' + STREETS[i % STREETS.length] + ', 750' + String(1 + (i * 3) % 20).padStart(2, '0') + ' Paris', sector: i % 3 === 0 ? 'Secteur 2' : 'Conventionné secteur 1', fullyBooked: n === 'Hugo Moreau' };
  });
  var $ = function (id) { return document.getElementById(id); };
  var traffic = 0.08, rushing = false, rushStart = 0, samples = [], alerted = false, generation = 0, lastAllSlotsMs = 0;

  // Synthetic latency of one availability call: a sequential scan whose cost grows with concurrent load.
  function callLatency() {
    var base = 60 + 1500 * Math.pow(traffic, 1.7);
    return Math.max(20, base * (0.7 + Math.random() * 0.6));
  }
  function pct(arr, p) { if (!arr.length) return 0; var s = arr.slice().sort(function (a, b) { return a - b; }); return s[Math.min(s.length - 1, Math.floor(p * s.length))]; }
  function slotsFor(p) {
    if (p.fullyBooked) return [];
    var d = new Date(); d.setDate(d.getDate() + 1 + (p.id % 3)); while (d.getDay() === 0 || d.getDay() === 6) d.setDate(d.getDate() + 1);
    var label = d.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' });
    return [9, 10.5, 14].map(function (h, i) { var m = (p.id * 15 + i * 30) % 60; return label + ' ' + String(Math.floor(h + i)).padStart(2, '0') + ':' + String(m - m % 15).padStart(2, '0'); });
  }
  function initials(name) { return name.replace('Dr ', '').split(' ').map(function (w) { return w[0]; }).join(''); }

  function renderResults() {
    var gen = ++generation, started = performance.now(), calls = 1, done = 0;
    $('count').textContent = practitioners.length + ' résultats · prochaines disponibilités';
    $('results').innerHTML = practitioners.map(function (p) {
      return '<div class="card"><div class="avatar">' + initials(p.name) + '</div><div><h2>' + p.name + '</h2><div class="meta">Dermatologue · ' + p.address + '</div><span class="badge">' + p.sector + '</span></div>' +
        '<div class="slots" id="slots-' + p.id + '"><small>Prochaine disponibilité</small><div class="skeleton"></div></div></div>';
    }).join('');
    $('perf-ms').textContent = '…';
    // Baseline client: one availability request per card, six at a time (browser connection limit).
    var queue = practitioners.slice(), inflight = 0;
    function next() {
      while (inflight < 6 && queue.length) {
        (function (p) {
          inflight++; calls++;
          var ms = callLatency();
          recordSample(ms);
          setTimeout(function () {
            inflight--; done++;
            if (gen !== generation) return;
            var slots = slotsFor(p);
            $('slots-' + p.id).innerHTML = '<small>Prochaine disponibilité</small>' + (slots.length
              ? slots.map(function (s) { return '<button type="button" class="slot" data-p="' + p.id + '" data-s="' + s + '">' + s + '</button>'; }).join('')
              : '<div class="none">Aucune disponibilité dans les 14 prochains jours</div>');
            $('perf-calls').textContent = calls + ' appels API';
            if (done === practitioners.length) { lastAllSlotsMs = Math.round(performance.now() - started); $('perf-ms').textContent = lastAllSlotsMs + ' ms'; }
            next();
          }, ms);
        })(queue.shift());
      }
    }
    next();
  }

  function recordSample(ms) { samples.push(ms); if (samples.length > WINDOW) samples.shift(); }

  function tick() {
    if (rushing) {
      var t = (Date.now() - rushStart) / 1000;
      traffic = Math.min(0.95, 0.08 + 0.87 * Math.min(1, t / RUSH_SECONDS));
      if (t > RUSH_SECONDS + 25) rushing = false;
    } else {
      traffic = Math.max(0.08, traffic - 0.02);
    }
    for (var i = 0; i < 12; i++) recordSample(callLatency());
    var p50 = pct(samples, 0.5), p95 = pct(samples, 0.95);
    $('t-p95').textContent = Math.round(p95) + ' ms';
    $('perf-load').textContent = traffic > 0.5 ? 'Heure de pointe (lundi 8h)' : 'Trafic normal';
    var warn = p95 > WARN_MS;
    $('mon-status').textContent = warn ? 'WARN' : 'OK';
    $('mon-status').className = warn ? 'warn' : '';
    if (warn && !alerted) raiseWarning(p50, p95);
    if (!warn) alerted = false;
    if (!rushing && !warn && traffic <= 0.08) $('rush').disabled = false;
  }

  function event(text) { var li = document.createElement('li'); li.textContent = new Date().toLocaleTimeString('en-GB') + ' · ' + text; $('events').prepend(li); }

  function raiseWarning(p50, p95) {
    alerted = true;
    event('Monitor transitioned OK → WARN (p95 ' + Math.round(p95) + ' ms > 800 ms)');
    if (!REPORTS_ON) { event('Alert suppressed (?reports=off): no Slack alert, no Devin session'); return; }
    fetch(REPORT_PATH, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(Object.assign(IOS ? Object.assign({ source: 'doctolib/ios', allSlotsMs: lastAllSlotsMs || undefined }, IOS_APP) : {}, {
        service: 'doctolib-search-api',
        p95Ms: Math.round(p95), p50Ms: Math.round(p50), samples: samples.length,
        callsPerPage: 21, queryP95Ms: Math.round(p95 * 0.92), rowsScanned: 602611,
        devinUserId: localStorage.getItem('devinUserId') || '',
        devinOrgId: localStorage.getItem('devinOrgId') || '',
        devinEmail: localStorage.getItem('devinEmail') || ''
      }))
    }).then(function (res) {
      if (res.status === 202) return res.json().then(function (ack) { event('Notified @devin · lead Devin session requested (ref ' + ack.reference + ')'); });
      if (res.status === 429) { event('Alert already sent recently · no new session'); return; }
      throw new Error('HTTP ' + res.status);
    }).catch(function (err) { alerted = false; event('Alert delivery failed (' + err.message + ')'); });
  }

  function toggleOps(on) { document.body.classList.toggle('ops-on', on); }
  document.addEventListener('keydown', function (e) { if (e.altKey && (e.code === 'Period' || e.key === '.')) toggleOps(!document.body.classList.contains('ops-on')); });
  $('rep-mode').textContent = (IOS ? 'iOS app · ' : '') + (REPORTS_ON ? 'alerts on' : 'alerts off (?reports=off)');
  if (IOS) {
    document.body.classList.add('ios');
    document.title = 'Doctolib iOS — Dermatologue à Paris (démo)';
    var view = document.querySelector('.dl-view');
    var device = document.createElement('div'); device.className = 'device';
    device.innerHTML = '<div class="app"><div class="island"></div><div class="statusbar"><span>9:41</span><span>5G ▮</span></div><div class="screen"></div><div class="homebar"></div></div>';
    document.body.insertBefore(device, view);
    device.querySelector('.screen').appendChild(view);
  }

  $('rush').addEventListener('click', function () {
    rushing = true; rushStart = Date.now(); this.disabled = true;
    event('Traffic replay started: Monday 08:00 rush (patients searching "Dermatologue · Paris")');
  });
  $('search-form').addEventListener('submit', function (e) { e.preventDefault(); renderResults(); });

  document.addEventListener('click', function (e) {
    var btn = e.target.closest('.slot'); if (!btn) return;
    var p = practitioners[Number(btn.dataset.p) - 1];
    var modal = document.createElement('div'); modal.className = 'modal';
    modal.innerHTML = '<div><h3>Confirmer le rendez-vous</h3><p>' + p.name + ' · Dermatologue<br>' + btn.dataset.s + '</p><p class="meta">Patient : M. Martin (fictif)</p><button class="primary" type="button" data-ok>Confirmer</button> <button class="ghost" type="button" data-x>Annuler</button></div>';
    document.body.appendChild(modal);
    modal.addEventListener('click', function (ev) {
      if (ev.target.hasAttribute('data-x') || ev.target === modal) modal.remove();
      if (ev.target.hasAttribute('data-ok')) {
        var ref = 'RDV-' + Math.random().toString(16).slice(2, 10).toUpperCase().padEnd(8, '0');
        modal.firstChild.innerHTML = '<h3>Rendez-vous confirmé</h3><p>' + p.name + ' · ' + btn.dataset.s + '</p><p class="ref">' + ref + '</p><button class="primary" type="button" data-x>Fermer</button>';
        btn.remove();
      }
    });
  });

  toggleOps(params.get('ops') === '1');
  renderResults();
  tick();
  setInterval(tick, TICK_MS);
  setInterval(function () { if (rushing) renderResults(); }, 8000);
})();
</script>
</body>
</html>
