  <style>

    .sidenav a .count.red { background: var(--v-red-bg); color: var(--v-red); }
    .sidenav .foot { margin-top: auto; padding: 14px 10px 4px; font-size: 11px; color: var(--v-faint); line-height: 1.6; border-top: 1px solid var(--v-line-2); }

    main { flex: 1; min-width: 0; padding: 18px 28px 48px; }

    .page-head { display: flex; align-items: flex-end; gap: 18px; margin: 10px 0 18px; }
    .page-head h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -.01em; }
    .page-head p { margin: 4px 0 0; color: var(--v-muted); font-size: 13px; max-width: 760px; }
    .page-head .actions { margin-left: auto; display: flex; gap: 10px; align-items: center; }

    .btn { font-weight: 600; font-size: 13px; border: 1px solid transparent; border-radius: 4px; padding: 8px 14px; cursor: pointer; transition: background .15s; }
    .btn.primary { background: var(--v-blue); color: #fff; }
    .btn.primary:hover { background: var(--v-blue-2); }
    .btn.secondary { background: #fff; color: var(--v-ink); border-color: var(--v-line); }
    .btn.secondary:hover { background: var(--v-bg); }
    .btn[disabled] { opacity: .6; cursor: wait; }
    select.ctl { font: 500 13px var(--v-font); color: var(--v-ink); background: #fff; border: 1px solid var(--v-line); border-radius: 4px; padding: 7px 10px; }

    .card { background: #fff; border: 1px solid var(--v-line); border-radius: 6px; }

    .grid.kpi { grid-template-columns: repeat(6, 1fr); }
    .grid.two { grid-template-columns: 1.3fr 1fr; }
    .grid.cards3 { grid-template-columns: repeat(3, 1fr); }
    .kpi .card { padding: 14px 16px; }
    .kpi .label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--v-muted); font-weight: 600; }
    .kpi .value { margin-top: 6px; font-size: 24px; font-weight: 600; letter-spacing: -.02em; display: flex; align-items: baseline; gap: 8px; }
    .kpi .value small { font-size: 12px; color: var(--v-muted); font-weight: 500; }
    .kpi .value.red { color: var(--v-red); }
    .kpi .value.green { color: var(--v-green); }

    table.data { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    table.data th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--v-muted); font-weight: 600; padding: 9px 12px; border-bottom: 1px solid var(--v-line); background: #FAFBFC; white-space: nowrap; }
    table.data td { padding: 9px 12px; border-bottom: 1px solid var(--v-line-2); vertical-align: top; }
    table.data tr:last-child td { border-bottom: 0; }
    table.data tr.click { cursor: pointer; }
    table.data tr.click:hover td { background: #F6F9FD; }
    table.data td.num, table.data th.num { text-align: right; font-variant-numeric: tabular-nums; }
    .mono { font-family: var(--v-mono); font-size: 12px; }
    .muted { color: var(--v-muted); }
    .faint { color: var(--v-faint); }
    .chip { display: inline-block; font-size: 11px; font-weight: 500; padding: 2px 7px; border-radius: 3px; background: var(--v-line-2); color: var(--v-ink); margin: 1px 3px 1px 0; white-space: nowrap; }
    .chip.blue { background: #E8F0FB; color: var(--v-blue); }
    .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
    .pill::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .pill.green { background: var(--v-green-bg); color: var(--v-green); }
    .pill.amber { background: var(--v-amber-bg); color: var(--v-amber); }
    .pill.red { background: var(--v-red-bg); color: var(--v-red); }
    .pill.gray { background: var(--v-line-2); color: var(--v-muted); }
    .pill.blue { background: #E8F0FB; color: var(--v-blue); }

    .ops { border-collapse: separate; border-spacing: 6px; width: 100%; }
    .ops th { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--v-muted); font-weight: 600; padding: 4px 8px; text-align: left; }
    .ops th.c { text-align: center; }
    .ops td.agent { font-weight: 600; font-size: 12.5px; white-space: nowrap; padding: 0 8px; }
    .ops td.agent small { display: block; font-weight: 400; color: var(--v-muted); font-size: 11px; }
    .cell { border-radius: 5px; padding: 10px 12px; min-width: 150px; border: 1px solid transparent; }
    .cell .st { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; display: flex; align-items: center; gap: 6px; }
    .cell .st::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
    .cell .m { margin-top: 6px; display: flex; gap: 12px; font-size: 11px; color: var(--v-muted); white-space: nowrap; }
    .cell .m b { display: block; font-size: 12.5px; color: var(--v-ink); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
    .cell.green { background: var(--v-green-bg); border-color: #CBE8D3; } .cell.green .st { color: var(--v-green); }
    .cell.yellow { background: var(--v-amber-bg); border-color: #F0DFA6; } .cell.yellow .st { color: var(--v-amber); }
    .cell.red { background: var(--v-red-bg); border-color: #F4C2BF; cursor: pointer; } .cell.red .st { color: var(--v-red); }
    .cell.na { background: #FAFBFC; border: 1px dashed var(--v-line); color: var(--v-faint); font-size: 11px; text-align: center; padding: 18px 12px; }
    .cell .err { margin-top: 6px; font: 11px var(--v-mono); color: var(--v-red); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
    .legend { display: flex; gap: 16px; font-size: 11px; color: var(--v-muted); margin-top: 10px; }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

    .drawer { position: fixed; top: 56px; right: 0; bottom: 0; width: 520px; background: #fff; border-left: 1px solid var(--v-line); box-shadow: -12px 0 40px rgba(11,31,58,.12); transform: translateX(105%); transition: transform .28s cubic-bezier(.2,.8,.2,1); z-index: 25; display: flex; flex-direction: column; }
    .drawer.open { transform: translateX(0); }
    .drawer .hd { padding: 16px 20px; border-bottom: 1px solid var(--v-line-2); display: flex; align-items: flex-start; gap: 12px; }
    .drawer .hd h3 { margin: 0; font-size: 15px; font-weight: 600; }
    .drawer .hd .x { margin-left: auto; border: 0; background: transparent; font-size: 18px; color: var(--v-muted); cursor: pointer; line-height: 1; }
    .drawer .bd { padding: 16px 20px; overflow: auto; }
    pre.yaml { margin: 0; background: #0F1C2E; color: #D7E1EE; border-radius: 6px; padding: 14px 16px; font: 12px/1.6 var(--v-mono); overflow: auto; }
    pre.yaml .k { color: #7FB4FF; } pre.yaml .s { color: #B6E39A; } pre.yaml .c { color: #6B7A90; }
    dl.facts { display: grid; grid-template-columns: 150px 1fr; gap: 8px 14px; margin: 0; font-size: 12.5px; }
    dl.facts dt { color: var(--v-muted); } dl.facts dd { margin: 0; }

    .app-bar { display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: #fff; border: 1px solid var(--v-line); border-radius: 6px; margin-bottom: 14px; }
    .app-bar .lbl { font-size: 12px; color: var(--v-muted); font-weight: 500; }
    .app-bar .meta { margin-left: auto; font-size: 12px; color: var(--v-muted); }
    .report-empty { padding: 28px 16px; text-align: center; color: var(--v-muted); font-size: 12.5px; }
    .report-summary { padding: 14px 16px; background: #F7F9FC; border-bottom: 1px solid var(--v-line-2); font-size: 13px; line-height: 1.55; }
    .report-error { margin: 14px 16px; padding: 14px 16px; border: 1px solid #F4C2BF; background: var(--v-red-bg); border-radius: 6px; display: flex; gap: 12px; }
    .report-error svg { width: 20px; height: 20px; flex: none; fill: none; stroke: var(--v-red); stroke-width: 2; }
    .report-error b { display: block; color: var(--v-red); margin-bottom: 3px; font-size: 13px; }
    .report-error .ref { font-family: var(--v-mono); font-size: 11.5px; color: var(--v-muted); margin-top: 6px; }
    .alerts li { padding: 8px 0; border-bottom: 1px solid var(--v-line-2); font-size: 12.5px; display: flex; gap: 10px; }
    .alerts li:last-child { border-bottom: 0; }
    .alerts { list-style: none; margin: 0; padding: 0 16px; }

    .timeline { list-style: none; margin: 0; padding: 0 0 0 14px; border-left: 2px solid var(--v-line); }
    .timeline li { position: relative; padding: 0 0 14px 14px; font-size: 12.5px; }
    .timeline li::before { content: ''; position: absolute; left: -19px; top: 4px; width: 8px; height: 8px; border-radius: 50%; background: var(--v-blue); border: 2px solid #fff; box-shadow: 0 0 0 1px var(--v-blue); }
    .timeline li .t { display: block; color: var(--v-muted); font-size: 11px; font-family: var(--v-mono); }
    .guard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .guard .g { padding: 12px 14px; border: 1px solid var(--v-line); border-radius: 6px; background: #fff; font-size: 12.5px; display: flex; gap: 10px; }
    .guard .g svg { width: 18px; height: 18px; flex: none; fill: none; stroke: var(--v-blue); stroke-width: 1.8; }
    .guard .g b { display: block; margin-bottom: 2px; }
    .pending { color: var(--v-faint); font-style: italic; }
    .link-row a { display: inline-flex; align-items: center; gap: 6px; }
    .changed { background: var(--v-amber-bg); }
    .badge-new { font-size: 10px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; padding: 2px 6px; border-radius: 3px; background: var(--v-amber-bg); color: var(--v-amber); }

    .toasts { position: fixed; right: 22px; bottom: 22px; z-index: 50; display: flex; flex-direction: column; gap: 10px; }
    .toast { min-width: 340px; max-width: 460px; display: flex; gap: 10px; padding: 12px 14px 12px 11px; border-radius: 8px; background: rgba(0,0,0,.85); color: #fff; box-shadow: 0 12px 32px rgba(0,0,0,.25); transform: translateX(120%); opacity: 0; transition: transform .35s cubic-bezier(.2,.8,.2,1), opacity .35s; font-size: 13px; }
    .toast.in { transform: translateX(0); opacity: 1; }
    .toast .bar { width: 4px; flex: none; border-radius: 3px; background: #3DBA63; }
    .toast.error .bar { background: #FF5A52; }
    .toast b { display: block; margin-bottom: 3px; }
    .toast .msg { color: rgba(255,255,255,.82); line-height: 1.45; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="toasts" id="toasts"></div>

  <script>
    (function () {
      var API = '/api/af1dce4f';
      var state = { overview: null, viewAs: 'AIR-A', report: null, reportError: null, running: false, route: { page: 'home', id: null } };

      function esc(value) {
        return String(value == null ? '' : value).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }
      function num(value) { return Number(value || 0).toLocaleString('en-US'); }
      function dateShort(value) { return value ? new Date(value).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) : '—'; }
      function dateTime(value) { return value ? new Date(value).toLocaleString('en-GB', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }) + ' UTC' : '—'; }
      function ago(value) {
        var mins = Math.round((Date.now() - new Date(value).getTime()) / 60000);
        if (mins < 1) return 'just now';
        if (mins < 60) return mins + 'm ago';
        var hrs = Math.round(mins / 60);
        return hrs < 48 ? hrs + 'h ago' : Math.round(hrs / 24) + 'd ago';
      }
      function customer(id) { return (state.overview.customers.filter(function (c) { return c.id === id; })[0]) || { id: id, name: id }; }
      function agent(id) { return (state.overview.agents.filter(function (a) { return a.id === id; })[0]) || { id: id, name: id }; }
      function product(id) { return (state.overview.dataProducts.filter(function (d) { return d.id === id; })[0]) || { id: id, name: id }; }

        var table = function (rows) { return '<table class="data"><thead><tr><th>Incident</th><th>Sev</th><th>Title</th><th>Customer</th><th>Agent</th><th>Status</th><th>Opened</th><th>Links</th></tr></thead><tbody>' + rows.map(row).join('') + '</tbody></table>'; };
        return crumbs([{ label: 'Incidents' }]) + head('Incidents', 'Every production incident on the workbench, with its RCA, pull request and Devin session as the audit trail.') +
          '<div class="card"><div class="hd"><h3>Open</h3><span class="sub">' + open.length + '</span></div>' + (open.length ? table(open) : '<div class="report-empty">No open incidents.</div>') + '</div>' +
          '<div class="card" style="margin-top:14px"><div class="hd"><h3>Resolved</h3><span class="sub">' + resolved.length + ' · last 30 days</span></div>' + table(resolved) + '</div>' +
          '<div style="margin-top:14px" class="guard">' +
          '<div class="g"><svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><div><b>Devin never changes prod directly</b>Every fix ships as a pull request that a human approves and the normal pipeline deploys.</div></div>' +
          '<div class="g"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg><div><b>Complete, linkable audit trail</b>Each incident keeps its RCA, PR, timeline and the full Devin session.</div></div>' +
          '<div class="g"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12h8"/></svg><div><b>Maintainer only</b>Devin appears in Incidents and Operations. Customer-facing agents run on Azure Foundry, not on Devin.</div></div>' +
          '</div>';
      }

      function pageIncident(o, id) {
        var i = o.incidents.filter(function (x) { return x.id === id; })[0];
        if (!i) return pageIncidents(o);
        var pending = '<span class="pending">Pending — Devin is investigating</span>';
        return crumbs([{ label: 'Incidents', href: '#/incidents' }, { label: i.id }]) + head(i.title, null, sevPill(i.severity) + statusPill(i.status)) +
          '<div class="grid two" style="grid-template-columns:1.5fr 1fr">' +
          '<div style="display:grid;gap:14px;align-content:start">' +
          '<div class="card"><div class="hd"><h3>Summary</h3></div><div class="bd"><dl class="facts"><dt>Incident</dt><dd class="mono">' + esc(i.id) + '</dd><dt>Customer</dt><dd>' + esc(customer(i.customerId).name) + '</dd><dt>Agent</dt><dd>' + esc(agent(i.agentId).name) + '</dd><dt>Opened</dt><dd>' + esc(dateTime(i.openedAt)) + '</dd><dt>Resolved</dt><dd>' + (i.resolvedAt ? esc(dateTime(i.resolvedAt)) : '<span class="pending">open</span>') + '</dd>' + (i.error ? '<dt>Error</dt><dd class="mono" style="color:var(--v-red)">' + esc(i.error) + '</dd>' : '') + '</dl></div></div>' +
          '<div class="card"><div class="hd"><h3>Root-cause analysis</h3><span class="sub">posted by Devin</span></div><div class="bd"><dl class="facts"><dt>What broke</dt><dd>' + (i.rca ? esc(i.rca) : pending) + '</dd><dt>Who is affected</dt><dd>' + esc(i.affected) + '</dd><dt>Root-cause change</dt><dd>' + (i.rootCause ? esc(i.rootCause) : pending) + '</dd><dt>Confidence</dt><dd>' + (i.confidence ? esc(i.confidence) : pending) + '</dd><dt>Recommended owner</dt><dd>' + (i.recommendedOwner ? esc(i.recommendedOwner) : pending) + '</dd><dt>Note for account team</dt><dd>' + (i.accountNote ? '<em>“' + esc(i.accountNote) + '”</em>' : pending) + '</dd></dl></div></div>' +
          '</div>' +
          '<div style="display:grid;gap:14px;align-content:start">' +
          '<div class="card"><div class="hd"><h3>Links</h3></div><div class="bd"><dl class="facts"><dt>RCA</dt><dd>' + (i.rca ? '<a href="#">RCA · ' + esc(i.id) + '</a>' : '<span class="pending">pending</span>') + '</dd><dt>Pull request</dt><dd>' + (i.pr ? '<a href="' + esc(i.pr.url) + '">' + esc(i.pr.label) + '</a>' : '<span class="pending">pending</span>') + '</dd><dt>Devin session</dt><dd>' + (i.session ? '<a href="' + esc(i.session.url) + '" target="_blank" rel="noopener">' + esc(i.session.label) + '</a>' : '<span class="pending">starting…</span>') + '</dd></dl></div></div>' +
          '<div class="card"><div class="hd"><h3>Timeline</h3></div><div class="bd"><ul class="timeline">' + i.timeline.map(function (t) { return '<li><span class="t">' + esc(dateTime(t.at)) + '</span>' + esc(t.event) + '</li>'; }).join('') + (i.status !== 'Resolved' ? '<li><span class="t">next</span><span class="pending">RCA posted → PR opened → human approval → deploy → resolved</span></li>' : '') + '</ul></div></div>' +
          '</div></div>';
      }

      function parseRoute() {
        var hash = (location.hash || '#/home').replace(/^#\/?/, '');
        var parts = hash.split('/');
        return { page: parts[0] || 'home', id: parts[1] || null };
      }

      function render() {
        var o = state.overview;
        if (!o) return;
        state.route = parseRoute();
        renderChrome();
        var main = document.getElementById('main');
        var r = state.route;
        if (r.page === 'agents') { main.innerHTML = pageAgents(o); if (r.id) showAgent(r.id); else closeDrawer(); }
        else if (r.page === 'apps' && r.id === 'fleet-health') { main.innerHTML = pageFleetHealth(o); closeDrawer(); bindFleetHealth(); }
        else if (r.page === 'apps') { main.innerHTML = pageApps(o); closeDrawer(); }
        else if (r.page === 'data') { main.innerHTML = pageData(o); if (r.id) showProduct(r.id); else closeDrawer(); }
        else if (r.page === 'ops') { main.innerHTML = pageOps(o); closeDrawer(); }
        else if (r.page === 'incidents' && r.id) { main.innerHTML = pageIncident(o, r.id); closeDrawer(); }
        else if (r.page === 'incidents') { main.innerHTML = pageIncidents(o); closeDrawer(); }
        else { state.route.page = 'home'; renderChrome(); main.innerHTML = pageHome(o); closeDrawer(); }
      }

      function bindFleetHealth() {
        document.getElementById('view-as').addEventListener('change', function (e) {
          state.viewAs = e.target.value;
          render();
        });
        var btn = document.getElementById('report-btn');
        btn.addEventListener('click', generateReport);
        if (state.running) { btn.disabled = true; btn.textContent = 'Generating…'; }
      }

      function loadOverview() {
        return fetch(API + '/overview').then(function (r) { return r.json(); }).then(function (o) {
          state.overview = o;
          render();
        });
      }

      function generateReport() {
        if (state.running) return;
        state.running = true;
        var customerId = state.viewAs;
        var btn = document.getElementById('report-btn');
        btn.disabled = true;
        btn.textContent = 'Generating…';
        document.getElementById('reset-btn').disabled = true;
        fetch(API + '/fleet-health/report', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            customerId: customerId,
            devinUserId: localStorage.getItem('devinUserId') || '',
            devinOrgId: localStorage.getItem('devinOrgId') || '',
            devinEmail: localStorage.getItem('devinEmail') || ''
          })
        }).then(function (r) {
          return r.json().then(function (body) { return { ok: r.ok, body: body }; });
        }).then(function (res) {
          if (res.ok) {
            state.report = res.body.report;
            state.reportError = null;
            toast('ok', 'Fleet Health report generated', res.body.report.reportId + ' for ' + customer(customerId).name + ' · ' + res.body.report.engines.length + ' engines assessed.');
          } else {
            state.report = null;
            state.reportError = { customerId: customerId, reportId: null, incidentId: null, error: res.body.error };
            toast('error', 'Fleet Health report failed for ' + customer(customerId).name, 'The Fleet Health Report agent returned an error. Alert sent to the incident channel; Devin is picking it up.');
          }
          return loadOverview();
        }).then(function () {
          if (state.reportError) {
            var run = state.overview.runs.filter(function (x) { return x.customerId === customerId && x.status === 'failed'; })[0];
            var inc = state.overview.incidents.filter(function (x) { return x.customerId === customerId && x.status !== 'Resolved'; })[0];
            state.reportError.reportId = run ? run.reportId : 'n/a';
            state.reportError.incidentId = inc ? inc.id : null;
            render();
          }
        }).catch(function () {
          toast('error', 'Fleet Health report failed', 'The workbench API did not respond.');
        }).then(function () {
          state.running = false;
          document.getElementById('reset-btn').disabled = false;
          var b = document.getElementById('report-btn');
          if (b) { b.disabled = false; b.textContent = 'Generate report'; }
        });
      }

      function resetDemo() {
        if (state.running) return;
        var btn = document.getElementById('reset-btn');
        btn.disabled = true;
        fetch(API + '/fleet-health/reset', { method: 'POST' }).then(function (r) { return r.json(); }).then(function () {
          state.report = null;
          state.reportError = null;
          state.viewAs = 'AIR-A';
          return loadOverview();
        }).then(function () {
          toast('ok', 'Reset', 'Back to the opening state · all systems nominal.');
        }).catch(function () {}).then(function () { btn.disabled = false; });
      }

      document.addEventListener('click', function (e) {
        var go = e.target.closest('[data-go]');
        if (go) { location.hash = go.getAttribute('data-go'); }
      });
      window.addEventListener('hashchange', render);
      document.getElementById('drawer-x').addEventListener('click', function () {
        closeDrawer();
        var r = parseRoute();
        if (r.id && (r.page === 'agents' || r.page === 'data')) location.hash = '#/' + r.page;
      });
      document.getElementById('reset-btn').addEventListener('click', resetDemo);
      bootstrapIdentity();
      loadOverview();
    })();
  </script>
  <script src="/session-cap-banner.js"></script>
</body>
</html>
