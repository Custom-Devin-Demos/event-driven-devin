<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>선물 결제 | 카카오톡 선물하기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --yellow: #FEE500;
      --red: #F6432F;
      --ink: #191919;
      --muted: #666;
      --soft: #f7f7f7;
      --line: rgba(0, 0, 0, .06);
      --sans: system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', '맑은 고딕', 'Noto Sans KR', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: #fff;
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.55;
      word-break: keep-all;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    a { color: inherit; text-decoration: none; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .site-header { border-bottom: 1px solid var(--line); background: #fff; }
    .header-main {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1180px;
      min-height: 68px;
      margin: 0 auto;
      padding: 0 24px;
    }
    .header-icon { width: 25px; height: 25px; color: var(--ink); }
    .header-title { position: absolute; left: 50%; transform: translateX(-50%); font-size: 20px; font-weight: 800; letter-spacing: -.05em; }
    .search { width: 24px; height: 24px; }
    .tabs {
      display: flex;
      max-width: 1180px;
      min-height: 48px;
      margin: 0 auto;
      padding: 0 24px;
      align-items: stretch;
      justify-content: center;
      gap: clamp(18px, 4vw, 55px);
      color: #555;
      font-size: 14px;
      font-weight: 600;
    }
    .tabs a { display: flex; align-items: center; border-bottom: 2px solid transparent; white-space: nowrap; }
    .tabs a.active { border-color: var(--ink); color: var(--ink); }
    .page { max-width: 1180px; margin: 0 auto; padding: 24px 24px 76px; }
    .recipient {
      display: flex;
      align-items: center;
      gap: 15px;
      min-height: 76px;
      padding: 14px 20px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
    }
    .recipient-plus {
      display: inline-flex;
      width: 42px;
      height: 42px;
      align-items: center;
      justify-content: center;
      flex: 0 0 42px;
      border-radius: 50%;
      color: var(--ink);
      background: var(--yellow);
      font-size: 28px;
      font-weight: 400;
      line-height: 1;
    }
    .recipient strong { display: block; font-size: 16px; }
    .recipient small { display: block; margin-top: 2px; color: #888; font-size: 12px; }
    .content-grid { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 24px; margin-top: 34px; align-items: start; }
    .card { border: 1px solid var(--line); border-radius: 10px; background: #fff; }
    .card-head { padding: 22px 24px 17px; border-bottom: 1px solid var(--line); }
    .card-head h1, .card-head h2 { margin: 0; font-size: 22px; letter-spacing: -.06em; }
    .card-head p { margin: 6px 0 0; color: #888; font-size: 13px; }
    .form-body { padding: 22px 24px 26px; }
    .field + .field { margin-top: 20px; }
    label { display: block; margin-bottom: 8px; color: #333; font-size: 13px; font-weight: 700; }
    select, input[type="number"], textarea {
      width: 100%;
      min-width: 0;
      border: 1px solid #ddd;
      border-radius: 7px;
      color: var(--ink);
      background: #fff;
    }
    select, input[type="number"] { height: 48px; padding: 0 13px; }
    textarea { min-height: 78px; padding: 12px 13px; resize: vertical; }
    select:focus, input:focus, textarea:focus { outline: 3px solid rgba(254, 229, 0, .45); border-color: #b8a600; }
    .gift-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; margin-top: 10px; }
    .gift-chip {
      min-height: 55px;
      padding: 7px 10px;
      border: 1px solid #e3e3e3;
      border-radius: 8px;
      color: #333;
      background: #fff;
      text-align: left;
      font-size: 12px;
      line-height: 1.4;
    }
    .gift-chip strong { display: block; color: var(--red); font-size: 13px; }
    .gift-chip:hover, .gift-chip:focus { border-color: var(--ink); }
    .message-block { margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--line); }
    .message-block h2 { margin: 0 0 12px; font-size: 17px; letter-spacing: -.05em; }
    .message-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 11px; }
    .message-card {
      min-height: 62px;
      padding: 9px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: #555;
      background: linear-gradient(135deg, #fff7df, #fff);
      text-align: left;
      font-size: 12px;
    }
    .message-card:nth-child(2) { background: linear-gradient(135deg, #eaf8f7, #fff); }
    .message-card:nth-child(3) { background: linear-gradient(135deg, #f7edff, #fff); }
    .message-card b { display: block; margin-bottom: 3px; color: var(--ink); font-size: 15px; }
    .submit {
      width: 100%;
      min-height: 50px;
      margin-top: 24px;
      border: 0;
      border-radius: 8px;
      color: #000;
      background: var(--yellow);
      font-weight: 800;
    }
    .submit:hover { background: #f3d900; }
    .submit:disabled { cursor: wait; opacity: .55; }
    .reset {
      width: 100%;
      min-height: 46px;
      margin-top: 9px;
      border: 1px solid #ddd;
      border-radius: 8px;
      color: #555;
      background: #fff;
    }
    .result-box { display: none; margin-top: 18px; padding: 15px 16px; border: 1px solid #ead8d4; border-radius: 8px; background: #fff8f6; color: var(--ink); }
    .result-box.success, .result-box.error { display: block; }
    .result-box.success { border-color: #b9dfc5; background: #f3fbf5; }
    .result-box.error { border-color: #efbeb8; background: #fff5f3; }
    .result-title { margin-bottom: 4px; font-weight: 800; }
    .result-detail { font-size: 13px; line-height: 1.75; }
    .summary { position: sticky; top: 18px; }
    .summary-body { padding: 22px; }
    .summary-body h2 { margin: 0; font-size: 18px; letter-spacing: -.05em; }
    .summary-note { margin: 5px 0 18px; color: #888; font-size: 12px; }
    .summary-row { display: flex; justify-content: space-between; gap: 14px; padding: 14px 0; border-top: 1px solid var(--line); font-size: 13px; }
    .summary-row span { color: #777; }
    .summary-row strong { max-width: 68%; color: var(--ink); text-align: right; overflow-wrap: anywhere; }
    .summary-total { margin-top: 8px; padding-top: 18px; border-top: 1px solid var(--ink); }
    .summary-total span { display: block; color: #777; font-size: 12px; }
    .summary-total strong { display: block; margin-top: 4px; color: var(--red); font-size: 27px; letter-spacing: -.06em; }
    footer { padding: 24px; border-top: 1px solid var(--line); color: #888; font-size: 12px; }
    footer > div { display: flex; max-width: 1180px; margin: 0 auto; justify-content: space-between; gap: 20px; }
    @media (max-width: 760px) {
      .header-main { padding: 0 16px; }
      .tabs { justify-content: flex-start; gap: 22px; overflow-x: auto; padding: 0 16px; }
      .page { padding: 16px 14px 50px; }
      .content-grid { grid-template-columns: 1fr; margin-top: 22px; }
      .summary { position: static; grid-row: 1; }
      .checkout { grid-row: 2; }
      .form-body, .card-head, .summary-body { padding-left: 17px; padding-right: 17px; }
      footer { padding: 20px 14px; }
      footer > div { display: block; }
      footer > div > div + div { margin-top: 5px; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-main">
      <svg class="header-icon" viewBox="0 0 32 32" aria-label="선물함" role="img">
        <path d="M7 12h18v14H7zM5 8h22v5H5zM16 8v18M8 8c-2.5-4 2.5-6 8 0M24 8c2.5-4-2.5-6-8 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
      </svg>
      <div class="header-title">선물하기</div>
      <svg class="search" viewBox="0 0 32 32" aria-label="검색" role="img">
        <circle cx="14" cy="14" r="8" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="m20 20 7 7" fill="none" stroke="currentColor" stroke-width="2"/>
      </svg>
    </div>
    <nav class="tabs" aria-label="선물하기 메뉴">
      <a class="active" href="#">홈</a>
      <a href="#">랭킹</a>
      <a href="#">티켓선물</a>
      <a href="#">AI선물탐험</a>
      <a href="#">체험단</a>
    </nav>
  </header>
  <main class="page">
    <section class="recipient">
      <span class="recipient-plus" aria-hidden="true">+</span>
      <div><strong>선물할 친구를 선택해 주세요.</strong><small>받는 분을 선택하면 주문 요약에 반영됩니다.</small></div>
    </section>
    <div class="content-grid">
      <section class="card checkout">
        <div class="card-head">
          <h1>선물 결제</h1>
          <p>선물할 상품과 결제수단을 확인해 주세요.</p>
        </div>
        <div class="form-body">
          <form id="transferForm">
            <div class="field">
              <label for="fromAccount">결제수단</label>
              <select id="fromAccount">
                <option value="ACCT-1001">카카오페이 머니 (잔액 128,400원)</option>
                <option value="ACCT-1002">신용/체크카드 **** 8841</option>
                <option value="ACCT-1003">휴대폰 결제</option>
              </select>
            </div>
            <div class="field">
              <label for="toAccount">받는 분</label>
              <select id="toAccount">
                <option value="ACCT-2001">김서연 · 카카오톡 친구</option>
                <option value="ACCT-2002">이준호 · 카카오톡 친구</option>
              </select>
            </div>
            <div class="field">
              <label for="amount">결제금액</label>
              <input type="number" id="amount" value="4700" min="1000" step="100" inputmode="numeric">
              <div class="gift-list" aria-label="선물 상품 선택">
                <button type="button" class="gift-chip" data-amount="4700" data-gift="스타벅스 아이스 카페 아메리카노 T"><strong>4,700원</strong>스타벅스 아이스 카페 아메리카노 T</button>
                <button type="button" class="gift-chip" data-amount="9900" data-gift="배스킨라빈스 파인트"><strong>9,900원</strong>배스킨라빈스 파인트</button>
                <button type="button" class="gift-chip" data-amount="22000" data-gift="bhc 뿌링클 콤보"><strong>22,000원</strong>bhc 뿌링클 콤보</button>
                <button type="button" class="gift-chip" data-amount="50000" data-gift="교환권"><strong>50,000원</strong>교환권</button>
              </div>
            </div>
            <div class="field">
              <label for="accountTier">회원 등급</label>
              <select id="accountTier">
                <option value="standard" selected>일반 회원</option>
                <option value="premium">카카오톡 채널 친구 회원</option>
              </select>
            </div>
            <div class="message-block">
              <h2>선물 메시지</h2>
              <div class="message-cards" aria-label="메시지 카드 선택">
                <button type="button" class="message-card"><b>축하해요</b>따뜻한 마음을 전해요</button>
                <button type="button" class="message-card"><b>고마워요</b>감사의 마음을 담아요</button>
                <button type="button" class="message-card"><b>응원해요</b>오늘도 힘내세요</button>
              </div>
              <textarea placeholder="축하하는 마음을 담아 메시지를 남겨보세요."></textarea>
            </div>
            <button type="submit" class="submit" id="submitBtn">선물 결제하기</button>
            <button type="reset" class="reset">다시선택</button>
            <div id="result" class="result-box" role="status" aria-live="polite"></div>
          </form>
        </div>
      </section>
      <aside class="card summary">
        <div class="summary-body">
          <h2>주문 요약</h2>
          <p class="summary-note">선택한 선물과 받는 분을 기준으로 표시합니다.</p>
          <div class="summary-row"><span>선물</span><strong id="summaryGift">스타벅스 아이스 카페 아메리카노 T</strong></div>
          <div class="summary-row"><span>받는 분</span><strong id="summaryRecipient">김서연 · 카카오톡 친구</strong></div>
          <div class="summary-total"><span>결제금액</span><strong id="summaryAmount">4,700원</strong></div>
        </div>
      </aside>
    </div>
  </main>
  <footer><div><div>카카오 고객센터 · 선물하기</div><div>이용약관 · 개인정보 처리방침</div></div></footer>
  <script>
    (function () {
      if (localStorage.getItem('devinOrgId') && localStorage.getItem('devinUserId')) return;
      fetch('/api/config').then(function (response) {
        return response.json();
      }).then(function (config) {
        if (config.lockOrg && config.defaultOrgId) localStorage.setItem('devinOrgId', config.defaultOrgId);
        if (config.lockUser && config.defaultUserId) localStorage.setItem('devinUserId', config.defaultUserId);
      }).catch(function () {});
    })();
  </script>
  <script>
    (function () {
      var form = document.getElementById('transferForm');
      var amount = document.getElementById('amount');
      var recipient = document.getElementById('toAccount');
      var summaryGift = document.getElementById('summaryGift');
      var summaryRecipient = document.getElementById('summaryRecipient');
      var summaryAmount = document.getElementById('summaryAmount');
      var defaultAmount = amount.value;
      var defaultGift = document.querySelector('.gift-chip[data-amount="' + defaultAmount + '"]').dataset.gift;
      function updateSummary() {
        var value = Number(amount.value) || 0;
        var chip = document.querySelector('.gift-chip[data-amount="' + amount.value + '"]');
        summaryGift.textContent = chip ? chip.dataset.gift : '선택한 선물';
        summaryRecipient.textContent = recipient.options[recipient.selectedIndex].textContent;
        summaryAmount.textContent = value.toLocaleString('ko-KR') + '원';
      }
      amount.addEventListener('input', updateSummary);
      recipient.addEventListener('change', updateSummary);
      document.querySelectorAll('.gift-chip[data-amount]').forEach(function (chip) {
        chip.addEventListener('click', function () {
          amount.value = chip.dataset.amount;
          amount.dispatchEvent(new Event('input', { bubbles: true }));
        });
      });
      form.addEventListener('reset', function () {
        setTimeout(function () {
          amount.value = defaultAmount;
          var chip = document.querySelector('.gift-chip[data-gift="' + defaultGift + '"]');
          if (chip) summaryGift.textContent = chip.dataset.gift;
          updateSummary();
        }, 0);
      });
      updateSummary();
    })();
  </script>
  <script>
    function formatWon(value) {
      return Number(value).toLocaleString('ko-KR', { maximumFractionDigits: 0 });
    }

    document.getElementById('transferForm').addEventListener('submit', async function (event) {
      event.preventDefault();
      var button = document.getElementById('submitBtn');
      var result = document.getElementById('result');
      button.disabled = true;
      button.textContent = '결제 처리 중...';
      result.className = 'result-box';
      try {
        var response = await fetch('/api/banking/transfer', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            fromAccount: document.getElementById('fromAccount').value,
            toAccount: document.getElementById('toAccount').value,
            amount: parseFloat(document.getElementById('amount').value),
            accountTier: document.getElementById('accountTier').value,
            devinUserId: localStorage.getItem('devinUserId') || '',
            devinOrgId: localStorage.getItem('devinOrgId') || '',
            devinEmail: localStorage.getItem('devinEmail') || ''
          })
        });
        var data = await response.json();
        if (!response.ok) {
          result.className = 'result-box error';
          result.textContent = '선물 결제를 완료하지 못했습니다. 잠시 후 다시 시도해 주세요.';
        } else {
          result.className = 'result-box success';
          result.innerHTML = '<div class="result-title">선물 결제 완료</div><div class="result-detail">' + formatWon(data.debitAmount) + '원 결제가 완료되었습니다 (결제 수수료 ' + formatWon(data.fee) + '원 포함)<br>주문번호 ' + data.transferId + '</div>';
        }
      } catch (error) {
        result.className = 'result-box error';
        result.textContent = '선물 결제를 완료하지 못했습니다. 잠시 후 다시 시도해 주세요.';
      } finally {
        button.disabled = false;
        button.textContent = '선물 결제하기';
      }
    });
  </script>
  <script src="/session-cap-banner.js"></script>
</body>
</html>
