<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harbor Federal · Card Activity · DEMO ENVIRONMENT</title>
<meta name="robots" content="noindex, nofollow">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #e9edf2; color: #14202e; display: flex; justify-content: center; padding: 28px 12px; min-height: 100vh; }
  .phone { width: 390px; max-width: 100%; background: #f6f8fb; border-radius: 34px; box-shadow: 0 18px 50px rgba(20,32,46,.18); overflow: hidden; border: 1px solid #d5dce5; display: flex; flex-direction: column; min-height: 760px; }
  .status { height: 40px; display: flex; justify-content: space-between; align-items: center; padding: 0 26px; font-size: 13px; font-weight: 600; background: #0f5a4a; color: #fff; }
  .top { background: #0f5a4a; color: #fff; padding: 10px 22px 26px; }
  .top .bank { font-size: 13px; opacity: .85; letter-spacing: .02em; }
  .top .acct { font-size: 20px; font-weight: 600; margin-top: 4px; }
  .top .sub { font-size: 13px; opacity: .8; margin-top: 2px; }
  .demo { margin: 14px 16px 0; background: #fff6d6; border: 1px solid #ecd78a; color: #6b5310; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-align: center; padding: 6px; border-radius: 8px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: #5b6878; padding: 18px 22px 8px; font-weight: 600; }
  .list { background: #fff; margin: 0 12px; border-radius: 14px; border: 1px solid #e1e6ec; overflow: hidden; }
  .tx { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; padding: 14px 14px; border-top: 1px solid #edf0f4; }
  .tx:first-child { border-top: 0; }
  .ico { width: 40px; height: 40px; border-radius: 20px; background: #eef1f5; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #34465a; }
  .m { font-size: 15px; font-weight: 600; letter-spacing: .01em; }
  .t { font-size: 12px; color: #6b7889; margin-top: 2px; }
  .amt { text-align: right; font-size: 15px; font-weight: 600; }
  .amt.void { color: #8c97a5; text-decoration: line-through; }
  .pill { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 10px; margin-top: 4px; }
  .pill.pending { background: #fff1d6; color: #8a5a00; }
  .pill.voided { background: #eceff3; color: #5b6878; }
  .pill.settled { background: #dcf3e8; color: #106b48; }
  .empty { padding: 28px 18px; text-align: center; color: #6b7889; font-size: 14px; }
  .foot { margin-top: auto; padding: 18px 22px 22px; font-size: 11px; color: #7c8796; text-align: center; }
</style>
</head>
<body>
<div class="phone">
  <div class="status"><span id="clock">9:41</span><span>●●● 5G ▮</span></div>
  <div class="top">
    <div class="bank">Harbor Federal</div>
    <div class="acct">Visa Signature ···· <span id="last4">4242</span></div>
    <div class="sub">Claire Mallory · Card activity</div>
  </div>
  <div class="demo">DEMO ENVIRONMENT · SYNTHETIC DATA</div>
  <h2>Recent activity</h2>
  <div class="list" id="list"><div class="empty">Loading…</div></div>
  <div class="foot">Fictional bank. Shows sandbox authorizations from Meridian Pay for card token tok_claire_visa_4242. Updates every 2 seconds.</div>
</div>
<script>
(function () {
  'use strict';
  var TOKEN = 'tok_claire_visa_4242';
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function money(n, cur) { return (cur && cur !== 'USD' ? cur + ' ' : '$') + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function when(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' · ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', second: '2-digit' });
  }
  function status(s) {
    s = String(s || '').toUpperCase();
    if (s === 'VOIDED' || s === 'CANCELLED') return { cls: 'voided', label: 'Voided' };
    if (s === 'CAPTURED' || s === 'SETTLED' || s === 'PAID') return { cls: 'settled', label: 'Settled' };
    return { cls: 'pending', label: 'Pending' };
  }
  function render(d) {
    if (d.card && d.card.last4) document.getElementById('last4').textContent = d.card.last4;
    var rows = (d.authorizations || []).slice().sort(function (a, b) { return String(b.createdAt).localeCompare(String(a.createdAt)); });
    var list = document.getElementById('list');
    if (!rows.length) { list.innerHTML = '<div class="empty">No recent card activity.</div>'; return; }
    list.innerHTML = rows.map(function (a) {
      var st = status(a.status);
      return '<div class="tx"><div class="ico">RL</div><div><div class="m">' + esc(a.descriptor || 'RALPH LAUREN') + '</div>' +
        '<div class="t">' + esc(when(a.createdAt)) + '</div></div>' +
        '<div><div class="amt' + (st.cls === 'voided' ? ' void' : '') + '">' + money(a.amount, a.currency) + '</div>' +
        '<div style="text-align:right"><span class="pill ' + st.cls + '">' + st.label + '</span></div></div></div>';
    }).join('');
  }
  function poll() {
    fetch('/api/f63013c0/bank?cardToken=' + encodeURIComponent(TOKEN)).then(function (r) { return r.json(); }).then(render).catch(function () {});
    document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }).replace(/\s?[AP]M/, '');
  }
  poll();
  setInterval(poll, 2000);
})();
</script>
</body>
</html>
