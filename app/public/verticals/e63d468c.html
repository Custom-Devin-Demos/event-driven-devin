    <li><b>Started:</b> after node group <code>fleet-al2</code> (Amazon Linux 2) scaled 2 → 0 and pods moved to <code>fleet</code> (Amazon Linux 2023) nodes</li></ul>
    <p><b>Steps to investigate</b></p><ol><li>Check the pods in <a href="#/kubernetes/pods">Kubernetes Explorer</a></li><li>Check container logs for the startup memory sizing line</li></ol>
    <p class="mono" style="color:#5f6b77">${S.monitor.notify.join(" ")}</p>` :
    `<h2>No alert in the selected window</h2><p>telemetry-ingest is healthy: ${ready}/${S.replicas.desired} replicas available on prod-east.</p><p class="mono" style="color:#5f6b77">Notifies ${S.monitor.notify.join(" ")}</p>`;
  const n = S.notification;
  const deliv = `<div class="sent"><span class="dot ${!n ? "n" : n.status === "sent" ? "g" : n.status === "error" ? "r" : "y"}"></span># slack-automated-alerts<span style="margin-left:auto;color:#5f6b77">${n ? esc(n.status) : "—"}</span></div>`;
  return topbar(`<span class="ico">◔</span> Monitors <span class="sep">›</span> Status`, "", alerted ? "alerting" : "") +
    `<div class="hdr"><div class="row"><span class="pill ${st}">${st}</span><span class="btn">🔈 Not Muted ▾</span><span class="btn">✓ Resolve</span><span class="div"></span>
     <span>Metric Monitor</span><span class="div"></span><span>Created Nov 3, 2026</span><span class="chip">Priority P1</span><span class="chip">Platform Team</span></div>
     <h1>${esc(S.monitor.name)}</h1><div>${tags}</div></div>
    <div class="ctrl"><div class="field">status<span class="box">* ▾</span></div><div class="field">kube_cluster_name<span class="box">prod-east ▾</span></div>
     <div class="field">kube_deployment<span class="box">telemetry-ingest ▾</span></div><div class="timebox"><span class="badge">15m</span>Past 15 Minutes <span class="live">LIVE</span></div></div>
    <div class="layout"><section><h3>Selected Event</h3>
      ${sel ? `<div style="padding:8px;border-radius:3px;background:${sel.status === "ALERT" ? "#fdecef" : "#eef8f1"};margin-bottom:14px">${fmtClock(sel.t)} <span class="pill ${sel.status}">${sel.status}</span></div>` : `<div class="empty" style="padding:10px 0">No events</div>`}
      <h3>Event timeline</h3><ul class="timeline">${evs.map((e) => `<li class="${e.status}">${fmtDay(e.t)} <span class="pill ${e.status}">${e.status}</span><br><span class="tag">kube_cluster_name:prod-east</span></li>`).join("") || "<li>No state changes in the past 15 minutes</li>"}</ul></section>
     <section><div class="graphwrap"><div class="gt"><b>Monitor behavior</b><span class="pill ${st}">${st}</span><span class="tag">kube_deployment:telemetry-ingest</span><span style="margin-left:auto;color:#5f6b77">replicas available: <b>${ready}</b> / ${S.replicas.desired}</span></div>${graph(760, 170)}</div>
      <div class="msg"><h3>Event Details</h3>${msg}</div><h3 style="margin-top:16px">Query</h3><div class="qbox mono">${esc(S.monitor.query)}</div></section>
     <section class="side"><h3>${alerted ? "Automatically Triggered" : "Notifications"}</h3><div style="color:#5f6b77;font-size:12px">Message sent to</div>${deliv}
      <h4>Next Steps</h4><span class="btn">🔈 Not Muted ▾</span><span class="btn">✓ Resolve</span><span class="btn">⚠ Declare Incident</span><span class="btn">▤ Create Case</span>
      <h4>Investigate</h4><a href="#/kubernetes/pods">Kubernetes Explorer: prod-east / fleet</a><br><a href="#/events">Event stream: kube_cluster_name:prod-east</a></section></div>`;
}
function stClass(s) { return s === "Running" ? "run" : s === "ContainerCreating" ? "pend" : s === "Terminating" ? "term" : "bad"; }
function viewPods(nodesView) {
  const pods = allPods();
  const counts = { Running: 0, Bad: 0 }; pods.forEach((p) => (p.status === "Running" ? counts.Running++ : counts.Bad++));
  const al2 = S.nodes.filter((n) => n.nodeGroup === "fleet-al2").length;
  const left = `<div class="facets"><div class="reslist"><div class="h">Select Resources</div><a>Processes</a><a>Containers</a>
    <div class="grp">⎈ Kubernetes</div><a class="sub ${nodesView ? "" : "on"}" href="#/kubernetes/pods">Pods</a><a class="sub">Clusters</a><a class="sub">Namespaces</a>
    <a class="sub ${nodesView ? "on" : ""}" href="#/kubernetes/nodes">Nodes</a><a class="sub">Workloads ›</a></div>
    <div class="facet"><div class="t">Status</div><label><span><span class="dot g"></span> Running</span><span>${counts.Running}</span></label><label><span><span class="dot r"></span> Not ready</span><span>${counts.Bad}</span></label></div>
    <div class="facet"><div class="t">Cluster</div><label><span>prod-east</span><span>${pods.length}</span></label></div>
    <div class="facet"><div class="t">Node group</div><label><span>fleet</span><span>3</span></label><label><span>fleet-al2</span><span>${al2}</span></label></div></div>`;
  const head = nodesView ? `<tr><th>Node</th><th>Status</th><th>Node group</th><th>OS image</th><th>Kubelet</th><th>Zone</th><th>Pods</th></tr>`
    : `<tr><th>↑ Pod</th><th>Status</th><th>Cluster</th><th>Namespace</th><th>Node</th><th>Age</th><th>Ready</th><th>Restarts</th><th>% CPU</th><th>% Mem</th></tr>`;
  const rows = nodesView ? S.nodes.map((n) => `<tr><td>${n.name}</td><td><span class="st run">${n.status}</span></td><td>${n.nodeGroup}</td><td>${n.osImage}</td><td>${n.kubelet}</td><td>${n.zone}</td><td>${pods.filter((p) => p.node === n.name).length}</td></tr>`).join("")
    : pods.map((p) => `<tr class="click ${selPod === p.name ? "selrow" : ""}" onclick="openPod('${p.name}')"><td>${p.name}</td><td><span class="st ${stClass(p.status)}">${p.status}</span></td><td><a>prod-east</a></td><td><a>${p.ns}</a></td><td>${p.node.split(".")[0]}</td><td>${p.age}</td><td>${p.ready}</td><td>${p.restarts}</td><td>${p.cpu.toFixed(2)}%<div class="bar"><i style="width:${Math.min(100, p.cpu * 10)}%"></i></div></td><td>${p.mem}%<div class="bar"><i class="${p.mem >= 95 ? "hot" : ""}" style="width:${p.mem}%"></i></div></td></tr>`).join("");
  return topbar(`<span class="ico">⎈</span> Kubernetes ▾`, `<a>Overview</a><a class="on">Explorer</a>`) +
    `<div class="k8s">${left}<div><div class="filterbar"><span>Filter by</span><input value="kube_cluster_name:prod-east" readonly></div>
     <div class="summary"><span>Showing 1–${nodesView ? S.nodes.length : pods.length} of ${nodesView ? S.nodes.length : pods.length} ${nodesView ? "Nodes" : "Pods"}</span><span class="live">LIVE</span><span>${fmtClock(now())}</span></div>
     <table class="grid">${head}${rows}</table></div></div>${!nodesView && selPod ? podPanel(pods.find((p) => p.name === selPod)) : ""}`;
}
function podPanel(p) {
  if (!p) return "";
  const node = nodeByName(p.node), ls = p.lastState;
  const logs = p.ingest ? p.logs.map((l) => `<span class="dim">${fmtClock(now() - 20000)} stdout</span> ${esc(l)}`).join("\n") + (ls ? `\n<span class="err">container exited: ${ls.reason} (exit code ${ls.exitCode})</span>` : "") : `<span class="dim">${fmtClock(now() - 5000)} stdout</span> GET /healthz 200`;
  const body = podTab === "logs" ? `<div class="logs">${logs}</div>` : `<div class="kv">
    <div>Status</div><div><span class="st ${stClass(p.status)}">${p.status}</span></div><div>Namespace</div><div>${p.ns}</div>
    <div>Node</div><div>${node.name}</div><div>Node group</div><div>${node.nodeGroup}</div><div>Node OS image</div><div>${node.osImage}</div><div>Kubelet</div><div>${node.kubelet}</div>
    <div>Container</div><div>${p.ingest ? "telemetry-ingest" : p.name.split("-").slice(0, p.ns === "fleet" || p.ns === "web" ? -2 : -1).join("-")}</div>
    ${p.ingest ? `<div>Image</div><div class="mono">${esc(p.image)}</div><div>Resources</div><div class="mono">requests.memory ${esc(p.resources.requests.memory)} · limits.memory ${esc(p.resources.limits.memory)}</div><div>Env</div><div class="mono">${p.env.length ? esc(p.env.join(", ")) : "none"}</div>` : ""}
    <div>Restarts</div><div>${p.restarts}</div>${ls ? `<div>Last state</div><div><span class="st bad">Terminated</span> ${ls.reason} · exit code ${ls.exitCode}</div>` : ""}</div>`;
  return `<div class="panel"><header><span class="st ${stClass(p.status)}">${p.status}</span><b>${p.name}</b><span class="x" onclick="closePod()">×</span></header>
    <div class="ptabs"><a class="${podTab === "overview" ? "on" : ""}" onclick="setPodTab('overview')">Overview</a><a class="${podTab === "logs" ? "on" : ""}" onclick="setPodTab('logs')">Logs</a><a>Events</a><a>YAML</a></div><div class="pbody">${body}</div></div>`;
}
window.openPod = (n) => { selPod = n; render(); };
window.closePod = () => { selPod = null; render(); };
window.setPodTab = (t) => { podTab = t; render(); };
function viewEvents() {
  return topbar(`<span class="ico">⚑</span> Events`, `<a class="on">Explorer</a><a>Pipelines</a><a>Correlation</a>`) +
    `<div class="filterbar"><span>Search</span><input value="kube_cluster_name:prod-east" readonly></div>
     <div class="page" style="padding-top:0"><div class="evlist">${events().map((e) => `<div class="ev ${e.status || ""}"><div class="when">${fmtDay(e.t)}</div><div class="src">${SRC[e.src] || "•"}</div><div><div class="title">${esc(e.title)}</div><div class="body">${esc(e.body)}</div></div></div>`).join("")}</div></div>`;
}
function demoPanel() {
  const failed = !!S.retiredAt && S.status === "ALERT";
  const phase = !S.retiredAt ? "prod-east healthy. fleet-al2 still has 2 Amazon Linux 2 nodes running telemetry-ingest."
    : failed ? "fleet-al2 retired. telemetry-ingest crash-looping, monitor in ALERT." : "fleet-al2 retired. telemetry-ingest healthy on Amazon Linux 2023.";
  $("#demo").classList.toggle("failed", !!S.retiredAt);
  $("#demoBody").innerHTML = `<div class="note"><b>${phase}</b></div>
    <button class="btn danger" id="retireBtn" ${S.retiredAt || busy ? "disabled" : ""}>Retire AL2 node group (fleet-al2 2 → 0)</button>
    <button class="reset" id="resetBtn" title="Put prod-east back to its opening state: fleet-al2 restored, pods healthy, monitor OK">Reset</button>`;
  $("#retireBtn").onclick = retire;
  $("#resetBtn").onclick = resetDemo;
}
function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.remove("hidden"); clearTimeout(toast.h); toast.h = setTimeout(() => el.classList.add("hidden"), 5500); }
function devinIds() { return { devinUserId: localStorage.getItem("devinUserId") || "", devinOrgId: localStorage.getItem("devinOrgId") || "", devinEmail: localStorage.getItem("devinEmail") || "" }; }
async function retire() {
  if (busy || (S && S.retiredAt)) return;
  busy = true; demoPanel(); toast("fleet-al2 scaling 2 → 0 · draining Amazon Linux 2 nodes");
  try {
    const r = await fetch(API + "/nodegroups/retire", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(devinIds()) });
    const d = await r.json(); apply(d);
    toast(r.ok ? "telemetry-ingest rescheduled onto fleet · 2/2 ready" : `[Triggered] ${d.errorClass}: telemetry-ingest ${d.replicas.ready}/${d.replicas.desired} ready on prod-east`);
    if (!r.ok) location.hash = "#/monitors/" + S.monitor.id;
  } catch (e) { toast("Request failed: " + e.message); } finally { busy = false; render(); }
}
async function resetDemo() {
  const r = await fetch(API + "/nodegroups/retire/reset", { method: "POST" });
  apply(await r.json()); selPod = null; podTab = "overview"; render(); toast("Reset · back to standby");
}
function apply(d) { S = d; skew = d.now - Date.now(); }
function render() {
  if (!S) return;
  const h = location.hash || "#/monitors/" + S.monitor.id;
  let html, nav;
  if (h.startsWith("#/kubernetes")) { html = viewPods(h.includes("nodes")); nav = "infra"; document.title = "Kubernetes Explorer | e63d468c"; }
  else if (h.startsWith("#/events")) { html = viewEvents(); nav = "events"; document.title = "Event Explorer | e63d468c"; }
  else if (/#\/monitors\/\d+/.test(h)) { html = viewMonitor(); nav = "monitors"; document.title = `${monitorStatus() === "ALERT" ? "[Alert] " : ""}Monitor Status | e63d468c`; }
  else { html = viewMonitors(); nav = "monitors"; document.title = "Manage Monitors | e63d468c"; }
  const y = window.scrollY; $("#app").innerHTML = html; window.scrollTo(0, y);
  document.querySelectorAll(".sidenav a").forEach((a) => a.classList.toggle("active", a.dataset.nav === nav));
  demoPanel();
}
async function refresh() { try { const r = await fetch(API + "/cluster"); apply(await r.json()); render(); } catch (e) { /* server restarting */ } }
window.addEventListener("hashchange", () => { selPod = null; render(); });
document.addEventListener("keydown", (e) => { if (e.shiftKey && e.key.toLowerCase() === "d" && !/input|textarea/i.test(e.target.tagName)) $("#demo").classList.toggle("hidden"); });
$("#demoToggle").onclick = () => $("#demo").classList.toggle("hidden");
$("#demoClose").onclick = () => $("#demo").classList.add("hidden");
refresh(); setInterval(refresh, 5000);
(function () {
  if (localStorage.getItem("devinOrgId") && localStorage.getItem("devinUserId")) return;
  fetch("/api/config").then((r) => r.json()).then((cfg) => {
    if (cfg.lockOrg && cfg.defaultOrgId) localStorage.setItem("devinOrgId", cfg.defaultOrgId);
    if (cfg.lockUser && cfg.defaultUserId) localStorage.setItem("devinUserId", cfg.defaultUserId);
  }).catch(() => {});
})();
</script>
<script src="/session-cap-banner.js"></script>
