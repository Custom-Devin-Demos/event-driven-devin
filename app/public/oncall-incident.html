<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEV-1 Incident Console</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <style>
    * { box-sizing: border-box; }
    :root {
      --accent: #2563eb;
      --ink: #17202b;
      --surface: #ffffff;
      --chrome-bg: #17202b;
      --chrome-text: #ffffff;
      --surface-muted: color-mix(in srgb, var(--surface) 96%, var(--ink));
      --ink-muted: color-mix(in srgb, var(--ink) 55%, var(--surface));
      --line: color-mix(in srgb, var(--ink) 14%, transparent);
      --accent-wash: color-mix(in srgb, var(--accent) 9%, var(--surface));
      --accent-strong: color-mix(in srgb, var(--accent) 82%, var(--ink));
      --shadow: 0 2px 12px color-mix(in srgb, var(--ink) 8%, transparent);
      --radius: 12px;
      --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    html { background: var(--surface-muted); }
    body {
      min-height: 100vh; margin: 0; overflow-x: hidden;
      background: var(--surface-muted); color: var(--ink);
      font: 400 15px/1.55 var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    .disclaimer {
      padding: 8px 16px; background: var(--chrome-bg); color: var(--chrome-text);
      font-size: 12px; font-weight: 600; text-align: center;
    }
    header {
      background: var(--surface); border-bottom: 1px solid var(--line);
      padding: 18px 24px;
    }
    .header-inner, main { width: min(920px, calc(100% - 48px)); margin: 0 auto; }
    .lockup { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand-mark {
      width: 40px; height: 40px; flex: 0 0 auto; border-radius: 10px;
      display: grid; place-items: center; background: var(--accent); color: var(--surface);
      font-size: 18px; font-weight: 800;
    }
    .brand-name { font-size: 18px; font-weight: 750; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .brand-sub { margin-top: 2px; color: var(--ink-muted); font-size: 13px; }
    main { padding: 44px 0 72px; }
    .eyebrow { color: var(--accent); font-size: 12px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; }
    h1 { margin: 8px 0 10px; font-size: clamp(28px, 5vw, 42px); line-height: 1.1; letter-spacing: -.03em; }
    .intro { max-width: 680px; margin: 0; color: var(--ink-muted); font-size: 16px; }
    .grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(280px, .65fr); gap: 22px; margin-top: 30px; }
    .card {
      min-width: 0; padding: 26px; background: var(--surface);
      border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
    }
    .card h2 { margin: 0 0 6px; font-size: 19px; line-height: 1.25; }
    .card-desc { margin: 0 0 20px; color: var(--ink-muted); }
    .state { min-height: 108px; }
    .empty { color: var(--ink-muted); }
    .incident {
      padding: 16px; border-left: 3px solid var(--accent);
      background: var(--accent-wash); border-radius: 0 8px 8px 0;
    }
    .incident + .incident { margin-top: 12px; }
    .incident-title { font-weight: 750; }
    .incident dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; margin: 12px 0 0; font-size: 13px; }
    .incident dt { color: var(--ink-muted); }
    .incident dd { margin: 0; overflow-wrap: anywhere; }
    .kind-label { margin: 0 0 8px; font-weight: 750; }
    .kind-summary { margin: 0 0 22px; color: var(--ink-muted); }
    button {
      min-height: 46px; width: 100%; padding: 10px 18px; border: 0; border-radius: 999px;
      background: var(--accent); color: var(--surface); cursor: pointer;
      font: 700 15px var(--sans); transition: background .15s, opacity .15s;
    }
    button:hover { background: var(--accent-strong); }
    button:disabled { cursor: default; opacity: .62; }
    .status {
      min-height: 24px; margin-top: 14px; padding: 10px 12px; border-radius: 8px;
      color: var(--ink-muted); background: var(--surface-muted); font-size: 13px;
    }
    .status.ok { color: var(--ink); background: var(--accent-wash); }
    .status.error { color: var(--ink); background: color-mix(in srgb, var(--accent) 14%, var(--surface)); }
    footer { padding: 18px 24px; background: var(--chrome-bg); color: var(--chrome-text); font-size: 12px; }
    @media (max-width: 700px) {
      .header-inner, main { width: min(100% - 32px, 920px); }
      header { padding: 16px; }
      main { padding: 32px 0 52px; }
      .grid { grid-template-columns: 1fr; }
      .card { padding: 22px; }
    }
  </style>
</head>
<body>
  <div class="disclaimer" id="disclaimer"></div>
  <header>
    <div class="header-inner lockup">
      <div class="brand-mark" id="brand-mark" aria-hidden="true"></div>
      <div>
        <div class="brand-name" id="brand-name"></div>
        <div class="brand-sub" id="brand-sub"></div>
      </div>
    </div>
  </header>

  <main>
    <div class="eyebrow">Major incident operations</div>
    <h1>SEV-1 incident console</h1>
    <p class="intro" id="intro"></p>

    <div class="grid">
      <section class="card">
        <h2>Live incident status</h2>
        <p class="card-desc">Open incidents declared for this session.</p>
        <div class="state" id="incident-state" aria-live="polite">
          <p class="empty">Loading incident state.</p>
        </div>
      </section>

      <section class="card">
        <h2>Declare incident</h2>
        <p class="card-desc">Declare the SEV-1 associated with this service.</p>
        <div class="kind-label" id="kind-label">Loading incident definition.</div>
        <p class="kind-summary" id="kind-summary"></p>
        <button id="declare-incident" type="button">Declare SEV-1 incident</button>
        <div class="status" id="declare-status" aria-live="polite"></div>
      </section>
    </div>
  </main>

  <footer id="footer"></footer>

  <script>
    var SKIN = window.ONCALL_SKIN || null;
    var incidentKind = SKIN && SKIN.incidentKind ? SKIN.incidentKind : 'banking-transfers';
    var incidentStory = null;

    function escapeHtml(value) {
      return String(value == null ? '' : value).replace(/[&<>"']/g, function (character) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[character];
      });
    }

    function applySkin() {
      if (!SKIN) return;
      document.title = 'SEV-1 Incident Console — ' + SKIN.company;
      Object.keys(SKIN.theme || {}).forEach(function (key) {
        if (/^--(accent|ink|surface|chrome-bg|chrome-text)$/.test(key)) {
          document.documentElement.style.setProperty(key, SKIN.theme[key]);
        }
      });
      document.getElementById('brand-mark').textContent = SKIN.brandMark || SKIN.company.charAt(0);
      document.getElementById('brand-name').textContent = SKIN.company;
      document.getElementById('brand-sub').textContent = 'SEV-1 incident console';
      document.getElementById('intro').textContent = 'Declare and monitor the major incident for the ' + SKIN.vertical + ' service.';
      document.getElementById('footer').textContent = SKIN.company + ' · Incident operations';
      document.getElementById('disclaimer').textContent = SKIN.disclaimer || '';
      document.getElementById('disclaimer').style.display = SKIN.disclaimer ? 'block' : 'none';
    }

    function setDeclareStatus(ok, text) {
      var status = document.getElementById('declare-status');
      status.className = 'status ' + (ok ? 'ok' : 'error');
      status.textContent = text;
    }

    function renderState(entries) {
      var state = document.getElementById('incident-state');
      state.textContent = '';
      if (!entries.length) {
        var empty = document.createElement('p');
        empty.className = 'empty';
        empty.textContent = 'No open incidents.';
        state.appendChild(empty);
        return;
      }
      entries.forEach(function (entry) {
        var article = document.createElement('article');
        article.className = 'incident';
        var title = document.createElement('div');
        title.className = 'incident-title';
        title.textContent = entry.label || 'SEV-1 incident';
        var details = document.createElement('dl');
        [
          ['Public IR id', entry.publicId ? 'IR-' + entry.publicId : 'Pending provider id'],
          ['Incident ref', entry.runRef],
          ['Declared', new Date(entry.declaredAt).toLocaleString()],
          ['Auto-resolves in', entry.status === 'resolved' ? 'Resolved' : Math.ceil(entry.msRemaining / 1000) + ' seconds'],
        ].forEach(function (pair) {
          var term = document.createElement('dt');
          term.textContent = pair[0];
          var value = document.createElement('dd');
          value.textContent = pair[1] == null ? '' : String(pair[1]);
          details.appendChild(term);
          details.appendChild(value);
        });
        article.appendChild(title);
        article.appendChild(details);
        state.appendChild(article);
      });
    }

    function loadState() {
      return fetch('/api/oncall/incident/state', { credentials: 'same-origin' })
        .then(function (response) { return response.json(); })
        .then(renderState)
        .catch(function (error) {
          var state = document.getElementById('incident-state');
          state.textContent = 'Incident state unavailable: ' + error.message;
        });
    }

    function loadKind() {
      return fetch('/api/oncall/incident/kinds', { credentials: 'same-origin' })
        .then(function (response) { return response.json(); })
        .then(function (kinds) {
          incidentStory = kinds.find(function (kind) { return kind.id === incidentKind; });
          if (!incidentStory) throw new Error('No incident definition available.');
          document.getElementById('kind-label').textContent = incidentStory.label;
          document.getElementById('kind-summary').textContent = incidentStory.summary;
        })
        .catch(function (error) {
          document.getElementById('kind-label').textContent = 'Incident definition unavailable';
          document.getElementById('kind-summary').textContent = error.message;
          document.getElementById('declare-incident').disabled = true;
        });
    }

    document.getElementById('declare-incident').addEventListener('click', function () {
      var button = document.getElementById('declare-incident');
      button.disabled = true;
      setDeclareStatus(true, 'Declaring incident…');
      fetch('/api/oncall/incident', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ kind: incidentKind }),
      })
        .then(function (response) {
          return response.json().then(function (data) { return { code: response.status, data: data }; });
        })
        .then(function (outcome) {
          var data = outcome.data;
          if (outcome.code === 200 && data.provider === 'datadog') {
            setDeclareStatus(true, 'SEV-1 declared (IR-' + (data.publicId || data.id) + ', ref ' + data.runRef + '). Slack channel incoming…');
          } else if (outcome.code === 200) {
            setDeclareStatus(true, 'SEV-1 posted to ' + data.channel + ' (ref ' + data.runRef + ').');
          } else {
            setDeclareStatus(false, data.error || 'Failed to declare incident.');
          }
          return loadState();
        })
        .catch(function (error) { setDeclareStatus(false, error.message); })
        .finally(function () { button.disabled = false; });
    });

    applySkin();
    loadKind();
    loadState();
    setInterval(loadState, 5000);
  </script>
</body>
</html>
